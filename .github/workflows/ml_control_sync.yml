name: Mercado Libre — control diario

# Reputación, reclamos, envíos Flex/Colecta y alertas de peso y medidas de las dos cuentas → tablas mlc_* de Supabase.
# Solo lee de Mercado Libre. GitHub suele arrancar los crons con horas de retraso: la pantalla muestra de cuándo es el dato.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      dias_envios:
        description: "Días de ventas a repasar para los envíos (vacío = lo normal)"
        required: false
        default: ""

concurrency:
  group: ml-control-sync
  cancel-in-progress: false

jobs:
  ml_control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r reposicion/requirements.txt
      - run: python3 -m reposicion.ml_control_sync --aplicar ${DIAS:+--dias-envios "$DIAS"}
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          ML_PRET_CLIENT_SECRET: ${{ secrets.ML_PRET_CLIENT_SECRET }}
          TN_PRET_TOKEN: ${{ secrets.TN_PRET_TOKEN }}
          TN_LAVAN_TOKEN: ${{ secrets.TN_LAVAN_TOKEN }}
          DIAS: ${{ github.event.inputs.dias_envios }}
