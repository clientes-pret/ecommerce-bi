<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F4F0">
<title>Reposición — Historial de pedidos</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff;
    --ok:#1e7e34; --parcial:#b8860b; --enviado:#2b4a7a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { padding: 16px 20px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .pedido { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .pedido-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .unidad-medida { color: var(--muted); font-size: 13px; margin-right: 8px; }
  .unidad-medida select { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; margin-left: 6px; }
  .pedido-header:hover { background: #FAF9F6; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .badge.enviado { background: var(--enviado); }
  .badge.recibido_parcial { background: var(--parcial); }
  .badge.recibido_completo { background: var(--ok); }
  .badge.cancelado, .badge.reemplazado, .badge.pasado, .badge.cerrado { background: #444; }
  .pase { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .pase select { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  .pase button { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  tr.inactiva td { color: var(--muted); }
  .proveedor { font-weight: 600; flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .detalle { display: none; padding: 0 16px 14px; }
  .detalle table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detalle th, .detalle td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  .detalle th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .pedido-acciones { margin-top: 12px; display: flex; gap: 8px; }
  .pedido-acciones button { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .pedido-acciones button:hover { background: #FAF9F6; }
  .pedido-acciones button:disabled { opacity: 0.5; cursor: default; }
  .qty-edit { width: 70px; background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  .total-cell { font-weight: 600; }
  #status { padding: 20px; color: var(--muted); }
  .filtros-estado { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 0 16px; font-size: 13px; color: var(--muted); }
  .filtros-estado label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
</style>
<link rel="stylesheet" href="tema.css?v=1">
</head>
<body>
<main>
  <h1>📋 Historial de pedidos (órdenes de compra)</h1>
  <div class="filtros-estado">
    <label><input type="checkbox" class="filtro-estado" value="enviado" checked> Enviado</label>
    <label><input type="checkbox" class="filtro-estado" value="recibido_parcial" checked> Recibido parcial</label>
    <label><input type="checkbox" class="filtro-estado" value="recibido_completo"> Recibido completo</label>
    <label><input type="checkbox" class="filtro-estado" value="cancelado"> Cancelado</label>
  </div>
  <div id="status">Cargando…</div>
  <div id="lista"></div>
</main>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/logo-black-base64.js"></script>
<script src="app.js?v=20261127"></script>
<script>
renderNav("pedidos");

const ESTADO_LABEL = {
  enviado: "Enviado", recibido_parcial: "Recibido parcial",
  recibido_completo: "Recibido completo", cancelado: "Cancelado",
};
// DESTINO_LABEL y generarPDF() vienen de app.js — compartidos con pedido.html.

// Mismo criterio que pedido.html: una fila por SKU con columnas Depósito/
// Full/Total en vez de una fila por destino, ordenado por nombre A-Z.
function agruparItemsPorSku(items) {
  const bySku = new Map();
  for (const it of items) {
    if (!bySku.has(it.sku)) bySku.set(it.sku, { sku: it.sku, nombre: it.nombre, deposito: null, full: null });
    const g = bySku.get(it.sku);
    if (it.destino === "deposito") g.deposito = it; else g.full = it;
  }
  return Array.from(bySku.values()).sort((a, b) =>
    (a.nombre || "").localeCompare(b.nombre || "", "es", { sensitivity: "base" })
  );
}

// Una línea deja de estar pedida sin haber llegado si la reemplazó un pedido más nuevo, se pasó a otro proveedor o
// se cerró con faltante.
const inactiva = (i) => !!(i.reemplazado_por || i.movido_a);
function comoQuedo(i) {
  if (i.movido_a) return i.movido_a === i.pedido_id ? "" : `Pasada a OC ${i.movido_a} (otro proveedor)`;
  if (i.reemplazado_por) return `Reemplazada por OC ${i.reemplazado_por}`;
  if (i.cerrado_con_faltante) return "Cerrada con faltante";
  return "";
}
// Estado que se muestra arriba cuando la OC ya no tiene nada activo.
function estadoVisible(p) {
  const items = p.items || [];
  if (p.estado === "cancelado" || !items.length || items.some((i) => !i.recibido_completo)) return [p.estado, ESTADO_LABEL[p.estado] || p.estado];
  if (items.every((i) => i.reemplazado_por)) return ["reemplazado", "Reemplazado"];
  if (items.every((i) => i.movido_a)) return ["pasado", "Pasado a otro proveedor"];
  if (items.every((i) => (inactiva(i) || i.cerrado_con_faltante) && !i.cantidad_recibida)) return ["cerrado", "Cerrado sin entrega"];
  return [p.estado, ESTADO_LABEL[p.estado] || p.estado];
}
let PROVEEDORES = [];

// El estado de recepción es por ítem (depósito y Full llegan por separado) —
// se resume a nivel de fila igual que el badge de Estado del tablero: peor
// caso entre los ítems que realmente tiene esa fila.
function estadoAgregado(g) {
  const items = [g.deposito, g.full].filter(Boolean);
  if (!items.length) return "—";
  const notas = [...new Set(items.map(comoQuedo).filter(Boolean))];
  if (notas.length && items.every((i) => i.recibido_completo)) return notas.join(" · ");
  if (items.every((i) => i.recibido_completo)) return "✓ Completo";
  if (items.some((i) => i.recibido_completo || i.cantidad_recibida > 0)) return "Parcial";
  return "Pendiente";
}

function renderPedido(p) {
  const el = document.createElement("div");
  el.className = "pedido";
  const activas = (p.items || []).filter((i) => !inactiva(i));
  const recibidas = activas.filter((i) => i.recibido_completo && !i.cerrado_con_faltante).length;
  const pendientes = (p.items || []).filter((i) => !i.recibido_completo);
  const pct = activas.length ? Math.round((recibidas / activas.length) * 100) : 0;
  const editable = p.estado === "enviado";
  const cancelable = p.estado === "enviado" || p.estado === "recibido_parcial";
  const [claseEstado, textoEstado] = estadoVisible(p);
  const movible = p.estado !== "cancelado" && pendientes.length > 0;
  const editableLinea = (i) => editable && i && !i.recibido_completo;
  const grupos = agruparItemsPorSku(p.items || []);
  el.innerHTML = `
    <div class="pedido-header">
      <span class="proveedor">📦 <span class="titulo-oc"></span></span>
      <span class="muted">${new Date(p.creado_at).toLocaleDateString("es-AR")} · ${p.creado_por}${p.unidad_medida === "bultos" ? " · en bultos" : ""}</span>
      <span class="muted">${recibidas}/${activas.length} líneas recibidas (${pct}%)</span>
      <span class="badge ${claseEstado}">${textoEstado}</span>
    </div>
    <div class="detalle">
      <table>
        <thead><tr><th></th><th>SKU</th><th>Producto</th><th>Depósito</th><th>Full</th><th>Total</th><th>Recibido</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          ${grupos.map((g) => {
            const totalPedido = (g.deposito?.cantidad_pedida || 0) + (g.full?.cantidad_pedida || 0);
            const totalRecibido = (g.deposito?.cantidad_recibida || 0) + (g.full?.cantidad_recibida || 0);
            return `
            <tr data-sku="${g.sku}" class="${[g.deposito, g.full].filter(Boolean).every(inactiva) ? "inactiva" : ""}">
              <td>${movible && [g.deposito, g.full].some((i) => i && !i.recibido_completo) ? `<input type="checkbox" class="chk-pase" value="${g.sku.replace(/"/g, "&quot;")}" aria-label="Elegir ${g.sku.replace(/"/g, "&quot;")} para cambiar de proveedor">` : ""}</td>
              <td>${g.sku}</td>
              <td>${g.nombre || "—"}</td>
              <td>${editableLinea(g.deposito)
                ? `<input type="number" min="1" class="qty-edit" data-item-id="${g.deposito.id}" data-destino="deposito" value="${g.deposito.cantidad_pedida}">`
                : (g.deposito ? g.deposito.cantidad_pedida : "—")}</td>
              <td>${editableLinea(g.full)
                ? `<input type="number" min="1" class="qty-edit" data-item-id="${g.full.id}" data-destino="${g.full.destino}" value="${g.full.cantidad_pedida}">`
                : (g.full ? g.full.cantidad_pedida : "—")}</td>
              <td class="total-cell">${totalPedido}</td>
              <td>${totalRecibido}</td>
              <td>${estadoAgregado(g)}</td>
              <td>${p.estado !== "cancelado" && [g.deposito, g.full].some((i) => i && !i.recibido_completo)
                ? `<button class="secondary btn-recibido" data-item-ids="${[g.deposito, g.full].filter((i) => i && !i.recibido_completo).map((i) => i.id).join(",")}" title="Marcar esta línea como recibida completa">✓ Recibido</button>`
                : ""}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      ${p.notas ? `<p class="muted">Notas: ${p.notas}</p>` : ""}
      ${p.proveedor_anterior ? `<p class="muted">Antes era de ${p.proveedor_anterior.replace(/&/g, "&amp;").replace(/</g, "&lt;")}.</p>` : ""}
      ${movible ? `<div class="pase"><span>Cambiar de proveedor (los productos tildados; sin tildar, todo lo pendiente):</span>
        <select class="sel-pase" aria-label="Proveedor nuevo"><option value="">Elegir proveedor…</option>${PROVEEDORES.filter((x) => x !== p.proveedor).map((x) => `<option>${x.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</option>`).join("")}<option value="__otro">Otro (escribir)…</option></select>
        <button class="btn-pase">Pasar</button></div>` : ""}
      <div class="pedido-acciones">
        <label class="unidad-medida">Título a mano:
          <input type="text" class="titulo-extra" maxlength="120" value="${(p.titulo_extra || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}" placeholder="ej. Sábanas 1200 hilos" style="width:230px;background:#0f1115;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px"></label>
        <button class="secondary btn-guardar-titulo">💾 Guardar título</button>
        ${selectorUnidad(p.unidad_medida || "unidades", !editable)}
        <button class="secondary btn-descargar-pdf">⬇️ Descargar PDF</button>
        ${editable ? `<button class="secondary btn-guardar-cantidades">💾 Guardar cambios</button>` : ""}
        ${cancelable ? `<button class="secondary btn-cancelar-pedido">🗑️ Cancelar pedido</button>` : ""}
      </div>
    </div>
  `;
  const pintarTitulo = () => { el.querySelector(".titulo-oc").textContent = tituloOC(p.id, p.proveedor, p.titulo_extra); };
  pintarTitulo();
  // El título a mano se puede cambiar en cualquier estado (no toca las cantidades).
  el.querySelector(".btn-guardar-titulo").addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget, texto = el.querySelector(".titulo-extra").value.trim();
    btn.disabled = true;
    try {
      await apiFetch(`/pedidos/${p.id}/titulo`, { method: "POST", body: JSON.stringify({ titulo_extra: texto }) });
      p.titulo_extra = texto || null;
      pintarTitulo();
      btn.textContent = "✓ Guardado";
      setTimeout(() => { btn.textContent = "💾 Guardar título"; btn.disabled = false; }, 1500);
    } catch (err) {
      alert(`No se pudo guardar el título: ${err.message}`);
      btn.disabled = false;
    }
  });
  el.querySelector(".pedido-header").addEventListener("click", () => {
    const det = el.querySelector(".detalle");
    det.style.display = det.style.display === "block" ? "none" : "block";
  });

  el.querySelector(".btn-descargar-pdf").addEventListener("click", (e) => {
    e.stopPropagation();
    // El PDF no incluye lo reemplazado ni lo pasado a otro proveedor: eso ya no se le pide a este.
    if (!activas.length) return alert("Esta OC ya no tiene productos vigentes (se reemplazaron o pasaron a otro proveedor).");
    generarPDF(p.proveedor, activas, el.querySelector(".sel-unidad").value, p.id, el.querySelector(".titulo-extra").value);
  });
  el.querySelector(".btn-pase")?.addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget, sel = el.querySelector(".sel-pase");
    const destino = (sel.value === "__otro" ? prompt("Nombre del proveedor nuevo:") || "" : sel.value).trim();
    if (!destino) return alert("Elegí el proveedor nuevo.");
    const tildados = Array.from(el.querySelectorAll(".chk-pase:checked")).map((c) => c.value);
    const skus = new Set(tildados.length ? tildados : pendientes.map((i) => i.sku));
    // Lo que el proveedor nuevo ya tenga pendiente de esos productos se reemplaza.
    const pisa = new Set(TODOS_PEDIDOS.filter((o) => o.proveedor === destino && ["enviado", "recibido_parcial"].includes(o.estado))
      .flatMap((o) => (o.items || []).filter((i) => !i.recibido_completo && skus.has(i.sku)).map((i) => i.sku)));
    if (!confirm(`¿Pasar ${skus.size} producto${skus.size === 1 ? "" : "s"} de ${p.proveedor} a ${destino}?\n\nDejan de estar pedidos a ${p.proveedor}.${pisa.size ? `\n\nOjo: ${destino} ya tiene pendiente ${pisa.size} de esos productos y se REEMPLAZA (no se suma).` : ""}`)) return;
    btn.disabled = true;
    try {
      const r = await apiFetch(`/pedidos/${p.id}/proveedor`, { method: "POST", body: JSON.stringify({ proveedor: destino, skus: tildados.length ? tildados : null }) });
      alert(r.pedido_id === p.id ? `La OC ${p.id} ahora es de ${destino}.` : `Se creó la OC ${r.pedido_id} para ${destino} con lo pendiente.`);
      cargar();
    } catch (err) {
      alert(`No se pudo cambiar el proveedor: ${err.message}`);
      btn.disabled = false;
    }
  });

  el.querySelectorAll(".btn-recibido").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const sku = btn.closest("tr").dataset.sku;
      if (!confirm(`¿Marcar ${sku} como recibido completo? Deja de contar como pedido abierto.`)) return;
      btn.disabled = true;
      try {
        const item_ids = btn.dataset.itemIds.split(",").map(Number);
        await apiFetch(`/pedidos/${p.id}/recibir`, { method: "POST", body: JSON.stringify({ item_ids }) });
        cargar();
      } catch (err) {
        alert(`No se pudo marcar como recibido: ${err.message}`);
        btn.disabled = false;
      }
    });
  });

  const btnGuardar = el.querySelector(".btn-guardar-cantidades");
  if (btnGuardar) {
    btnGuardar.addEventListener("click", async (e) => {
      e.stopPropagation();
      const items = Array.from(el.querySelectorAll(".qty-edit")).map((inp) => ({
        id: Number(inp.dataset.itemId),
        cantidad_pedida: Number(inp.value),
        destino: inp.dataset.destino,
      })).filter((it) => it.cantidad_pedida > 0);
      const unidad_medida = el.querySelector(".sel-unidad").value;
      if (!items.length && unidad_medida === (p.unidad_medida || "unidades")) return;
      btnGuardar.disabled = true;
      try {
        await apiFetch(`/pedidos/${p.id}/items`, { method: "PATCH", body: JSON.stringify({ items, unidad_medida }) });
        cargar();
      } catch (err) {
        alert(`No se pudo guardar: ${err.message}`);
        btnGuardar.disabled = false;
      }
    });
  }

  const btnCancelar = el.querySelector(".btn-cancelar-pedido");
  if (btnCancelar) {
    btnCancelar.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm(`¿Cancelar la ${tituloOC(p.id, p.proveedor, p.titulo_extra)} del ${new Date(p.creado_at).toLocaleDateString("es-AR")}?`)) return;
      btnCancelar.disabled = true;
      try {
        await apiFetch(`/pedidos/${p.id}/cancelar`, { method: "POST", body: JSON.stringify({ por: getUser() }) });
        cargar();
      } catch (err) {
        alert(`No se pudo cancelar: ${err.message}`);
        btnCancelar.disabled = false;
      }
    });
  }

  return el;
}

let TODOS_PEDIDOS = [];

function estadosSeleccionados() {
  return new Set(
    Array.from(document.querySelectorAll(".filtro-estado:checked")).map((chk) => chk.value)
  );
}

function renderLista() {
  const seleccionados = estadosSeleccionados();
  const pedidos = TODOS_PEDIDOS.filter((p) => seleccionados.has(p.estado));
  const cont = document.getElementById("lista");
  cont.innerHTML = "";
  if (!pedidos.length) {
    cont.innerHTML = '<p class="muted">No hay pedidos que cumplan el filtro actual.</p>';
    return;
  }
  for (const p of pedidos) cont.appendChild(renderPedido(p));
}

async function cargar() {
  try {
    const [pedidos, provs] = await Promise.all([apiFetch("/pedidos"), apiFetch("/proveedores").catch(() => [])]);
    TODOS_PEDIDOS = pedidos;
    PROVEEDORES = [...new Set([...provs, ...pedidos.map((p) => p.proveedor)])].filter(Boolean).sort((a, b) => a.localeCompare(b, "es"));
    document.getElementById("status").style.display = "none";
    if (!TODOS_PEDIDOS.length) {
      document.getElementById("lista").innerHTML = '<p class="muted">Todavía no hay pedidos registrados.</p>';
      return;
    }
    renderLista();
  } catch (e) {
    document.getElementById("status").textContent = `Error: ${e.message}`;
  }
}

document.querySelectorAll(".filtro-estado").forEach((chk) => {
  chk.addEventListener("change", renderLista);
});

cargar();
</script>
</body>
</html>
