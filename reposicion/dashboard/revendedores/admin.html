<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Revendedores</title>
  <link rel="icon" href="../proveedores/icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="../proveedores/estilo.css?v=12">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, peso0, fecha, hoy, fechaHora, num, guardRev, navRev, parseMonto, apiPublicar } from './app.js';
import { agrupar, etiquetaMes, etiquetaSemana, mesDe, saldo, semanaDe, totales } from './admin-lib.js';

const sesion = await guardRev(['admin']);
navRev(sesion, 'admin');

$('#app').innerHTML = '<p class="muted"><span class="spin"></span> Cargando…</p>';
// ───────── Revendedores: estado (activo / desactivado), descuento de stock (automático / manual) y ficha ─────────
// Pedido del usuario (19/11/2026). Datos de rev-publicar /admin/resumen; los cambios van por /admin/revendedor/*.
document.body.insertAdjacentHTML('beforeend', `<dialog id="dlg" style="width:min(640px,calc(100vw - 24px));border:0;border-radius:16px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)"></dialog>`);
const dlg = $('#dlg');
const ESTADO_REV = { activo: ['Activo', 'ok'], inactivo: ['Desactivado', 'bad'], desconectado: ['Sin conexión con ML', 'warn'], pausado: ['Pausado', ''] };

// ───────── Condiciones por revendedor: colchón de stock y margen mayorista (19/11/2026, pedido del usuario) ─────────
// Cada revendedor puede tener los suyos; vacío = usa el general (la sección "Valores generales").
const generales = () => ({ colchon: resumen?.config?.colchon ?? null, margen: resumen?.config?.margen_mayorista ?? null });
const fmtPct = (v) => String(v).replace('.', ',');
function condicionesHTML(r) {
  const g = generales();
  const col = r.colchon != null ? `<b>${num.format(r.colchon)} u.</b> <span class="muted small">propio</span>` : `${g.colchon != null ? num.format(g.colchon) + ' u.' : '—'} <span class="muted small">general</span>`;
  const mg = r.margen_mayorista != null ? `<b>${fmtPct(r.margen_mayorista)} %</b> <span class="muted small">propio</span>` : `${g.margen != null ? fmtPct(g.margen) + ' %' : 'a definir'} <span class="muted small">general</span>`;
  return `<div class="small">Colchón: ${col}</div><div class="small">Margen: ${mg}</div>`;
}
function abrirCondiciones(r) {
  const g = generales();
  dlg.innerHTML = `<form method="dialog" style="padding:20px 22px" id="fcd"><h2 style="margin-top:0">Condiciones de ${esc(r.nickname || '')}</h2>
    <p class="muted small">Dejá un campo vacío para que use el valor general.</p>
    <label for="cdCol">Colchón de stock (unidades por producto)</label>
    <input id="cdCol" type="number" min="0" max="100" step="1" inputmode="numeric" value="${r.colchon ?? ''}" placeholder="general: ${g.colchon ?? '—'}">
    <p class="muted small" style="margin-top:4px">Se le ofrece el stock del depósito menos estas unidades. Se aplica en el próximo cálculo de stock (cada 5 minutos)${r.sincroniza_stock ? ' y se le actualizan sus publicaciones' : ''}.</p>
    <label for="cdMg">Margen mayorista sobre costo (%)</label>
    <input id="cdMg" inputmode="decimal" value="${r.margen_mayorista != null ? fmtPct(r.margen_mayorista) : ''}" placeholder="general: ${g.margen != null ? fmtPct(g.margen) : 'a definir'}">
    <p class="muted small" style="margin-top:4px">Su precio mayorista = costo + este %. Cuenta para sus ventas nuevas; las ya registradas mantienen el precio de ese momento.</p>
    <p class="small" id="cdMsg"></p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" value="no">Cancelar</button><button class="btn primary" id="cdOk" type="button">Guardar</button></div></form>`;
  dlg.showModal();
  $('#cdOk', dlg).onclick = async () => {
    const c = $('#cdCol', dlg).value.trim(), m = $('#cdMg', dlg).value.trim().replace(',', '.');
    try {
      await apiPublicar('admin/revendedor/condiciones', { id: r.id, colchon: c === '' ? null : Number(c), margen: m === '' ? null : Number(m) });
      dlg.close(); cargar();
    } catch (err) { $('#cdMsg', dlg).className = 'small err'; $('#cdMsg', dlg).textContent = err.message; }
  };
}

function pintarRevendedores(revsRpc, cuenta) {
  const usuarios = new Map((resumen?.revendedores || []).map((r) => [r.id, (r.usuarios || []).join(', ')]));
  const lista = resumen?.revendedores || [];
  $('#revSec').innerHTML = `<div class="cab"><div><h2>Revendedores</h2><span class="muted">Activá o desactivá cada uno, elegí si sus ventas descuentan stock solas, su colchón y su margen, y cargá su ficha</span></div></div>
    <div class="scroll"><table class="apilar" style="min-width:980px"><thead><tr><th scope="col">Revendedor</th><th scope="col">Estado</th><th scope="col">Stock</th><th scope="col">Condiciones</th><th scope="col" class="r">Publicaciones</th><th scope="col">Usuarios del portal</th><th scope="col" class="r" title="Solo ventas reales (ya descontadas del stock). En modo prueba es 0: lo simulado está arriba.">Te debe (ventas reales)</th><th scope="col"></th></tr></thead><tbody>${
    lista.map((r) => {
      const [et, ec] = ESTADO_REV[r.estado] || [r.estado, ''];
      const contacto = [r.contacto_nombre, r.empresa, r.whatsapp || r.telefono, r.email].filter(Boolean).map(esc).join(' · ');
      return `<tr data-id="${r.id}"><th scope="row" class="tit"><div class="row" style="gap:10px;align-items:center">
          ${r.logo_url ? `<img src="${esc(r.logo_url)}" alt="" style="width:40px;height:40px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff">` : '<div style="width:40px;height:40px;border-radius:8px;background:var(--line-soft)"></div>'}
          <div><b>${esc(r.nickname || 'Sin nombre')}</b><div class="muted small">${contacto || 'sin datos de contacto'}</div></div></div></th>
        <td data-label="Estado">${r.solo_publicaciones ? '<span class="chip info">Cuenta propia</span><div class="muted small">solo publicar</div>' : `<span class="chip ${ec}">${et}</span>`}${r.estado === 'inactivo' ? `<div class="muted small">${r.desactivado_modo === 'stock_cero' ? 'stock en 0' : 'sin actualizar'}</div>` : ''}
          <div style="margin-top:6px">${r.solo_publicaciones ? '' : r.estado === 'inactivo' ? '<button class="btn sm primary" data-a="activar">Activar</button>' : r.estado === 'activo' ? '<button class="btn sm danger" data-a="desactivar">Desactivar</button>' : ''}</div></td>
        <td data-label="Stock">${r.solo_publicaciones ? '<span class="muted small">No se toca: lo maneja Ecomm-App</span>' : `
          <label class="small" style="margin:0">Sincroniza stock</label>
          <select data-a="stock" aria-label="Sincroniza stock de ${esc(r.nickname || '')}"><option value="no" ${r.sincroniza_stock ? '' : 'selected'}>No (prueba)</option><option value="si" ${r.sincroniza_stock ? 'selected' : ''}>Sí, en vivo</option></select>
          <label class="small" style="margin:6px 0 0">Descuento de ventas</label>
          <select data-a="descuento" aria-label="Descuento de stock de ${esc(r.nickname || '')}"><option value="auto" ${r.descuento_auto !== false ? 'selected' : ''}>Automático</option><option value="manual" ${r.descuento_auto === false ? 'selected' : ''}>Manual</option></select>
          <div class="muted small">${!r.sincroniza_stock ? 'sin sincronizar: no se le manda stock ni se descuentan sus ventas' : r.descuento_auto === false ? 'stock en vivo · las ventas las descontás vos desde Ventas' : 'stock en vivo · cada venta se descuenta sola'}</div>`}</td>
        <td data-label="Condiciones">${condicionesHTML(r)}<div style="margin-top:6px"><button class="btn sm" data-a="condiciones">Cambiar</button></div></td>
        <td class="r num" data-label="Publicaciones"><a href="vinculadas.html?r=${r.id}">${num.format(r.publicaciones.vinculadas)}</a><div class="muted small">${r.publicaciones.activas} activas</div></td>
        <td data-label="Usuarios">${usuarios.get(r.id) ? esc(usuarios.get(r.id)) : '<span class="muted">ninguno</span>'}</td>
        <td class="r num" data-label="Te debe" style="font-weight:600">${peso0(cuenta.get(r.id)?.saldo || 0)}</td>
        <td class="full"><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm" data-a="ficha">Ficha</button><button class="btn sm" data-a="acceso">Acceso al portal</button><a class="btn sm" href="cuenta.html?r=${r.id}">Ver cuenta</a></div><span class="small err" data-e></span></td></tr>`;
    }).join('') || '<tr><td colspan="8" class="muted">Todavía no hay revendedores conectados. Pasales el link de abajo.</td></tr>'}</tbody></table></div>`;
  const porId = new Map(lista.map((r) => [String(r.id), r]));
  $('#revSec').onclick = async (e) => {
    const b = e.target.closest('[data-a]'); const tr = e.target.closest('tr[data-id]'); if (!b || !tr || b.tagName === 'SELECT') return;
    const r = porId.get(tr.dataset.id), msg = $('[data-e]', tr);
    if (b.dataset.a === 'activar') {
      try { await apiPublicar('admin/revendedor/estado', { id: r.id, activo: true }); cargar(); } catch (err) { msg.textContent = err.message; }
    } else if (b.dataset.a === 'desactivar') abrirDesactivar(r);
    else if (b.dataset.a === 'ficha') abrirFicha(r);
    else if (b.dataset.a === 'acceso') abrirAcceso(r);
    else if (b.dataset.a === 'condiciones') abrirCondiciones(r);
  };
  $('#revSec').onchange = async (e) => {
    const st = e.target.closest('[data-a="stock"]');
    if (st) {
      const tr = st.closest('tr[data-id]'), si = st.value === 'si', r = porId.get(tr.dataset.id);
      if (si && !confirm(`Vas a sincronizar en vivo a ${r.nickname}: el sistema le va a poner el stock a sus ${r.publicaciones.vinculadas} publicaciones vinculadas (cada 5 minutos)${r.descuento_auto !== false ? ' y va a descontar sus ventas en Ecomm-App' : ''}. ¿Seguro?`)) { st.value = 'no'; return; }
      try { await apiPublicar('admin/revendedor/stock', { id: Number(tr.dataset.id), sincroniza: si }); cargar(); } catch (err) { $('[data-e]', tr).textContent = err.message; st.value = si ? 'no' : 'si'; }
      return;
    }
    const sel = e.target.closest('[data-a="descuento"]'); if (!sel) return;
    const tr = sel.closest('tr[data-id]'), auto = sel.value === 'auto';
    if (!auto && !confirm('Con descuento manual, las ventas de este revendedor NO se van a descontar solas en Ecomm-App: las vas a tener que descontar vos desde Ventas. ¿Seguro?')) { sel.value = 'auto'; return; }
    try { await apiPublicar('admin/revendedor/descuento', { id: Number(tr.dataset.id), auto }); cargar(); } catch (err) { $('[data-e]', tr).textContent = err.message; }
  };
}

function abrirDesactivar(r) {
  dlg.innerHTML = `<form method="dialog" style="padding:20px 22px" id="fd"><h2 style="margin-top:0">Desactivar a ${esc(r.nickname || '')}</h2>
    <p class="muted small">Deja de poder publicar tus productos. Sus ventas se siguen registrando. ¿Qué hacemos con sus ${num.format(r.publicaciones.vinculadas)} publicaciones vinculadas en Mercado Libre?</p>
    <label class="op" style="display:flex;gap:10px;margin:8px 0;font-weight:500"><input type="radio" name="m" value="stock_cero" checked><span>Poner su stock en 0<span class="muted small" style="display:block;font-weight:400">No pueden vender más tus productos hasta que lo reactives. Recomendado.</span></span></label>
    <label class="op" style="display:flex;gap:10px;margin:8px 0;font-weight:500"><input type="radio" name="m" value="congelar"><span>Dejar de actualizarlas<span class="muted small" style="display:block;font-weight:400">Quedan con el último stock que tenían. Riesgo: pueden vender algo que ya no tenés.</span></span></label>
    <p class="err small" id="dErr"></p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" value="no">Cancelar</button><button class="btn danger" id="dOk" type="button">Desactivar</button></div></form>`;
  dlg.showModal();
  $('#dOk', dlg).onclick = async () => {
    const modo = $('input[name="m"]:checked', dlg).value;
    try { await apiPublicar('admin/revendedor/estado', { id: r.id, activo: false, modo }); dlg.close(); cargar(); } catch (err) { $('#dErr', dlg).textContent = err.message; }
  };
}

// Acceso al portal: el administrador elige usuario y contraseña (si el usuario ya existe, se le cambia la contraseña).
function generarClave() {
  const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789', x = new Uint32Array(12);
  crypto.getRandomValues(x);
  return [...x].map((n) => a[n % a.length]).join('');
}
function abrirAcceso(r) {
  const usuarioActual = (r.usuarios || [])[0] || String(r.nickname || '').toLowerCase().replace(/[^a-z0-9._-]/g, '');
  dlg.innerHTML = `<form method="dialog" style="padding:20px 22px" id="fa"><h2 style="margin-top:0">Acceso al portal de ${esc(r.nickname || '')}</h2>
    <p class="muted small">Con esto entra a https://clientes-pret.github.io/ecommerce-bi/revendedores/. Si el usuario ya existe, se le cambia la contraseña.</p>
    <label for="aUsr">Usuario</label><input id="aUsr" value="${esc(usuarioActual)}" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label for="aPwd">Contraseña nueva</label>
    <div class="row" style="gap:8px"><input id="aPwd" type="text" minlength="8" autocomplete="new-password" spellcheck="false" style="flex:1"><button class="btn" type="button" id="aGen">Generar</button></div>
    <p class="muted small">Mínimo 8 caracteres. Pasásela por un canal privado.</p>
    <p class="small" id="aMsg"></p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" value="no">Cerrar</button><button class="btn primary" id="aOk" type="button">Guardar acceso</button></div></form>`;
  dlg.showModal();
  $('#aGen', dlg).onclick = () => { $('#aPwd', dlg).value = generarClave(); };
  $('#aOk', dlg).onclick = async () => {
    const usuario = $('#aUsr', dlg).value.trim(), password = $('#aPwd', dlg).value;
    try {
      const x = await apiPublicar('admin/revendedor/acceso', { id: r.id, usuario, password });
      $('#aMsg', dlg).className = 'small ok-t';
      $('#aMsg', dlg).innerHTML = `${x.creado ? 'Usuario creado' : 'Contraseña cambiada'}. Usuario: <b>${esc(usuario)}</b> · <a href="#" id="aCopiar">Copiar usuario y contraseña</a>`;
      $('#aCopiar', dlg).onclick = async (e) => { e.preventDefault(); try { await navigator.clipboard.writeText(`Portal: https://clientes-pret.github.io/ecommerce-bi/revendedores/\nUsuario: ${usuario}\nContraseña: ${password}`); $('#aCopiar', dlg).textContent = 'Copiado'; } catch { /* sin portapapeles */ } };
    } catch (err) { $('#aMsg', dlg).className = 'small err'; $('#aMsg', dlg).textContent = err.message; }
  };
}

const CAMPOS_FICHA = [['contacto_nombre', 'Nombre de contacto'], ['empresa', 'Empresa / razón social'], ['cuit', 'CUIT'], ['email', 'Email'], ['telefono', 'Teléfono'], ['whatsapp', 'WhatsApp'], ['direccion', 'Dirección']];
function abrirFicha(r) {
  dlg.innerHTML = `<form method="dialog" style="padding:20px 22px" id="ff"><h2 style="margin-top:0">Ficha de ${esc(r.nickname || '')}</h2>
    <div class="row" style="gap:14px;align-items:center;margin-bottom:8px">
      <div id="fLogo">${r.logo_url ? `<img src="${esc(r.logo_url)}" alt="Logo" style="width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff">` : '<div style="width:72px;height:72px;border-radius:10px;background:var(--line-soft)"></div>'}</div>
      <div><label for="fArch" style="margin:0">Logo</label><input type="file" id="fArch" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="muted small">PNG, JPG, WEBP o SVG, hasta 2 MB.${r.logo_url ? ' <a href="#" id="fQuitar">Quitar logo</a>' : ''}</div></div></div>
    <div class="campos">${CAMPOS_FICHA.map(([k, t]) => `<div><label for="f_${k}">${t}</label><input id="f_${k}" value="${esc(r[k] || '')}" ${k === 'email' ? 'type="email"' : ''}></div>`).join('')}</div>
    <label for="f_notas">Notas</label><textarea id="f_notas" rows="3" style="width:100%">${esc(r.notas || '')}</textarea>
    <p class="muted small">Cuenta de Mercado Libre: ${esc(r.nickname || '')} (${r.ml_user_id}) · conectada el ${r.conectado_at ? new Date(r.conectado_at).toLocaleDateString('es-AR') : '—'}</p>
    <p class="err small" id="fErr"></p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" value="no">Cerrar</button><button class="btn primary" id="fOk" type="button">Guardar</button></div></form>`;
  dlg.showModal();
  $('#fArch', dlg).onchange = async (e) => {
    const a = e.target.files[0]; if (!a) return;
    if (a.size > 2 * 1024 * 1024) { $('#fErr', dlg).textContent = 'El logo tiene que pesar menos de 2 MB.'; return; }
    const base64 = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.readAsDataURL(a); });
    try {
      const x = await apiPublicar('admin/revendedor/logo', { id: r.id, tipo: a.type, base64 });
      r.logo_url = x.logo_url; $('#fLogo', dlg).innerHTML = `<img src="${esc(x.logo_url)}" alt="Logo" style="width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff">`;
      $('#fErr', dlg).className = 'small ok-t'; $('#fErr', dlg).textContent = 'Logo guardado.';
    } catch (err) { $('#fErr', dlg).className = 'small err'; $('#fErr', dlg).textContent = err.message; }
  };
  const q = $('#fQuitar', dlg);
  if (q) q.onclick = async (e) => { e.preventDefault(); try { await apiPublicar('admin/revendedor/logo', { id: r.id, quitar: true }); dlg.close(); cargar(); } catch (err) { $('#fErr', dlg).textContent = err.message; } };
  $('#fOk', dlg).onclick = async () => {
    const ficha = Object.fromEntries([...CAMPOS_FICHA.map(([k]) => [k, $('#f_' + k, dlg).value]), ['notas', $('#f_notas', dlg).value]]);
    try { await apiPublicar('admin/revendedor/ficha', { id: r.id, ficha }); dlg.close(); cargar(); } catch (err) { $('#fErr', dlg).className = 'small err'; $('#fErr', dlg).textContent = err.message; }
  };
}

async function pintarLink() {
  try {
    const { link } = await apiPublicar('admin/conectar', {});
    $('#lnk').value = link;
    $('#lnkWa').href = 'https://wa.me/?text=' + encodeURIComponent('Hola! Para empezar a vender productos de Pret a Home, conectá tu cuenta de Mercado Libre acá: ' + link);
    $('#lnkCopiar').onclick = async () => { try { await navigator.clipboard.writeText(link); } catch { $('#lnk').select(); document.execCommand('copy'); } $('#lnkMsg').textContent = 'Copiado.'; setTimeout(() => ($('#lnkMsg').textContent = ''), 2500); };
  } catch (e) { $('#lnk').value = 'No pude traer el link: ' + e.message; }
}

let resumen = null, revSel = new URLSearchParams(location.search).get('r') || '', gran = 'semana';

// Ventas por revendedor (19/11/2026, pedido del usuario): filtrar revendedor por revendedor y ver, por semana o por
// mes, cuántas ventas lleva, a qué precio vendió y qué costo mayorista le tiene que pagar a Pret a Home. Cuentas en
// admin-lib.js; datos de rev-publicar /admin/resumen (12 meses). En modo prueba las ventas son simuladas.
function pintarVentas() {
  const box = $('#ventasRev'); if (!box) return;
  if (!resumen || resumen.error) { box.innerHTML = `<section class="card"><p class="err" style="margin:0">No pude cargar las ventas: ${esc(resumen?.error?.message || 'sin datos')}</p></section>`; return; }
  const revs = resumen.revendedores;
  const lineas = resumen.ventas.filter((l) => !revSel || String(l.revendedor_id) === revSel);
  const pagos = resumen.pagos.filter((p) => !revSel || String(p.revendedor_id) === revSel);
  const t = totales(lineas), s = saldo(lineas, pagos), prueba = resumen.config?.modo !== 'real';
  const enVivo = (resumen.revendedores || []).filter((r) => r.estado === 'activo' && r.sincroniza_stock && !r.solo_publicaciones).map((r) => r.nickname);
  const clave = gran === 'mes' ? (l) => mesDe(l.creado_at) : (l) => semanaDe(l.creado_at);
  const filas = agrupar(lineas, clave).slice(0, gran === 'mes' ? 12 : 16);
  const etq = gran === 'mes' ? etiquetaMes : (k) => 'Semana del ' + etiquetaSemana(k);
  const prom = (v, u) => (u ? peso0(v / u) : '—');
  const productos = agrupar(lineas, (l) => l.sku).filter((p) => p.unidades).sort((a, b) => b.unidades - a.unidades);
  box.innerHTML = `<section class="card tabla"><div class="cab"><div><h2>Ventas por revendedor</h2><span class="muted">últimos 12 meses${prueba ? (enVivo.length ? ` · en vivo: ${esc(enVivo.join(', '))}; el resto, ventas simuladas` : ' · modo prueba: ventas simuladas') : ''}</span></div>
    <div class="row wrapRow filtros">
      <select id="vRev" aria-label="Revendedor"><option value="">Todos los revendedores</option>${revs.map((r) => `<option value="${r.id}" ${String(r.id) === revSel ? 'selected' : ''}>${esc(r.nickname || 'ID ' + r.id)}</option>`).join('')}</select>
      <div class="seg gris" role="group" aria-label="Agrupar por">${[['semana', 'Por semana'], ['mes', 'Por mes']].map(([k, x]) => `<button type="button" data-g="${k}" aria-pressed="${k === gran}">${x}</button>`).join('')}</div>
    </div></div>
    <div class="centro-comando compacto" style="padding:0 24px">
      <div class="cc-card"><div class="cc-label">Ventas</div><div class="cc-valor num">${num.format(t.ventas)}</div><div class="cc-sub">${num.format(t.unidades)} unidades${t.canceladas ? ` · ${t.canceladas} canceladas` : ''}</div></div>
      <div class="cc-card"><div class="cc-label">Vendió por</div><div class="cc-valor num">${peso0(t.vendido)}</div><div class="cc-sub">a su precio de venta · ${prom(t.vendido, t.unidades)} por unidad</div></div>
      <div class="cc-card"><div class="cc-label">Costo mayorista</div><div class="cc-valor num">${peso0(t.costo)}</div><div class="cc-sub">lo que te tiene que pagar${t.sinCosto ? ` · ${t.sinCosto} sin costo cargado` : ''}</div></div>
      <div class="cc-card ${s.saldo > 0 ? 'destacada' : ''}"><div class="cc-label">Te debe</div><div class="cc-valor num">${peso0(s.saldo)}</div><div class="cc-sub">pagó ${peso0(s.pagado)}</div></div>
    </div>
    <div class="scroll"><table class="apilar" style="min-width:820px"><thead><tr><th scope="col">${gran === 'mes' ? 'Mes' : 'Semana'}</th><th scope="col" class="r">Ventas</th><th scope="col" class="r">Unidades</th><th scope="col" class="r">Vendió por</th><th scope="col" class="r">Precio prom. por unidad</th><th scope="col" class="r">Costo mayorista (te paga)</th><th scope="col" class="r">Canceladas</th></tr></thead>
    <tbody>${filas.map((x) => `<tr><th scope="row" style="font-weight:500">${etq(x.clave)}</th><td class="r num" data-label="Ventas">${x.ventas}</td><td class="r num" data-label="Unidades">${x.unidades}</td>
      <td class="r num" data-label="Vendió por">${peso0(x.vendido)}</td><td class="r num" data-label="Precio prom.">${prom(x.vendido, x.unidades)}</td>
      <td class="r num" data-label="Costo mayorista" style="font-weight:600">${peso0(x.costo)}${x.sinCosto ? `<div class="small warn-t">${x.sinCosto} sin costo</div>` : ''}</td><td class="r num" data-label="Canceladas">${x.canceladas || ''}</td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">Todavía no hay ventas registradas.</td></tr>'}</tbody></table></div>
    ${productos.length ? `<details style="padding:0 24px 16px"><summary class="small" style="margin:8px 0">Qué vendió y a qué precio (${productos.length} ${productos.length === 1 ? 'producto' : 'productos'})</summary>
      <div class="scroll"><table style="min-width:720px"><thead><tr><th scope="col">Producto</th><th scope="col" class="r">Unidades</th><th scope="col" class="r">Precio prom. de venta</th><th scope="col" class="r">Costo mayorista por unidad</th><th scope="col" class="r">Te paga</th></tr></thead>
      <tbody>${productos.map((p) => `<tr><th scope="row" style="font-weight:500">${esc(resumen.titulos[p.clave] || p.clave)}<div class="muted small">${esc(p.clave)}</div></th><td class="r num">${p.unidades}</td><td class="r num">${prom(p.vendido, p.unidades)}</td><td class="r num">${prom(p.costo, p.unidades)}</td><td class="r num" style="font-weight:600">${peso0(p.costo)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
  </section>`;
  $('#vRev').onchange = () => { revSel = $('#vRev').value; pintarVentas(); };
  $$('[data-g]', box).forEach((b) => (b.onclick = () => { gran = b.dataset.g; pintarVentas(); }));
}
async function cargar() {
  const [rv, cu, mg, rs] = await Promise.all([sb.rpc('rev_admin_revendedores'), sb.rpc('rev_cuenta_resumen'), sb.rpc('rev_admin_margen'),
    apiPublicar('admin/resumen', {}).catch((e) => ({ error: e }))]);
  resumen = rs;
  const error = rv.error || cu.error || mg.error;
  if (error) { $('#app').innerHTML = `<p class="err">No pude cargar: ${esc(error.message)}</p>`; return; }
  const cuenta = new Map(cu.data.map((c) => [c.revendedor_id, c]));
  const revs = rv.data, margen = mg.data;
  const deuda = cu.data.reduce((s, c) => s + Number(c.saldo), 0);
  $('#app').innerHTML = `<div class="cabecera"><div><h1>Administración</h1><p>Ventas de cada revendedor por semana y por mes, a qué precio vendió y cuánto te tiene que pagar; pagos, accesos y margen mayorista</p></div></div>
  <div id="ventasRev"></div>
  <section class="card"><h2 style="margin-top:0">Valores generales</h2>
    <p class="muted small" style="margin-top:0">Se usan para los revendedores que no tienen condiciones propias (se cambian con "Cambiar" en la columna Condiciones de cada uno).</p>
    <h2 style="margin:16px 0 0;font-size:1.05rem">Margen mayorista</h2>
    <p class="muted small" style="margin-top:4px">Precio mayorista = costo del producto + este %. Lo que ve el revendedor ya viene calculado: nunca ve el costo.</p>
    <form id="fm" class="row wrapRow"><div style="width:140px"><label for="mg" style="margin-top:0">Margen sobre costo (%)</label><input id="mg" inputmode="decimal" value="${margen != null ? String(margen).replace('.', ',') : ''}" placeholder="ej. 30" required></div>
    <button class="btn primary" style="align-self:flex-end">Guardar margen</button><span id="mgMsg" class="small" style="align-self:flex-end;padding-bottom:12px"></span></form>
    ${margen == null ? '<p class="warn-t small" style="margin-bottom:0"><b>Todavía no está definido:</b> los revendedores ven "a definir" en el precio mayorista y las ventas no suman al saldo.</p>' : ''}
    <h2 style="margin:20px 0 0;font-size:1.05rem">Colchón de stock</h2>
    <p class="muted small" style="margin-top:4px">Unidades que te guardás de cada producto: a los revendedores se les ofrece el stock del depósito menos este número. Se aplica en el próximo cálculo (cada 5 minutos).</p>
    <form id="fc" class="row wrapRow"><div style="width:140px"><label for="cl" style="margin-top:0">Unidades por producto</label><input id="cl" type="number" min="0" max="100" step="1" value="${esc(String(resumen?.config?.colchon ?? ''))}" required></div>
    <button class="btn primary" style="align-self:flex-end">Guardar colchón</button><span id="clMsg" class="small" style="align-self:flex-end;padding-bottom:12px"></span></form>
  </section>
  <section class="card tabla" id="revSec"></section>
  <section class="card"><h2 style="margin-top:0">Conectar un revendedor nuevo</h2>
    <p class="muted small" style="margin-top:0">Pasale este link. Lo abre con su cuenta de Mercado Libre, autoriza la conexión y aparece solo en la lista de arriba, activo y con descuento automático.</p>
    <div class="row wrapRow" style="gap:8px"><input id="lnk" readonly style="flex:1;min-width:260px" aria-label="Link para conectar">
      <button class="btn primary" id="lnkCopiar" type="button">Copiar link</button><a class="btn" id="lnkWa" target="_blank" rel="noopener">Mandar por WhatsApp</a></div>
    <span id="lnkMsg" class="small ok-t"></span></section>
  <div>
    <section class="card"><h2 style="margin-top:0">Registrar un pago recibido</h2>
      <form id="fp"><label for="pRev">Revendedor</label><select id="pRev" required>${revs.map((r) => `<option value="${r.id}">${esc(r.nickname || 'ID ' + r.id)}</option>`).join('')}</select>
      <div class="campos"><div><label for="pFecha">Fecha</label><input id="pFecha" type="date" value="${hoy()}" required></div><div><label for="pMonto">Monto ($)</label><input id="pMonto" inputmode="decimal" placeholder="0" required></div></div>
      <label for="pNota">Nota (opcional)</label><input id="pNota" placeholder="Transferencia, semana del…">
      <div class="pie"><span id="pMsg" class="small"></span><button class="btn primary">Registrar pago</button></div></form></section>
  </div>`;

  $('#fm').onsubmit = async (e) => {
    e.preventDefault();
    const v = parseMonto($('#mg').value);
    const { error } = await sb.rpc('rev_set_margen', { p: v });
    $('#mgMsg').className = 'small ' + (error ? 'err' : 'ok-t');
    $('#mgMsg').textContent = error ? error.message : 'Guardado.';
    if (!error) setTimeout(cargar, 600);
  };
  pintarVentas();
  pintarRevendedores(revs, cuenta);
  pintarLink();
  $('#fc').onsubmit = async (e) => {
    e.preventDefault();
    try { await apiPublicar('admin/config/colchon', { colchon: Number($('#cl').value) }); $('#clMsg').className = 'small ok-t'; $('#clMsg').textContent = 'Guardado: se aplica en el próximo cálculo de stock.'; }
    catch (err) { $('#clMsg').className = 'small err'; $('#clMsg').textContent = err.message; }
  };
  $('#fp').onsubmit = async (e) => {
    e.preventDefault();
    const monto = parseMonto($('#pMonto').value);
    if (!(monto > 0)) { $('#pMsg').className = 'small err'; $('#pMsg').textContent = 'Poné un monto mayor a cero.'; return; }
    const { error } = await sb.rpc('rev_registrar_pago', { p_revendedor: Number($('#pRev').value), p_fecha: $('#pFecha').value, p_monto: monto, p_nota: $('#pNota').value });
    $('#pMsg').className = 'small ' + (error ? 'err' : 'ok-t');
    $('#pMsg').textContent = error ? error.message : 'Pago registrado.';
    if (!error) setTimeout(cargar, 600);
  };
}
await cargar();
</script>
</body>
</html>
