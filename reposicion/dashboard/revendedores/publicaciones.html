<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis publicaciones · Revendedores</title>
  <link rel="icon" href="../proveedores/icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="../proveedores/estilo.css?v=12">
  <style>
    .sku-in { max-width: 230px; }
    tr.bajomin td { background: var(--warn-bg); }
    .acc { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; flex: none; }
    .pto.si { background: #2e9e5b; box-shadow: 0 0 0 3px rgba(46,158,91,.18); }
    .pto.no { background: #d14343; box-shadow: 0 0 0 3px rgba(209,67,67,.18); }
    .vin { display: flex; align-items: center; font-weight: 600; white-space: nowrap; }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, peso0, fechaHora, num, guardRev, navRev, leerRpc } from './app.js';

// Vinculada = tiene SKU y ese SKU está en el catálogo (así el sistema le mantiene el stock). `en_catalogo` lo trae la base
// nueva; con la anterior se deduce de que haya stock calculado para ese SKU.
const vinculada = (p) => !!p.sku && (p.en_catalogo ?? p.ofrecido != null);
const hace = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : fechaHora(t); };
const linkML = (id) => `https://articulo.mercadolibre.com.ar/${String(id).replace(/^([A-Z]{3})(\d+)$/, '$1-$2')}`;

const sesion = await guardRev();
navRev(sesion, 'publicaciones');

$('#app').innerHTML = `<div class="cabecera"><div><h1>Mis publicaciones</h1><p>Tus publicaciones de Mercado Libre vinculadas a un producto (SKU) del catálogo. Así se mantiene el stock al día.</p></div></div>
<div class="centro-comando compacto" id="kpis"></div>
<section class="card" id="agregar"><h2 style="margin-top:0">Agregar una publicación a mano</h2>
  <p class="muted small" style="margin-top:0">Si el sistema no reconoció una publicación tuya, indicá el número (o el link) y el SKU del producto del catálogo.</p>
  <form id="fa" class="campos">
    <div><label for="item">Número o link de la publicación</label><input id="item" placeholder="MLA1234567890" required></div>
    <div><label for="skuNuevo">SKU del catálogo</label><input id="skuNuevo" list="skus" placeholder="Empezá a escribir…" required autocomplete="off"></div>
    <div class="pie ancho"><span class="err" id="errA"></span><button class="btn primary">Agregar</button></div>
  </form>
</section>
<section class="card tabla"><div class="cab"><div><h2>Publicaciones</h2><span class="muted" id="cuenta"></span></div>
  <div class="row wrapRow filtros"><div class="seg gris full" role="group" aria-label="Qué ver">${[['todas', 'Todas'], ['sin', 'Sin vincular'], ['min', 'Bajo el mínimo']].map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${k === 'todas'}">${t}</button>`).join('')}</div></div></div>
  <div class="scroll"><table class="apilar" style="min-width:980px"><thead><tr><th scope="col">Vínculo</th><th scope="col">Publicación</th><th scope="col">Producto (SKU)</th><th scope="col">Estado</th><th scope="col" class="r">Tu precio</th><th scope="col" class="r">Stock</th><th scope="col"></th></tr></thead><tbody id="tb"></tbody></table></div>
</section><datalist id="skus"></datalist>`;

let pubs = [], filtro = 'todas';
const ESTADO_ML = { active: ['Activa', 'ok'], paused: ['Pausada', 'warn'], closed: ['Cerrada', ''], under_review: ['En revisión', 'warn'] };

async function cargar() {
  const { data, error } = await sb.rpc('rev_mis_publicaciones');
  if (error) { $('#tb').innerHTML = `<tr><td colspan="7" class="err">No pude cargar tus publicaciones: ${esc(error.message)}</td></tr>`; return; }
  pubs = data;
  const sin = pubs.filter((p) => !vinculada(p)).length, bajo = pubs.filter((p) => p.bajo_minimo).length;
  $('#kpis').innerHTML = [
    ['Publicaciones', num.format(pubs.length), `${num.format(pubs.filter((p) => p.estado_ml === 'active').length)} activas`],
    ['Sin vincular', num.format(sin), sin ? 'corregilas abajo' : 'todas reconocidas'],
    ['Bajo el mínimo', num.format(bajo), bajo ? 'revisá el precio' : 'ninguna'],
  ].map(([l, v, s], i) => `<div class="cc-card ${(i === 1 && sin) || (i === 2 && bajo) ? 'alerta' : ''}"><div class="cc-label">${l}</div><div class="cc-valor num">${v}</div><div class="cc-sub">${s}</div></div>`).join('');
  pintar();
}

function pintar() {
  const v = pubs.filter((p) => filtro === 'todas' || (filtro === 'sin' && !vinculada(p)) || (filtro === 'min' && p.bajo_minimo));
  $('#cuenta').textContent = `${num.format(v.length)} ${v.length === 1 ? 'publicación' : 'publicaciones'}`;
  $('#tb').innerHTML = v.map((p) => {
    const [et, ec] = ESTADO_ML[p.estado_ml] || [p.estado_ml || '—', ''];
    const ok = vinculada(p);
    const vin = ok
      ? `<span class="vin"><span class="pto si"></span>Vinculada</span><div class="muted small">${p.vinculo === 'manual' ? 'a mano' : 'automático'}</div>`
      : `<span class="vin"><span class="pto no"></span>Sin vincular</span><div class="muted small">${p.sku ? 'el SKU no está en el catálogo' : 'no tiene SKU del catálogo'}</div>`;
    const stock = !ok ? '<span class="muted">—</span>'
      : `<b>${p.ofrecido != null ? num.format(p.ofrecido) : '—'}</b>`
        + `<div class="muted small" title="El stock sale del depósito (Ecomm-App) y se vuelve a leer cada 5 minutos">${p.stock_consultado_at ? 'Ecomm-App ' + hace(p.stock_consultado_at) : 'Ecomm-App, cada 5 min'}</div>`
        + `<div class="muted small">${p.ultimo_envio_at ? 'En ML: ' + num.format(p.ultima_cantidad_enviada ?? 0) + ' · ' + hace(p.ultimo_envio_at) : 'En ML: todavía no se envía (modo prueba)'}</div>`;
    return `<tr class="${p.bajo_minimo ? 'bajomin' : ''}" data-id="${p.id}">
    <td data-label="Vínculo">${vin}</td>
    <th scope="row" class="tit" style="font-weight:500"><a href="${linkML(p.ml_item_id)}" target="_blank" rel="noopener"><b>${esc(p.ml_item_id)}</b> ↗</a>${p.ml_variation_id ? ` <span class="muted small">var. ${p.ml_variation_id}</span>` : ''}<div class="muted small">${esc(p.titulo || (p.sku ? '' : 'Sin producto vinculado'))}</div></th>
    <td data-label="SKU">${p.sku ? `<b>${esc(p.sku)}</b>` : '<span class="muted">—</span>'}</td>
    <td data-label="Estado"><span class="chip ${ec}">${esc(et)}</span></td>
    <td class="r num" data-label="Tu precio">${p.precio != null ? peso0(p.precio) : '—'}${p.bajo_minimo ? `<div class="small bad-t" style="font-weight:600">mínimo ${peso0(p.precio_minimo)}</div>` : ''}</td>
    <td class="r num" data-label="Stock">${stock}</td>
    <td class="full"><div class="acc"><input class="sku-in" list="skus" placeholder="SKU correcto" value="${esc(p.sku || '')}" aria-label="SKU de ${esc(p.ml_item_id)}" autocomplete="off">
      <button class="btn sm primary" data-g>Guardar</button>${p.vinculo === 'manual' ? '<button class="btn sm danger" data-q>Quitar</button>' : ''}<span class="small err" data-e></span></div></td></tr>`;
  }).join('') || `<tr><td colspan="7" class="muted">${pubs.length ? 'No hay publicaciones con ese filtro.' : 'Todavía no hay publicaciones vinculadas. Cuando publiques con el SKU en el campo "SKU / código de vendedor", aparecen acá solas; si no, agregalas a mano arriba.'}</td></tr>`;
}

$('#tb').onclick = async (e) => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const id = Number(tr.dataset.id), msg = $('[data-e]', tr);
  if (e.target.closest('[data-g]')) {
    const sku = $('.sku-in', tr).value.trim();
    msg.textContent = '';
    const { error } = await sb.rpc('rev_vincular_publicacion', { p_id: id, p_sku: sku });
    if (error) { msg.textContent = error.message; return; }
    await cargar();
  } else if (e.target.closest('[data-q]')) {
    if (!confirm('¿Quitar esta publicación de la lista? Solo se pueden quitar las agregadas a mano.')) return;
    const { error } = await sb.rpc('rev_quitar_publicacion', { p_id: id });
    if (error) { msg.textContent = error.message; return; }
    await cargar();
  }
};
$$('[data-f]').forEach((b) => (b.onclick = () => { filtro = b.dataset.f; $$('[data-f]').forEach((x) => x.setAttribute('aria-pressed', x === b)); pintar(); }));

$('#fa').onsubmit = async (e) => {
  e.preventDefault(); $('#errA').textContent = '';
  const { error } = await sb.rpc('rev_agregar_publicacion', { p_item: $('#item').value, p_variation: null, p_sku: $('#skuNuevo').value });
  if (error) { $('#errA').textContent = error.message; return; }
  $('#fa').reset(); await cargar();
};

// Lista de SKU del catálogo para autocompletar (en el celular, el teclado sugiere mientras se escribe).
leerRpc('rev_catalogo_listar').then((c) => {
  $('#skus').innerHTML = c.map((p) => `<option value="${esc(p.sku)}">${esc(p.titulo || '')}</option>`).join('');
}).catch(() => {});

if (sesion.tipo === 'admin') $('#app').insertAdjacentHTML('afterbegin', '<div class="card" style="background:var(--brand-bg)">Estás viendo el portal como administrador: las publicaciones son de cada revendedor, por eso esta lista está vacía.</div>');
await cargar();
</script>
</body>
</html>
