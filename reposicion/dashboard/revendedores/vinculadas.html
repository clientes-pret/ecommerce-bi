<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicaciones vinculadas · Administración de revendedores</title>
  <link rel="icon" href="../proveedores/icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="../proveedores/estilo.css?v=12">
  <style>
    .foto { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--line-soft); display: block; }
    tr.bajomin td, tr.bajomin th { background: var(--warn-bg); }
  </style>
</head>
<body>
<div class="wrap" id="app"><p class="muted"><span class="spin"></span> Cargando…</p></div>
<script type="module">
// Publicaciones vinculadas (portal de ADMINISTRADOR, 19/11/2026): todas las publicaciones de los revendedores que
// están vinculadas a un SKU del catálogo (así se les mantiene el stock), con filtros y el link a cada una en
// Mercado Libre. Datos de rev-publicar /admin/publicaciones.
import { $, $$, esc, peso0, num, guardRev, navRev, apiPublicar, quitarAcentos } from './app.js';

const sesion = await guardRev(['admin']);
navRev(sesion, 'vinculadas');
const POR_PAG = 50;

let pubs = [];
try { pubs = (await apiPublicar('admin/publicaciones', {})).publicaciones || []; }
catch (e) { $('#app').innerHTML = `<p class="err">No pude cargar las publicaciones: ${esc(e.message)}</p>`; throw e; }

const revs = [...new Map(pubs.map((p) => [p.revendedor_id, p.revendedor || 'ID ' + p.revendedor_id])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
const ESTADO = { active: ['Activa', 'ok'], paused: ['Pausada', 'warn'], closed: ['Finalizada', ''], under_review: ['En revisión', 'warn'], inactive: ['Inactiva', ''] };
const linkML = (id) => `https://articulo.mercadolibre.com.ar/${String(id).replace(/^([A-Z]{3})(\d+)$/, '$1-$2')}`;
for (const p of pubs) p.hay = quitarAcentos([p.ml_item_id, p.sku, p.titulo, p.revendedor].join(' '));
const qsR = new URLSearchParams(location.search).get('r');

$('#app').innerHTML = `<div class="cabecera"><div><h1>Publicaciones vinculadas</h1><p>Las publicaciones de tus revendedores en Mercado Libre que están vinculadas a un producto (SKU) del catálogo: a esas se les mantiene el stock</p></div></div>
<div class="centro-comando compacto" id="kpis"></div>
<section class="card tabla"><div class="cab"><div><h2>Publicaciones</h2><span class="muted" id="cuenta"></span></div>
  <div class="row wrapRow filtros">
    <input id="q" class="busca" placeholder="Buscar por MLA, SKU, producto…" aria-label="Buscar">
    <select id="rev" aria-label="Revendedor"><option value="">Todos los revendedores</option>${revs.map(([id, n]) => `<option value="${id}" ${String(id) === qsR ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <select id="est" aria-label="Estado"><option value="">Activas y pausadas</option><option value="active">Activas</option><option value="paused">Pausadas</option><option value="otro">Otras (finalizadas, en revisión)</option></select>
    <select id="ord" aria-label="Ordenar"><option value="nuevas">Más nuevas primero</option><option value="revendedor">Revendedor</option><option value="producto">Producto A→Z</option><option value="precio">Precio de mayor a menor</option></select>
    <label style="margin:0;font-weight:500"><input type="checkbox" id="min"> Solo bajo el precio mínimo</label>
  </div></div>
  <div class="scroll"><table class="apilar" style="min-width:980px"><thead><tr><th scope="col" style="width:56px"></th><th scope="col">Publicación</th><th scope="col">Revendedor</th><th scope="col">SKU</th><th scope="col">Estado</th><th scope="col" class="r">Precio</th><th scope="col" class="r">Stock ofrecido</th><th scope="col">Vínculo</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="row between pager" style="padding:12px 24px;flex-wrap:wrap"><span class="muted small" id="pagInfo"></span><div class="row"><button class="btn sm" id="ant">← Anterior</button><button class="btn sm" id="sig">Siguiente →</button></div></div>
</section>`;

const act = pubs.filter((p) => p.estado_ml === 'active'), bajo = pubs.filter((p) => p.bajo_minimo);
$('#kpis').innerHTML = [
  ['Vinculadas', num.format(pubs.length), `${revs.length} ${revs.length === 1 ? 'revendedor' : 'revendedores'}`],
  ['Activas', num.format(act.length), `${num.format(pubs.length - act.length)} pausadas u otras`],
  ['Productos distintos', num.format(new Set(pubs.map((p) => p.sku)).size), 'SKU publicados'],
  ['Bajo el mínimo', num.format(bajo.length), bajo.length ? 'revisá con el revendedor' : 'ninguna'],
].map(([l, v, s], i) => `<div class="cc-card ${i === 3 && bajo.length ? 'alerta' : ''}"><div class="cc-label">${l}</div><div class="cc-valor num">${v}</div><div class="cc-sub">${s}</div></div>`).join('');

let vista = [], pag = 0;
function filtrar() {
  const tk = quitarAcentos($('#q').value).split(/\s+/).filter(Boolean), r = $('#rev').value, e = $('#est').value, m = $('#min').checked, o = $('#ord').value;
  vista = pubs.filter((p) => (!r || String(p.revendedor_id) === r)
    && (!e || (e === 'otro' ? !['active', 'paused'].includes(p.estado_ml) : p.estado_ml === e))
    && (!m || p.bajo_minimo) && tk.every((t) => p.hay.includes(t)));
  const k = { nuevas: (a, b) => String(b.creado_at).localeCompare(String(a.creado_at)), revendedor: (a, b) => String(a.revendedor).localeCompare(String(b.revendedor)),
    producto: (a, b) => String(a.titulo || a.sku).localeCompare(String(b.titulo || b.sku), 'es'), precio: (a, b) => (Number(b.precio) || 0) - (Number(a.precio) || 0) }[o];
  vista.sort((a, b) => k(a, b) || String(a.ml_item_id).localeCompare(String(b.ml_item_id)));
  pag = 0; pintar();
}

function pintar() {
  const ini = pag * POR_PAG, fil = vista.slice(ini, ini + POR_PAG);
  $('#cuenta').textContent = `${num.format(vista.length)} ${vista.length === 1 ? 'publicación' : 'publicaciones'}`;
  $('#pagInfo').textContent = vista.length ? `${ini + 1}–${ini + fil.length} de ${num.format(vista.length)}` : '';
  $('#ant').disabled = pag === 0; $('#sig').disabled = ini + POR_PAG >= vista.length;
  $('#tb').innerHTML = fil.map((p) => {
    const [et, ec] = ESTADO[p.estado_ml] || [p.estado_ml || '—', ''];
    return `<tr class="${p.bajo_minimo ? 'bajomin' : ''}">
      <td class="ft">${p.foto ? `<img class="foto" loading="lazy" src="${esc(p.foto)}" alt="">` : '<div class="foto"></div>'}</td>
      <th scope="row" class="tit" style="font-weight:500"><a href="${linkML(p.ml_item_id)}" target="_blank" rel="noopener"><b>${esc(p.ml_item_id)}</b> ↗</a>${p.ml_variation_id ? ` <span class="muted small">var. ${p.ml_variation_id}</span>` : ''}<div class="muted small">${esc(p.titulo || '')}</div></th>
      <td data-label="Revendedor"><b>${esc(p.revendedor || '—')}</b></td>
      <td data-label="SKU">${esc(p.sku)}${p.en_catalogo ? '' : '<div class="small bad-t">ya no está en el catálogo</div>'}</td>
      <td data-label="Estado"><span class="chip ${ec}">${esc(et)}</span></td>
      <td class="r num" data-label="Precio">${p.precio != null ? peso0(p.precio) : '—'}${p.precio_minimo != null ? `<div class="small ${p.bajo_minimo ? 'bad-t' : 'muted'}" style="${p.bajo_minimo ? 'font-weight:600' : ''}">mínimo ${peso0(p.precio_minimo)}</div>` : ''}</td>
      <td class="r num" data-label="Stock ofrecido">${p.ofrecido != null ? num.format(p.ofrecido) : '—'}</td>
      <td data-label="Vínculo">${p.vinculo === 'manual' ? '<span class="chip info">a mano</span>' : '<span class="chip">automático</span>'}</td></tr>`;
  }).join('') || `<tr><td colspan="8" class="muted">${pubs.length ? 'No hay publicaciones con esos filtros.' : 'Todavía no hay publicaciones vinculadas.'}</td></tr>`;
}

let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(filtrar, 200); };
['rev', 'est', 'ord', 'min'].forEach((id) => ($('#' + id).onchange = filtrar));
$('#ant').onclick = () => { pag--; pintar(); scrollTo(0, 0); };
$('#sig').onclick = () => { pag++; pintar(); scrollTo(0, 0); };
filtrar();
</script>
</body>
</html>
