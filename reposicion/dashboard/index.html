<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposición — Tablero</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e8eaed;
    --muted: #8b93a1; --accent: #4f8cff;
    --ok: #1e7e34; --bajo: #b8860b; --critico: #b02a37; --nostock: #7a1f2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
  h1 { font-size: 18px; margin: 0; }
  select, input[type=text], input[type=number] { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  input[type=number] { width: 70px; }
  input[type=text]#buscador { min-width: 220px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .toppanel { padding: 16px 20px 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .filtros-alerta { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 0 14px; font-size: 13px; color: var(--muted); }
  .filtros-alerta label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  main { padding: 0 20px 20px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  td.col-producto { max-width: 280px; overflow: hidden; text-overflow: ellipsis; cursor: help; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr.fila-producto { cursor: pointer; }
  tbody tr.fila-producto:hover { background: rgba(255,255,255,0.03); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; display: inline-block; }
  .proveedor-select { max-width: 130px; }
  .muted { color: var(--muted); }
  .solicitado { color: #6fcf97; font-weight: 600; }
  #status { padding: 20px; color: var(--muted); }
  .flecha { display: inline-block; transition: transform 0.15s; color: var(--muted); }
  .flecha.abierta { transform: rotate(90deg); }
  .fila-detalle td { background: rgba(255,255,255,0.02); white-space: normal; padding: 14px 20px; }
  .detalle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 24px; max-width: 900px; margin-bottom: 16px; }
  .detalle-item .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .detalle-item .valor { font-size: 14px; margin-top: 2px; }
  .destinos { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .destino-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 220px; flex: 1; }
  .destino-card h4 { margin: 0 0 8px; font-size: 13px; }
  .destino-card .fila-mini { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .destino-card .agregar { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .qty-input-error { outline: 2px solid var(--critico); }
  .detalle-acciones { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  #carritoBar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 20px; display: none; align-items: center; gap: 12px; z-index: 500; }
  #carritoBar.visible { display: flex; }
  #paginacion { display: none; align-items: center; justify-content: center; gap: 14px; padding: 16px 0; }
  #barraEstrella { display: none; padding: 4px 0 12px; }
  .estrella-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .estrella-chip { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 14px; }
  .estrella-chip.activo { background: var(--accent); border-color: var(--accent); }
  .estrella-resumen { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .estrella-resumen b { color: var(--text); font-size: 15px; margin-left: 4px; }
  #panelAgregarEstrella { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 12px; max-width: 760px; }
  #panelAgregarEstrella label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #panelAgregarEstrella input[type=text] { width: 100%; }
  #estrellaPreview { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: normal; }
  #estrellaPreview .ok { color: #6fcf97; }
  #estrellaPreview .warn { color: #e5b567; }
</style>
</head>
<body>
<div class="toppanel">
  <h1 id="titulo">📦 Reposición — Tablero</h1>
  <div id="ultimaActualizacion" class="muted" style="margin:2px 0 8px;"></div>
  <div id="barraEstrella">
    <div class="estrella-chips" id="estrellaChips"></div>
    <div class="estrella-resumen" id="estrellaResumen"></div>
    <div id="panelAgregarEstrella">
      <strong>⭐ Nuevo grupo estrella</strong>
      <label for="estrellaBuscar">1. Buscá un producto del grupo (por nombre o SKU)</label>
      <input type="text" id="estrellaBuscar" placeholder="Ej: funda tusor sillón">
      <label for="estrellaPrefijo">2. Prefijo de SKU — entran todas las variantes cuyo SKU empiece así</label>
      <input type="text" id="estrellaPrefijo" placeholder="Ej: PAH-FTR">
      <label for="estrellaNombre">3. Nombre del grupo</label>
      <input type="text" id="estrellaNombre" placeholder="Ej: Funda Tusor 100% Algodón para Sillón">
      <div id="estrellaPreview"></div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="btnGuardarEstrella">Guardar grupo</button>
        <button class="secondary" id="btnCancelarEstrella">Cancelar</button>
      </div>
    </div>
  </div>
  <div class="toolbar">

    <select id="filtroVista">
      <option value="necesita" selected>Necesita reposición</option>
      <option value="todos">Todos los productos</option>

    </select>
    <select id="filtroProveedor"><option value="">Todos los proveedores</option></select>
    <select id="filtroCategoria"><option value="">Todas las categorías</option></select>
    <select id="ordenarPor">
      <option value="sugerido" selected>Ordenar: sugerido a reponer</option>
      <option value="ganancia">Ordenar: mayor ganancia 60d</option>
      <option value="revenue">Ordenar: mayor revenue 60d</option>
    </select>
    <label class="chk"><input type="checkbox" id="ocultarSolicitados" checked> Ocultar ya solicitados</label>
    <button class="secondary" id="btnLimpiarFiltros" title="Vuelve buscador, proveedor, categoría, orden y vista a sus valores por defecto">✕ Limpiar filtros</button>
    <div class="toolbar-right">
      <button class="secondary" id="btnArmarPedido" disabled>🧾 Armar pedido (0)</button>
      <button class="secondary" id="btnDescontinuarMasivo" disabled>🚫 Descontinuar (0)</button>
      <select id="selectProveedorMasivo" disabled style="max-width:150px"><option value="">Asignar proveedor…</option></select>
      <input type="text" id="inputProveedorMasivoOtro" placeholder="Nombre del proveedor…" style="display:none;width:130px">
      <button class="secondary" id="btnAsignarProveedorMasivo" disabled>👤 Asignar (0)</button>
      <span id="contador" class="muted"></span>
      <button class="secondary" id="btnRefrescar">↻ Refrescar</button>
    </div>
  </div>
  <div class="filtros-alerta">
    <label><input type="checkbox" class="filtro-alerta" value="🔴 SIN STOCK" checked> 🔴 Sin stock</label>
    <label><input type="checkbox" class="filtro-alerta" value="🔴 CRÍTICO" checked> 🔴 Crítico</label>
    <label><input type="checkbox" class="filtro-alerta" value="🟡 BAJO" checked> 🟡 Bajo</label>
    <label><input type="checkbox" class="filtro-alerta" value="🟢 OK" checked> 🟢 OK</label>
    <label><input type="checkbox" class="filtro-alerta" value="⚫ Sin ventas con stock" checked> ⚫ Sin ventas con stock</label>
    <label><input type="checkbox" class="filtro-alerta" value="⚫ Sin stock +60 d" checked> ⚫ Sin stock +60 d</label>
  </div>
</div>
<main>
  <div id="status">Cargando…</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th><input type="checkbox" id="chkTodos" title="Seleccionar todos los que cumplen el filtro actual"></th>
        <th></th>
        <th>SKU</th>
        <th>Producto</th>
        <th>Proveedor</th>
        <th>Stock Depósito</th>
        <th>Stock Full PAH</th>
        <th>Vel/Sem</th>
        <th id="thReponerDeposito">Reponer Depósito</th>
        <th id="thReponerFull">Reponer Full</th>
        <th>Estado</th>
        <th>Quiebre depósito</th>
      </tr>
    </thead>
    <tbody id="filas"></tbody>
  </table>
  <div id="paginacion">
    <button class="secondary" id="btnPaginaAnterior">← Anterior</button>
    <span id="paginaInfo" class="muted"></span>
    <button class="secondary" id="btnPaginaSiguiente">Siguiente →</button>
  </div>
</main>

<div id="carritoBar">
  <span id="carritoTexto">🛒 0 líneas</span>
  <button id="btnVerCarrito">Ver carrito</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
// "Productos estrella" es el mismo tablero (misma tabla, mismo "Armar pedido")
// pero acotado a los grupos de productos que el usuario marcó como prioritarios
// — se activa con ?vista=estrella (link del menú).
const MODO_ESTRELLA = new URLSearchParams(location.search).get("vista") === "estrella";
renderNav(MODO_ESTRELLA ? "estrella" : "tablero");

// Config por destino — cada uno es un pool de stock independiente (ver
// reposicion/core.py:full_metrics_marca), la velocidad de depósito es
// general (stock compartido), la de cada Full es propia de su marca.
const DESTINOS = {
  deposito: {
    label: "Depósito", destino: "deposito",
    stock: (p) => p.stock_deposito_hoy ?? p.stock_deposito,
    velDiaria: "vel_diaria_deposito", velSemanal: "vel_semanal_deposito",
    vendido: "vendido_deposito", diasQuiebre: "dias_quiebre_deposito",
    fechaQuiebre: "fecha_quiebre_deposito", alerta: "alerta_deposito", aReponer: "a_reponer_deposito",
  },
  full_pret: {
    label: "Full Pret a Home", destino: "full_pret",
    stock: (p) => p.stock_full_pret_hoy,
    velDiaria: "vel_diaria_full_pret", velSemanal: "vel_semanal_full_pret",
    vendido: "vendido_full_pret", diasQuiebre: "dias_quiebre_full_pret",
    fechaQuiebre: "fecha_quiebre_full_pret", alerta: "alerta_full_pret", aReponer: "a_reponer_full_pret",
  },
  // Full Casa Lavan desactivado a pedido del usuario (2026-08-20): "no
  // estamos mandando nada a Full Lavan" — sacado de DESTINOS para que no
  // dispare alertas, no cuente para "necesita reposición" ni aparezca en la
  // tarjeta de "Agregar"/"Armar pedido". El stock sigue viendose en la
  // columna de la tabla (informativo). Para reactivarlo: volver a agregar
  // esta entrada, igual a la de full_pret con sufijo _full_lavan.
};

let PRODUCTOS = [];
const EXPANDIDAS = new Set();
const SELECTED = new Set();

// Paginación client-side: con miles de filas, renderizar la tabla entera cada
// vez que cambia un filtro tardaba varios segundos. SELECTED no se toca acá
// (es un Set de SKUs independiente del DOM) — por eso una fila tildada en la
// página 1 sigue tildada al volver de la página 2, aunque esa fila ya no
// esté en el tbody.
const FILAS_POR_PAGINA = 50;
let paginaActual = 1;

// Proveedores conocidos que deben aparecer como opción aunque todavía no
// tengan ningún SKU asignado (ej. un proveedor nuevo del que se va a cargar
// stock por primera vez).
const PROVEEDORES_CONOCIDOS = ["Guiwi"];

function listaProveedores() {
  return Array.from(new Set([...PRODUCTOS.map((p) => p.proveedor), ...PROVEEDORES_CONOCIDOS])).sort();
}

function alertaClass(alerta) {
  if (!alerta) return "";
  if (alerta.includes("SIN STOCK")) return "background:var(--nostock)";
  if (alerta.includes("CRÍTICO")) return "background:var(--critico)";
  if (alerta.includes("BAJO")) return "background:var(--bajo)";
  if (alerta.includes("OK")) return "background:var(--ok)";
  if (alerta.includes("Sin stock +60 d")) return "background:#4a3f5c";
  return "background:#333";
}

function velSemanalTotal(p) {
  // Vistazo rápido sin expandir: suma la velocidad semanal de los destinos
  // activos (depósito + Full Pret — Full Lavan desactivado, ver DESTINOS).
  return Object.values(DESTINOS).reduce((s, d) => s + (p[d.velSemanal] || 0), 0);
}

function otroDestinoConStock(p, actual) {
  // "SIN STOCK" en un canal no es tan grave si otro canal activo todavía
  // tiene unidades — se puede mover stock físicamente de depósito a Full (o
  // viceversa) para tapar el hueco, cosa que "OK"/"BAJO" no necesitan.
  // Pedido del usuario (2026-09-17): reservar "SIN STOCK" para cuando
  // NINGÚN canal activo tiene nada, y bajar a "CRÍTICO" cuando sí hay de
  // dónde mover. Esto es solo el label del canal en cuestión — no toca
  // a_reponer_* ni mezcla los pools entre sí, sigue siendo responsabilidad
  // manual del usuario decidir si mueve stock interno o pide al proveedor
  // (ver "Decisiones de diseño no obvias" en CLAUDE.md).
  return Object.values(DESTINOS).some((d) => d !== actual && (d.stock(p) || 0) > 0);
}

function nivelAlertaDestino(p, d) {
  // Mismo criterio de severidad que ya usa cada alerta_* por canal en
  // core.py (SIN STOCK > CRÍTICO > BAJO > OK, umbrales 14/30 días),
  // reevaluado acá (en vez de parsear el string alerta_full_pret, que trae
  // sufijo de marca, ej. "CRÍTICO FULL Pret") para poder comparar la
  // severidad entre destinos y quedarme con la peor.
  const stock = d.stock(p) || 0;
  const ventas = p[d.vendido] || 0;
  const velDiaria = p[d.velDiaria] || 0;
  const velSemanal = p[d.velSemanal] || 0;
  const diasQuiebre = p[d.diasQuiebre];
  if (ventas === 0) return null; // sin ventas en este destino: no participa del "peor"
  if (stock === 0 && velSemanal >= 1) {
    if (otroDestinoConStock(p, d)) return { nivel: 2, label: "🔴 CRÍTICO", destino: d.label };
    return { nivel: 3, label: "🔴 SIN STOCK", destino: d.label };
  }
  if (velDiaria > 0 && diasQuiebre != null && diasQuiebre < 14) return { nivel: 2, label: "🔴 CRÍTICO", destino: d.label };
  if (velDiaria > 0 && diasQuiebre != null && diasQuiebre < 30) return { nivel: 1, label: "🟡 BAJO", destino: d.label };
  return { nivel: 0, label: "🟢 OK", destino: d.label };
}

function peorEvaluacion(p) {
  // Toma la PEOR alerta entre los destinos activos, no un promedio de
  // stock/velocidad total. Sumar todo (como se hacía antes) puede esconder
  // que Full está por quebrar mientras depósito está sobrado, mostrando
  // "OK" cuando en realidad un canal es crítico (caso real detectado
  // 2026-08-21: PAH-TT420VERDE con depósito en 149 días de cobertura pero
  // Full Pret a 9 días — el badge combinado decía "OK", y "92+32 unidades a
  // 27/semana" también engaña: cada destino vende a su propio ritmo, el
  // stock de depósito no se le puede vender a un cliente de Full sin
  // moverlo físicamente primero). "Peor de los destinos" se había
  // descartado antes justamente porque Full Casa Lavan, siempre en 0,
  // dominaba con un falso SIN STOCK — pero ya no participa (desactivado,
  // ver DESTINOS), así que este enfoque vuelve a ser seguro.
  const evaluaciones = Object.values(DESTINOS)
    .map((d) => nivelAlertaDestino(p, d))
    .filter((e) => e !== null);
  if (!evaluaciones.length) return null;
  evaluaciones.sort((a, b) => b.nivel - a.nivel);
  return evaluaciones[0];
}

function estadoGeneral(p) {
  const peor = peorEvaluacion(p);
  if (peor) return peor.label;
  // Ningún destino activo vendió nada en los últimos 60 días. Se separa según
  // haya o no stock hoy (pedido del usuario, 2026-10-05): sin ventas pero CON
  // stock es mercadería parada; sin ventas y SIN stock en ningún canal es un
  // producto que lleva más de 60 días agotado (por eso no tiene ventas en la
  // ventana), distinto de un quiebre reciente, que sí tiene ventas y cae en
  // SIN STOCK / CRÍTICO.
  const hayStock = Object.values(DESTINOS).some((d) => (d.stock(p) || 0) > 0);
  return hayStock ? "⚫ Sin ventas con stock" : "⚫ Sin stock +60 d";
}

// Primer día con snapshots diarios guardados (repo_stock_snapshot). Un destino
// que ya estaba en 0 desde entonces no tiene fecha de quiebre exacta.
const STOCK_HISTORIAL_DESDE = "2026-08-12";

function hoyLocalISO() {
  return new Date().toLocaleDateString("en-CA"); // yyyy-mm-dd en la zona horaria del navegador
}

function quiebreDestinoHTML(p, d) {
  // Fecha de quiebre de UN destino:
  //  - con stock: la estimada (stock / velocidad de venta de ese destino).
  //  - ya quebrado con ventas: cuándo quebró de verdad. core.py devuelve
  //    "hoy" para un destino en 0, lo que mostraba siempre la fecha de la
  //    última actualización; weekly_calc.py lo reemplaza por el primer día
  //    en 0 del historial de snapshots (aplicar_fecha_quiebre_real).
  const stock = d.stock(p);
  const fecha = p[d.fechaQuiebre];
  const velDiaria = p[d.velDiaria] || 0;
  if (stock === 0 && velDiaria > 0) {
    let texto;
    if (fecha && fecha <= hoyLocalISO()) {
      texto = `Quebró ${fmtDate(fecha)}`;
    } else if (fecha) {
      // El cálculo todavía lo veía con stock (fecha estimada a futuro) pero el
      // último relevamiento de stock ya lo trae en 0: quebró entre ambos.
      const desde = p.stock_actualizado_at ? new Date(p.stock_actualizado_at).toLocaleDateString("en-CA") : hoyLocalISO();
      texto = `Quebró ${fmtDate(desde)}`;
    } else {
      texto = `Quebró antes del ${fmtDate(STOCK_HISTORIAL_DESDE)}`;
    }
    return `<span style="color:#e57373">${texto}</span>`;
  }
  return fmtDate(fecha);
}

function necesitaReposicionDestino(p, d) {
  // Mismo criterio que generar_reporte.py: quebrado con ventas históricas,
  // o quiebre <=10 días con velocidad>0 (ver generar_reporte.py:1498-1500).
  const stock = d.stock(p);
  const diasQuiebre = p[d.diasQuiebre];
  const velDiaria = p[d.velDiaria] || 0;
  const aReponer = p[d.aReponer] || 0;
  const quebradoConVentas = stock === 0 && (aReponer || velDiaria > 0);
  const porQuebrar = diasQuiebre !== null && diasQuiebre !== undefined && diasQuiebre <= 10 && velDiaria > 0;
  return (quebradoConVentas || porQuebrar) && aReponer > 0;
}

function necesitaReposicion(p) {
  return Object.values(DESTINOS).some((d) => necesitaReposicionDestino(p, d));
}

function renderProveedores() {
  const sel = document.getElementById("filtroProveedor");
  const actuales = new Set(Array.from(sel.options).map((o) => o.value));
  const proveedores = listaProveedores();
  for (const p of proveedores) {
    if (!actuales.has(p)) {
      const opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    }
  }
}

const ORDENADORES = {
  sugerido: (a, b) => {
    // Full Lavan queda afuera del ordenamiento — ver nota en DESTINOS más arriba.
    const maxA = Math.max(a.a_reponer_deposito || 0, a.a_reponer_full_pret || 0);
    const maxB = Math.max(b.a_reponer_deposito || 0, b.a_reponer_full_pret || 0);
    return maxB - maxA;
  },
  ganancia: (a, b) => (b.ganancia_60d || 0) - (a.ganancia_60d || 0),
  revenue: (a, b) => (b.revenue_60d || 0) - (a.revenue_60d || 0),
};

function renderCategorias() {
  const sel = document.getElementById("filtroCategoria");
  const actuales = new Set(Array.from(sel.options).map((o) => o.value));
  const categorias = Array.from(new Set(PRODUCTOS.map((p) => p.categoria || "Bazar"))).sort();
  for (const c of categorias) {
    if (!actuales.has(c)) {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    }
  }
}

function alertasSeleccionadas() {
  return new Set(Array.from(document.querySelectorAll(".filtro-alerta:checked")).map((chk) => chk.value));
}

function filasVisibles() {
  const vista = document.getElementById("filtroVista").value;
  const proveedor = document.getElementById("filtroProveedor").value;
  const categoria = document.getElementById("filtroCategoria").value;
  const ordenarPor = document.getElementById("ordenarPor").value;
  const ocultarSolicitados = document.getElementById("ocultarSolicitados").checked;
  const busqueda = document.getElementById("buscador").value.trim().toLowerCase();
  const alertas = alertasSeleccionadas();

  let rows = PRODUCTOS;
  // Si hay término de búsqueda, se busca en TODO el catálogo cargado —
  // el filtro "Necesita reposición" no debe esconder un SKU real que el
  // usuario está buscando a propósito (confirmado: familia 002225-* tiene
  // 26 variantes reales, pero solo 1 tenía sugerencia de reposición > 0,
  // así que buscando "002225-" con la vista en "Necesita reposición" antes
  // solo mostraba esa una, pareciendo que faltaban productos).
  if (MODO_ESTRELLA) {
    // Todas las variantes del grupo (también las que hoy no necesitan
    // reposición) — el objetivo es ver el grupo completo de un vistazo.
    const grupos = grupoActivo ? GRUPOS_ESTRELLA.filter((g) => g.prefijo === grupoActivo) : GRUPOS_ESTRELLA;
    rows = rows.filter((p) => grupos.some((g) => enGrupo(p, g)));
  } else if (!busqueda && vista === "necesita") {
    rows = rows.filter(necesitaReposicion);
  }
  rows = rows.filter((p) => alertas.has(estadoGeneral(p)));
  if (proveedor) rows = rows.filter((p) => p.proveedor === proveedor);
  if (categoria) rows = rows.filter((p) => (p.categoria || "Bazar") === categoria);
  if (ocultarSolicitados) {
    rows = rows.filter((p) => (p.destinos_ya_solicitados || []).length === 0);
  }
  if (busqueda) {
    rows = rows.filter((p) =>
      p.sku.toLowerCase().includes(busqueda) || (p.nombre || "").toLowerCase().includes(busqueda)
    );
  }
  return rows.sort(ORDENADORES[ordenarPor] || ORDENADORES.sugerido);
}

function renderDestinoCard(p, key) {
  const d = DESTINOS[key];
  const yaSolicitado = (p.destinos_ya_solicitados || []).includes(d.destino);
  const sugerido = p[d.aReponer] || 0;
  const card = document.createElement("div");
  card.className = "destino-card";
  card.innerHTML = `
    <h4>${d.label}</h4>
    <div class="fila-mini"><span>Stock hoy</span><span>${fmtNum(d.stock(p))}</span></div>
    <div class="fila-mini"><span>Vendido 60d</span><span>${fmtNum(p[d.vendido])}</span></div>
    <div class="fila-mini"><span>Vel. diaria/sem.</span><span>${fmtNum(p[d.velDiaria])} / ${fmtNum(p[d.velSemanal])}</span></div>
    <div class="fila-mini"><span>Días quiebre</span><span>${fmtNum(p[d.diasQuiebre])}</span></div>
    <div class="fila-mini"><span>Fecha quiebre</span><span>${quiebreDestinoHTML(p, d)}</span></div>
    <div class="fila-mini"><span>Alerta</span><span><span class="badge" style="${alertaClass(p[d.alerta])}">${p[d.alerta] || "—"}</span></span></div>
    ${yaSolicitado ? '<div class="fila-mini solicitado">✓ Ya solicitado en este destino</div>' : ""}
    <div class="agregar">
      <input type="number" min="0" value="${sugerido}" class="qty-input" data-destino="${d.destino}"
        title="${sugerido === 0 ? "Sin sugerencia automática (sin ventas en este destino) — escribí la cantidad que quieras pedir" : ""}">
      <button class="secondary btn-agregar" data-destino="${d.destino}">🛒 Agregar</button>
    </div>
  `;
  const inputQty = card.querySelector(".qty-input");
  inputQty.addEventListener("focus", () => inputQty.select());
  card.querySelector(".btn-agregar").addEventListener("click", () => {
    const qty = Number(inputQty.value);
    if (!qty || qty <= 0) {
      // Antes esto no hacía nada — parecía que el sistema bloqueaba agregar
      // productos "sin ventas" (que arrancan en cantidad sugerida 0) cuando
      // en realidad solo faltaba escribir una cantidad manual.
      inputQty.focus();
      inputQty.classList.add("qty-input-error");
      setTimeout(() => inputQty.classList.remove("qty-input-error"), 1200);
      return;
    }
    addLineaCarrito({
      sku: p.sku, nombre: p.nombre, proveedor: p.proveedor,
      destino: d.destino, cantidad: qty, cantidad_sugerida: sugerido,
      stock_hoy: d.stock(p) ?? 0,
    });
    actualizarBarraCarrito();
    const btn = card.querySelector(".btn-agregar");
    btn.textContent = "✓ Agregado";
    setTimeout(() => { btn.textContent = "🛒 Agregar"; }, 1200);
  });
  return card;
}

function renderPaginacion(totalFilas, totalPaginas) {
  const cont = document.getElementById("paginacion");
  if (totalPaginas <= 1) { cont.style.display = "none"; return; }
  cont.style.display = "flex";
  document.getElementById("paginaInfo").textContent =
    `Página ${paginaActual} de ${totalPaginas} (${totalFilas} productos)`;
  const btnAnt = document.getElementById("btnPaginaAnterior");
  const btnSig = document.getElementById("btnPaginaSiguiente");
  btnAnt.disabled = paginaActual <= 1;
  btnSig.disabled = paginaActual >= totalPaginas;
  btnAnt.onclick = () => { paginaActual--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  btnSig.onclick = () => { paginaActual++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

function render() {
  const rows = filasVisibles();
  document.getElementById("contador").textContent = `${rows.length} productos`;

  const totalPaginas = Math.max(1, Math.ceil(rows.length / FILAS_POR_PAGINA));
  if (paginaActual > totalPaginas) paginaActual = totalPaginas;
  if (paginaActual < 1) paginaActual = 1;
  const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
  const rowsPagina = rows.slice(inicio, inicio + FILAS_POR_PAGINA);

  const tbody = document.getElementById("filas");
  tbody.innerHTML = "";

  const chkTodos = document.getElementById("chkTodos");
  // "Seleccionar todos" opera sobre TODOS los filtrados (todas las páginas,
  // no solo la visible) — así "Armar pedido"/"Descontinuar" masivo puede
  // juntar más de 50 productos sin tener que tildar página por página.
  chkTodos.checked = rows.length > 0 && rows.every((p) => SELECTED.has(p.sku));
  chkTodos.onclick = (e) => e.stopPropagation();
  chkTodos.onchange = () => {
    if (chkTodos.checked) rows.forEach((p) => SELECTED.add(p.sku));
    else rows.forEach((p) => SELECTED.delete(p.sku));
    render();
    actualizarBotonesMasivos();
  };

  for (const p of rowsPagina) {
    const tr = document.createElement("tr");
    tr.className = "fila-producto";
    const abierta = EXPANDIDAS.has(p.sku);
    const alertaResumen = estadoGeneral(p);
    tr.innerHTML = `
      <td><input type="checkbox" class="chk-fila" ${SELECTED.has(p.sku) ? "checked" : ""}></td>
      <td><span class="flecha ${abierta ? "abierta" : ""}">▸</span></td>
      <td>${p.sku}</td>
      <td class="col-producto" title="${(p.nombre || "").replace(/"/g, "&quot;")}">${p.nombre || "<span class=muted>(sin nombre)</span>"}</td>
      <td></td>
      <td>${fmtNum(DESTINOS.deposito.stock(p))}</td>
      <td>${fmtNum(DESTINOS.full_pret.stock(p))}</td>
      <td>${fmtNum(velSemanalTotal(p))}</td>
      <td>${fmtNum(p.a_reponer_deposito)}</td>
      <td>${fmtNum(p.a_reponer_full_pret)}</td>
      <td><span class="badge" style="${alertaClass(alertaResumen)}">${alertaResumen || "—"}</span></td>
      <td>${quiebreDestinoHTML(p, DESTINOS.deposito)}</td>
    `;

    const chkFila = tr.querySelector(".chk-fila");
    chkFila.addEventListener("click", (e) => e.stopPropagation());
    chkFila.addEventListener("change", () => {
      if (chkFila.checked) SELECTED.add(p.sku); else SELECTED.delete(p.sku);
      chkTodos.checked = rows.length > 0 && rows.every((x) => SELECTED.has(x.sku));
      actualizarBotonesMasivos();
    });

    const tdProveedor = tr.children[4];
    const select = document.createElement("select");
    select.className = "proveedor-select";
    for (const prov of listaProveedores()) {
      const opt = document.createElement("option");
      opt.value = prov; opt.textContent = prov;
      if (prov === p.proveedor) opt.selected = true;
      select.appendChild(opt);
    }
    const otro = document.createElement("option");
    otro.value = "__otro__"; otro.textContent = "Otro…";
    select.appendChild(otro);

    const guardarProveedor = async (valor) => {
      await apiFetch(`/productos/${encodeURIComponent(p.sku)}/proveedor`, {
        method: "POST", body: JSON.stringify({ proveedor: valor }),
      });
      p.proveedor_manual = valor; p.proveedor = valor;
      renderProveedores();
      render();
    };

    const inputOtro = document.createElement("input");
    inputOtro.type = "text";
    inputOtro.placeholder = "Nombre del proveedor…";
    inputOtro.style.display = "none";
    inputOtro.style.marginLeft = "4px";
    inputOtro.addEventListener("click", (e) => e.stopPropagation());
    inputOtro.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && inputOtro.value.trim()) guardarProveedor(inputOtro.value.trim());
    });
    inputOtro.addEventListener("blur", () => {
      if (inputOtro.value.trim()) guardarProveedor(inputOtro.value.trim());
    });
    select.addEventListener("click", (e) => e.stopPropagation());
    select.addEventListener("change", async () => {
      if (select.value === "__otro__") {
        inputOtro.style.display = "inline-block";
        inputOtro.focus();
        return;
      }
      await guardarProveedor(select.value);
    });
    tdProveedor.appendChild(select);
    tdProveedor.appendChild(inputOtro);

    tr.addEventListener("click", () => {
      if (EXPANDIDAS.has(p.sku)) EXPANDIDAS.delete(p.sku); else EXPANDIDAS.add(p.sku);
      render();
    });

    tbody.appendChild(tr);
    if (abierta) tbody.appendChild(renderDetalle(p));
  }

  renderPaginacion(rows.length, totalPaginas);
  if (MODO_ESTRELLA) renderBarraEstrella(rows);
}

// ─── Productos estrella ─────────────────────────────────────────────────────
// Un grupo = prefijo de SKU + nombre (ej. "PAH-FTR" → todas las variantes de la
// funda de sillón). Se guarda en el servidor (/grupos-estrella) así que se ve
// igual desde cualquier navegador.

const GRUPO_ACTIVO_KEY = "repo_grupo_estrella_activo";
let GRUPOS_ESTRELLA = [];
let grupoActivo = ""; // prefijo del grupo seleccionado; "" = todos los grupos
try { grupoActivo = localStorage.getItem(GRUPO_ACTIVO_KEY) || ""; } catch { /* sin storage: arranca en "todos" */ }

function enGrupo(p, g) {
  return p.sku.toUpperCase().startsWith(g.prefijo);
}

function recordarGrupoActivo() {
  try { localStorage.setItem(GRUPO_ACTIVO_KEY, grupoActivo); } catch { /* conveniencia, no crítico */ }
}

function seleccionarGrupo(prefijo) {
  grupoActivo = prefijo;
  recordarGrupoActivo();
  paginaActual = 1;
  render();
}

function sumar(rows, fn) {
  return rows.reduce((s, p) => s + (fn(p) || 0), 0);
}

function renderBarraEstrella(rows) {
  // `rows` = filas ya filtradas (grupo activo + filtros de la barra). Las sumas
  // van separadas por canal a propósito — nunca se mezclan depósito y Full.
  const chips = document.getElementById("estrellaChips");
  chips.innerHTML = "";
  const crearChip = (texto, prefijo) => {
    const b = document.createElement("button");
    b.className = "estrella-chip" + (grupoActivo === prefijo ? " activo" : "");
    b.textContent = texto;
    b.addEventListener("click", () => seleccionarGrupo(prefijo));
    chips.appendChild(b);
  };
  const totalVariantes = PRODUCTOS.filter((p) => GRUPOS_ESTRELLA.some((g) => enGrupo(p, g))).length;
  if (GRUPOS_ESTRELLA.length) crearChip(`Todos los grupos (${totalVariantes})`, "");
  for (const g of GRUPOS_ESTRELLA) {
    crearChip(`${g.nombre} (${PRODUCTOS.filter((p) => enGrupo(p, g)).length})`, g.prefijo);
  }
  const btnAgregar = document.createElement("button");
  btnAgregar.className = "secondary";
  btnAgregar.textContent = "＋ Agregar grupo";
  btnAgregar.addEventListener("click", abrirPanelEstrella);
  chips.appendChild(btnAgregar);
  if (grupoActivo) {
    const btnQuitar = document.createElement("button");
    btnQuitar.className = "secondary";
    btnQuitar.textContent = "🗑 Quitar este grupo";
    btnQuitar.addEventListener("click", quitarGrupoActivo);
    chips.appendChild(btnQuitar);
  }

  const resumen = document.getElementById("estrellaResumen");
  if (!GRUPOS_ESTRELLA.length) {
    resumen.textContent = "Todavía no marcaste ningún grupo estrella — tocá “＋ Agregar grupo”.";
    return;
  }
  const etq = etiquetaCobertura();
  resumen.innerHTML = `
    <span>Variantes<b>${rows.length}</b></span>
    <span>Stock depósito<b>${fmtNum(sumar(rows, (p) => DESTINOS.deposito.stock(p)))}</b></span>
    <span>Stock Full<b>${fmtNum(sumar(rows, (p) => DESTINOS.full_pret.stock(p)))}</b></span>
    <span>Reponer Depósito${etq}<b>${fmtNum(sumar(rows, (p) => p.a_reponer_deposito))}</b></span>
    <span>Reponer Full${etq}<b>${fmtNum(sumar(rows, (p) => p.a_reponer_full_pret))}</b></span>`;
}

async function guardarGrupos(lista) {
  GRUPOS_ESTRELLA = await apiFetch("/grupos-estrella", {
    method: "POST", body: JSON.stringify({ grupos: lista }),
  });
}

async function quitarGrupoActivo() {
  const g = GRUPOS_ESTRELLA.find((x) => x.prefijo === grupoActivo);
  if (!g) return;
  if (!confirm(`¿Quitar el grupo “${g.nombre}” de productos estrella? Los productos no se borran, solo dejan de estar en esta vista.`)) return;
  await guardarGrupos(GRUPOS_ESTRELLA.filter((x) => x.prefijo !== g.prefijo));
  seleccionarGrupo("");
}

function prefijoComun(skus) {
  if (!skus.length) return "";
  let pref = skus[0].toUpperCase();
  for (const s of skus) {
    const u = s.toUpperCase();
    let i = 0;
    while (i < pref.length && i < u.length && pref[i] === u[i]) i++;
    pref = pref.slice(0, i);
    if (!pref) break;
  }
  return pref;
}

function nombreComun(nombres) {
  // Palabras iniciales que comparten todos los nombres ("Funda Tusor 100%
  // Algodón para Sillón" de "…Sillón 1 Cuerpo" y "…Sillón de 2 Cuerpos"),
  // sin conectores colgando al final.
  const listas = nombres.filter(Boolean).map((n) => n.split(/\s+/));
  if (!listas.length) return "";
  let comunes = listas[0];
  for (const l of listas) {
    let i = 0;
    while (i < comunes.length && i < l.length && comunes[i] === l[i]) i++;
    comunes = comunes.slice(0, i);
  }
  while (comunes.length && /^(de|del|para|en|con|y|-|–)$/i.test(comunes[comunes.length - 1])) comunes.pop();
  return comunes.join(" ");
}

const panelEstrella = { prefijoEditado: false, nombreEditado: false };

function abrirPanelEstrella() {
  panelEstrella.prefijoEditado = false;
  panelEstrella.nombreEditado = false;
  for (const id of ["estrellaBuscar", "estrellaPrefijo", "estrellaNombre"]) document.getElementById(id).value = "";
  document.getElementById("estrellaPreview").textContent = "";
  document.getElementById("panelAgregarEstrella").style.display = "block";
  document.getElementById("estrellaBuscar").focus();
}

function cerrarPanelEstrella() {
  document.getElementById("panelAgregarEstrella").style.display = "none";
}

function coincidenciasBusqueda(texto) {
  const palabras = texto.toLowerCase().split(/\s+/).filter(Boolean);
  if (!palabras.length) return [];
  return PRODUCTOS.filter((p) => {
    const hay = `${p.sku} ${p.nombre || ""}`.toLowerCase();
    return palabras.every((w) => hay.includes(w));
  });
}

function actualizarPreviewEstrella() {
  const prefijo = document.getElementById("estrellaPrefijo").value.trim().toUpperCase();
  const preview = document.getElementById("estrellaPreview");
  const btn = document.getElementById("btnGuardarEstrella");
  btn.disabled = true;
  preview.innerHTML = "";
  const linea = (clase, texto) => {
    const d = document.createElement("div");
    d.className = clase;
    d.textContent = texto;
    preview.appendChild(d);
  };
  if (prefijo.length < 3) {
    linea("warn", "Escribí un prefijo de al menos 3 caracteres (ej. PAH-FTR). Si buscaste varios productos distintos y no comparten código, afiná la búsqueda.");
    return;
  }
  const matches = PRODUCTOS.filter((p) => p.sku.toUpperCase().startsWith(prefijo));
  if (!matches.length) { linea("warn", `Ningún SKU empieza con “${prefijo}”.`); return; }
  if (GRUPOS_ESTRELLA.some((g) => g.prefijo === prefijo)) { linea("warn", `Ya existe un grupo con el prefijo ${prefijo}.`); return; }
  const nombres = Array.from(new Set(matches.map((p) => p.nombre).filter(Boolean)));
  linea("ok", `✓ ${matches.length} variantes con SKU “${prefijo}…” — ${nombres.length} producto(s) distinto(s):`);
  for (const n of nombres.slice(0, 5)) linea("", `• ${n}`);
  if (nombres.length > 5) linea("", `… y ${nombres.length - 5} más`);
  btn.disabled = false;
}

document.getElementById("estrellaBuscar").addEventListener("input", () => {
  const matches = coincidenciasBusqueda(document.getElementById("estrellaBuscar").value);
  if (!panelEstrella.prefijoEditado) {
    document.getElementById("estrellaPrefijo").value = prefijoComun(matches.map((p) => p.sku));
  }
  if (!panelEstrella.nombreEditado) {
    document.getElementById("estrellaNombre").value = nombreComun(matches.map((p) => p.nombre));
  }
  actualizarPreviewEstrella();
});
document.getElementById("estrellaPrefijo").addEventListener("input", () => {
  panelEstrella.prefijoEditado = true;
  actualizarPreviewEstrella();
});
document.getElementById("estrellaNombre").addEventListener("input", () => { panelEstrella.nombreEditado = true; });
document.getElementById("btnCancelarEstrella").addEventListener("click", cerrarPanelEstrella);
document.getElementById("btnGuardarEstrella").addEventListener("click", async () => {
  const prefijo = document.getElementById("estrellaPrefijo").value.trim().toUpperCase();
  const nombre = document.getElementById("estrellaNombre").value.trim() || prefijo;
  const btn = document.getElementById("btnGuardarEstrella");
  btn.disabled = true;
  try {
    await guardarGrupos([...GRUPOS_ESTRELLA, { prefijo, nombre }]);
    cerrarPanelEstrella();
    seleccionarGrupo(prefijo);
  } catch (e) {
    document.getElementById("estrellaPreview").textContent = `No se pudo guardar: ${e.message}`;
    btn.disabled = false;
  }
});

// Los encabezados dicen a cuántos días de cobertura está calculada la
// sugerencia (repo_settings.coverage_days → coverage_days_usado en cada fila),
// así el rótulo nunca miente si ese setting cambia.
function etiquetaCobertura() {
  const fila = PRODUCTOS.find((p) => p.coverage_days_usado);
  return fila ? ` (${fila.coverage_days_usado} D)` : "";
}

function actualizarEtiquetasCobertura() {
  const etq = etiquetaCobertura();
  document.getElementById("thReponerDeposito").textContent = `Reponer Depósito${etq}`;
  document.getElementById("thReponerFull").textContent = `Reponer Full${etq}`;
}

// Cambiar un filtro (búsqueda, proveedor, categoría, orden, alertas, etc.)
// vuelve a la página 1 — de lo contrario, si el usuario está en la página 3
// y busca algo, se puede quedar en una página vacía porque el nuevo
// resultado tiene menos filas. Tildar checkboxes o expandir una fila NO pasa
// por acá, así que no mueve al usuario de página.
function filtrar() {
  paginaActual = 1;
  render();
}

function actualizarUltimaActualizacion() {
  // El stock se sincroniza todos los días (06:00 AR) y el cálculo de
  // velocidad/reposición una vez por semana (lunes 07:00 AR) — se muestran
  // los dos por separado para que se note si alguno de los dos dejó de
  // correr, en vez de un solo timestamp que puede tapar ese problema.
  let stockAt = null, calculoAt = null;
  for (const p of PRODUCTOS) {
    if (p.stock_actualizado_at && (!stockAt || p.stock_actualizado_at > stockAt)) stockAt = p.stock_actualizado_at;
    if (p.fecha_corrida && (!calculoAt || p.fecha_corrida > calculoAt)) calculoAt = p.fecha_corrida;
  }
  document.getElementById("ultimaActualizacion").textContent =
    `Última actualización — Stock: ${fmtFechaHora(stockAt)} · Cálculo semanal: ${fmtFechaHora(calculoAt)}`;
}

async function cargar() {
  paginaActual = 1;
  document.getElementById("status").textContent = "Cargando…";
  document.getElementById("tabla").style.display = "none";
  try {
    const vista = MODO_ESTRELLA ? "necesita" : document.getElementById("filtroVista").value;
    const qs = vista === "descontinuados" ? "?descontinuados=true" : "";
    PRODUCTOS = await apiFetch(`/productos${qs}`);
    // En serie (no en paralelo con /productos): si todavía no hay login, dos
    // apiFetch simultáneos abrirían dos veces el formulario y uno se perdería.
    if (MODO_ESTRELLA) {
      GRUPOS_ESTRELLA = await apiFetch("/grupos-estrella");
      if (grupoActivo && !GRUPOS_ESTRELLA.some((g) => g.prefijo === grupoActivo)) grupoActivo = "";
    }
    actualizarEtiquetasCobertura();
    renderProveedores();
    renderProveedorMasivoSelect();
    renderCategorias();
    render();
    actualizarUltimaActualizacion();
    actualizarBarraCarrito();
    actualizarBotonesMasivos();
    document.getElementById("status").style.display = "none";
    document.getElementById("tabla").style.display = "table";
  } catch (e) {
    document.getElementById("status").textContent = `Error: ${e.message}`;
  }
}

function renderProveedorMasivoSelect() {
  const sel = document.getElementById("selectProveedorMasivo");
  const valorActual = sel.value;
  sel.innerHTML = '<option value="">Asignar proveedor…</option>';
  for (const prov of listaProveedores()) {
    const opt = document.createElement("option");
    opt.value = prov; opt.textContent = prov;
    sel.appendChild(opt);
  }
  const otro = document.createElement("option");
  otro.value = "__otro__"; otro.textContent = "Otro…";
  sel.appendChild(otro);
  sel.value = valorActual || "";
}

function actualizarBotonesMasivos() {
  const n = SELECTED.size;
  const btnPedido = document.getElementById("btnArmarPedido");
  const btnDescontinuar = document.getElementById("btnDescontinuarMasivo");
  const selectProveedor = document.getElementById("selectProveedorMasivo");
  const btnAsignarProveedor = document.getElementById("btnAsignarProveedorMasivo");
  btnPedido.textContent = `🧾 Armar pedido (${n})`;
  btnDescontinuar.textContent = `🚫 Descontinuar (${n})`;
  btnAsignarProveedor.textContent = `👤 Asignar (${n})`;
  btnPedido.disabled = n === 0;
  btnDescontinuar.disabled = n === 0;
  selectProveedor.disabled = n === 0;
  btnAsignarProveedor.disabled = n === 0;
}

function actualizarBarraCarrito() {
  const carrito = getCarrito();
  const bar = document.getElementById("carritoBar");
  if (!carrito.length) { bar.classList.remove("visible"); return; }
  bar.classList.add("visible");
  const totalUnidades = carrito.reduce((s, l) => s + l.cantidad, 0);
  document.getElementById("carritoTexto").textContent = `🛒 ${carrito.length} líneas · ${totalUnidades} unidades`;
}

if (MODO_ESTRELLA) {
  document.title = "Reposición — Productos estrella";
  document.getElementById("titulo").textContent = "⭐ Reposición — Productos estrella";
  document.getElementById("barraEstrella").style.display = "block";
  document.getElementById("filtroVista").style.display = "none";
  // Acá lo que importa es ver el grupo completo, incluso lo ya pedido.
  document.getElementById("ocultarSolicitados").checked = false;
}

document.getElementById("filtroVista").addEventListener("change", cargar);
document.getElementById("filtroProveedor").addEventListener("change", filtrar);
document.getElementById("filtroCategoria").addEventListener("change", filtrar);
document.getElementById("ordenarPor").addEventListener("change", filtrar);
document.getElementById("ocultarSolicitados").addEventListener("change", filtrar);
document.getElementById("buscador").addEventListener("input", filtrar);
document.querySelectorAll(".filtro-alerta").forEach((chk) => { chk.addEventListener("change", filtrar); });
document.getElementById("btnRefrescar").addEventListener("click", cargar);
document.getElementById("btnVerCarrito").addEventListener("click", () => { window.location.href = "pedido.html"; });
document.getElementById("btnLimpiarFiltros").addEventListener("click", () => {
  document.getElementById("buscador").value = "";
  document.getElementById("filtroProveedor").value = "";
  document.getElementById("filtroCategoria").value = "";
  document.getElementById("ordenarPor").value = "sugerido";
  document.querySelectorAll(".filtro-alerta").forEach((chk) => { chk.checked = true; });
  if (MODO_ESTRELLA) document.getElementById("ocultarSolicitados").checked = false;
  const vistaCambio = document.getElementById("filtroVista").value !== "necesita";
  document.getElementById("filtroVista").value = "necesita";
  // "Descontinuados" trae un dataset distinto del servidor (no es un filtro
  // client-side) — si veníamos de ahí hace falta recargar, no solo re-renderizar.
  vistaCambio ? cargar() : filtrar();
});

// Selección masiva (checkbox por fila + "tildar todos los filtrados", ver
// render()/SELECTED más arriba) — segundo punto de entrada a estas dos
// acciones, además de los botones dentro del panel expandido por fila.
document.getElementById("btnArmarPedido").addEventListener("click", () => {
  const seleccionados = PRODUCTOS.filter((p) => SELECTED.has(p.sku));
  for (const p of seleccionados) {
    // Se agrega SIEMPRE una línea por destino activo, incluso con sugerencia
    // 0 — antes solo se agregaba el destino con sugerencia > 0, así que si
    // (por ej.) depósito tenía sugerencia y Full no, la línea de Full nunca
    // se creaba: el carrito mostraba "stock: —" en Full aunque el usuario
    // cargara una cantidad a mano ahí, porque ese stock_hoy nunca se había
    // capturado. Una cantidad en 0 no rompe nada — el carrito/PDF/pedido ya
    // ignoran las líneas en 0 al confirmar (ver lineasDelGrupo en pedido.html).
    for (const key of Object.keys(DESTINOS)) {
      const d = DESTINOS[key];
      const sugerido = p[d.aReponer] || 0;
      addLineaCarrito({
        sku: p.sku, nombre: p.nombre, proveedor: p.proveedor,
        destino: d.destino, cantidad: sugerido, cantidad_sugerida: sugerido,
        stock_hoy: d.stock(p) ?? 0,
      });
    }
  }
  window.location.href = "pedido.html";
});
document.getElementById("btnDescontinuarMasivo").addEventListener("click", async () => {
  const skus = Array.from(SELECTED);
  if (!skus.length) return;
  if (!confirm(`¿Marcar ${skus.length} producto(s) como descontinuado(s)? Dejan de aparecer en las sugerencias de reposición.`)) return;
  await Promise.all(skus.map((sku) =>
    apiFetch(`/productos/${encodeURIComponent(sku)}/descontinuar`, {
      method: "POST", body: JSON.stringify({ descontinuado: true, por: getUser() }),
    })
  ));
  SELECTED.clear();
  cargar();
});

document.getElementById("selectProveedorMasivo").addEventListener("change", () => {
  const esOtro = document.getElementById("selectProveedorMasivo").value === "__otro__";
  document.getElementById("inputProveedorMasivoOtro").style.display = esOtro ? "inline-block" : "none";
  if (esOtro) document.getElementById("inputProveedorMasivoOtro").focus();
});
document.getElementById("btnAsignarProveedorMasivo").addEventListener("click", async () => {
  const select = document.getElementById("selectProveedorMasivo");
  const inputOtro = document.getElementById("inputProveedorMasivoOtro");
  const valor = select.value === "__otro__" ? inputOtro.value.trim() : select.value;
  const skus = Array.from(SELECTED);
  if (!valor || !skus.length) return;
  if (!confirm(`¿Asignar el proveedor "${valor}" a ${skus.length} producto(s)?`)) return;
  await Promise.all(skus.map((sku) =>
    apiFetch(`/productos/${encodeURIComponent(sku)}/proveedor`, {
      method: "POST", body: JSON.stringify({ proveedor: valor }),
    })
  ));
  select.value = "";
  inputOtro.value = "";
  inputOtro.style.display = "none";
  SELECTED.clear();
  cargar();
});

cargar();
</script>
</body>
</html>
