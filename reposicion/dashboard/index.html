<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposición — Tablero</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e8eaed;
    --muted: #8b93a1; --accent: #4f8cff;
    --ok: #1e7e34; --bajo: #b8860b; --critico: #b02a37; --nostock: #7a1f2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
  h1 { font-size: 18px; margin: 0; }
  select, input[type=text], input[type=number] { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  input[type=number] { width: 70px; }
  input[type=text]#buscador { min-width: 220px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .toppanel { padding: 16px 20px 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  main { padding: 0 20px 20px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr.fila-producto { cursor: pointer; }
  tbody tr.fila-producto:hover { background: rgba(255,255,255,0.03); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; display: inline-block; }
  .proveedor-select { max-width: 130px; }
  .muted { color: var(--muted); }
  .solicitado { color: #6fcf97; font-weight: 600; }
  #status { padding: 20px; color: var(--muted); }
  .flecha { display: inline-block; transition: transform 0.15s; color: var(--muted); }
  .flecha.abierta { transform: rotate(90deg); }
  .fila-detalle td { background: rgba(255,255,255,0.02); white-space: normal; padding: 14px 20px; }
  .detalle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 24px; max-width: 900px; margin-bottom: 16px; }
  .detalle-item .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .detalle-item .valor { font-size: 14px; margin-top: 2px; }
  .destinos { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .destino-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 220px; flex: 1; }
  .destino-card h4 { margin: 0 0 8px; font-size: 13px; }
  .destino-card .fila-mini { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .destino-card .agregar { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .detalle-acciones { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  #carritoBar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 20px; display: none; align-items: center; gap: 12px; z-index: 500; }
  #carritoBar.visible { display: flex; }
</style>
</head>
<body>
<div class="toppanel">
  <h1>📦 Reposición — Tablero</h1>
  <div class="toolbar">
    <input type="text" id="buscador" placeholder="Buscar por SKU o producto…">
    <select id="filtroVista">
      <option value="necesita" selected>Necesita reposición</option>
      <option value="todos">Todos los productos</option>
      <option value="descontinuados">Descontinuados</option>
    </select>
    <select id="filtroProveedor"><option value="">Todos los proveedores</option></select>
    <select id="filtroCategoria"><option value="">Todas las categorías</option></select>
    <select id="ordenarPor">
      <option value="sugerido" selected>Ordenar: sugerido a reponer</option>
      <option value="ganancia">Ordenar: mayor ganancia 60d</option>
      <option value="revenue">Ordenar: mayor revenue 60d</option>
    </select>
    <label class="chk"><input type="checkbox" id="ocultarSolicitados" checked> Ocultar ya solicitados</label>
    <button class="secondary" id="btnLimpiarFiltros" title="Vuelve buscador, proveedor, categoría, orden y vista a sus valores por defecto">✕ Limpiar filtros</button>
    <div class="toolbar-right">
      <button class="secondary" id="btnArmarPedido" disabled>🧾 Armar pedido (0)</button>
      <button class="secondary" id="btnDescontinuarMasivo" disabled>🚫 Descontinuar (0)</button>
      <select id="selectProveedorMasivo" disabled style="max-width:150px"><option value="">Asignar proveedor…</option></select>
      <input type="text" id="inputProveedorMasivoOtro" placeholder="Nombre del proveedor…" style="display:none;width:130px">
      <button class="secondary" id="btnAsignarProveedorMasivo" disabled>👤 Asignar (0)</button>
      <span id="contador" class="muted"></span>
      <button class="secondary" id="btnRefrescar">↻ Refrescar</button>
    </div>
  </div>
</div>
<main>
  <div id="status">Cargando…</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th><input type="checkbox" id="chkTodos" title="Seleccionar todos los que cumplen el filtro actual"></th>
        <th></th>
        <th>SKU</th>
        <th>Producto</th>
        <th>Proveedor</th>
        <th>Stock Depósito</th>
        <th>Stock Full PAH</th>
        <th>Stock Full CL</th>
        <th>Vel/Sem</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="filas"></tbody>
  </table>
</main>

<div id="carritoBar">
  <span id="carritoTexto">🛒 0 líneas</span>
  <button id="btnVerCarrito">Ver carrito</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
renderNav("tablero");

// Config por destino — cada uno es un pool de stock independiente (ver
// reposicion/core.py:full_metrics_marca), la velocidad de depósito es
// general (stock compartido), la de cada Full es propia de su marca.
const DESTINOS = {
  deposito: {
    label: "Depósito", destino: "deposito",
    stock: (p) => p.stock_deposito_hoy ?? p.stock_deposito,
    velDiaria: "vel_diaria_deposito", velSemanal: "vel_semanal_deposito",
    vendido: "vendido_deposito", diasQuiebre: "dias_quiebre_deposito",
    fechaQuiebre: "fecha_quiebre_deposito", alerta: "alerta_deposito", aReponer: "a_reponer_deposito",
  },
  full_pret: {
    label: "Full Pret a Home", destino: "full_pret",
    stock: (p) => p.stock_full_pret_hoy,
    velDiaria: "vel_diaria_full_pret", velSemanal: "vel_semanal_full_pret",
    vendido: "vendido_full_pret", diasQuiebre: "dias_quiebre_full_pret",
    fechaQuiebre: "fecha_quiebre_full_pret", alerta: "alerta_full_pret", aReponer: "a_reponer_full_pret",
  },
  full_lavan: {
    label: "Full Casa Lavan", destino: "full_lavan",
    stock: (p) => p.stock_full_lavan_hoy,
    velDiaria: "vel_diaria_full_lavan", velSemanal: "vel_semanal_full_lavan",
    vendido: "vendido_full_lavan", diasQuiebre: "dias_quiebre_full_lavan",
    fechaQuiebre: "fecha_quiebre_full_lavan", alerta: "alerta_full_lavan", aReponer: "a_reponer_full_lavan",
  },
};

let PRODUCTOS = [];
const EXPANDIDAS = new Set();
const SELECTED = new Set();

// Proveedores conocidos que deben aparecer como opción aunque todavía no
// tengan ningún SKU asignado (ej. un proveedor nuevo del que se va a cargar
// stock por primera vez).
const PROVEEDORES_CONOCIDOS = ["Guiwi"];

function listaProveedores() {
  return Array.from(new Set([...PRODUCTOS.map((p) => p.proveedor), ...PROVEEDORES_CONOCIDOS])).sort();
}

function alertaClass(alerta) {
  if (!alerta) return "";
  if (alerta.includes("SIN STOCK")) return "background:var(--nostock)";
  if (alerta.includes("CRÍTICO")) return "background:var(--critico)";
  if (alerta.includes("BAJO")) return "background:var(--bajo)";
  if (alerta.includes("OK")) return "background:var(--ok)";
  return "background:#333";
}

function velSemanalTotal(p) {
  // Vistazo rápido sin expandir: suma la velocidad semanal de los 3 destinos
  // (depósito + Full Pret + Full Lavan) en un solo número por fila.
  return Object.values(DESTINOS).reduce((s, d) => s + (p[d.velSemanal] || 0), 0);
}

function peorAlerta(p) {
  // Para el badge compacto de la fila: el peor estado entre los 3 destinos
  // (sin stock > crítico > bajo > ok > sin datos), solo entre destinos con
  // alguna sugerencia de reposición real (a_reponer > 0) para no alarmar
  // por Full Casa Lavan cuando esa marca directamente no usa Full.
  const prioridad = (a) => {
    if (!a) return -1;
    if (a.includes("SIN STOCK")) return 4;
    if (a.includes("CRÍTICO")) return 3;
    if (a.includes("BAJO")) return 2;
    if (a.includes("OK")) return 1;
    return 0;
  };
  let mejor = null, mejorPrio = -1;
  for (const key of Object.keys(DESTINOS)) {
    const d = DESTINOS[key];
    const alerta = p[d.alerta];
    const prio = prioridad(alerta);
    if (prio > mejorPrio) { mejorPrio = prio; mejor = alerta; }
  }
  return mejor;
}

function necesitaReposicionDestino(p, d) {
  // Mismo criterio que generar_reporte.py: quebrado con ventas históricas,
  // o quiebre <=10 días con velocidad>0 (ver generar_reporte.py:1498-1500).
  const stock = d.stock(p);
  const diasQuiebre = p[d.diasQuiebre];
  const velDiaria = p[d.velDiaria] || 0;
  const aReponer = p[d.aReponer] || 0;
  const quebradoConVentas = stock === 0 && (aReponer || velDiaria > 0);
  const porQuebrar = diasQuiebre !== null && diasQuiebre !== undefined && diasQuiebre <= 10 && velDiaria > 0;
  return (quebradoConVentas || porQuebrar) && aReponer > 0;
}

function necesitaReposicion(p) {
  return Object.values(DESTINOS).some((d) => necesitaReposicionDestino(p, d));
}

function renderProveedores() {
  const sel = document.getElementById("filtroProveedor");
  const actuales = new Set(Array.from(sel.options).map((o) => o.value));
  const proveedores = listaProveedores();
  for (const p of proveedores) {
    if (!actuales.has(p)) {
      const opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    }
  }
}

const ORDENADORES = {
  sugerido: (a, b) => {
    const maxA = Math.max(a.a_reponer_deposito || 0, a.a_reponer_full_pret || 0, a.a_reponer_full_lavan || 0);
    const maxB = Math.max(b.a_reponer_deposito || 0, b.a_reponer_full_pret || 0, b.a_reponer_full_lavan || 0);
    return maxB - maxA;
  },
  ganancia: (a, b) => (b.ganancia_60d || 0) - (a.ganancia_60d || 0),
  revenue: (a, b) => (b.revenue_60d || 0) - (a.revenue_60d || 0),
};

function renderCategorias() {
  const sel = document.getElementById("filtroCategoria");
  const actuales = new Set(Array.from(sel.options).map((o) => o.value));
  const categorias = Array.from(new Set(PRODUCTOS.map((p) => p.categoria || "Bazar"))).sort();
  for (const c of categorias) {
    if (!actuales.has(c)) {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    }
  }
}

function filasVisibles() {
  const vista = document.getElementById("filtroVista").value;
  const proveedor = document.getElementById("filtroProveedor").value;
  const categoria = document.getElementById("filtroCategoria").value;
  const ordenarPor = document.getElementById("ordenarPor").value;
  const ocultarSolicitados = document.getElementById("ocultarSolicitados").checked;
  const busqueda = document.getElementById("buscador").value.trim().toLowerCase();

  let rows = PRODUCTOS;
  if (vista === "necesita") rows = rows.filter(necesitaReposicion);
  if (proveedor) rows = rows.filter((p) => p.proveedor === proveedor);
  if (categoria) rows = rows.filter((p) => (p.categoria || "Bazar") === categoria);
  if (ocultarSolicitados) {
    rows = rows.filter((p) => (p.destinos_ya_solicitados || []).length === 0);
  }
  if (busqueda) {
    rows = rows.filter((p) =>
      p.sku.toLowerCase().includes(busqueda) || (p.nombre || "").toLowerCase().includes(busqueda)
    );
  }
  return rows.sort(ORDENADORES[ordenarPor] || ORDENADORES.sugerido);
}

function renderDestinoCard(p, key) {
  const d = DESTINOS[key];
  const yaSolicitado = (p.destinos_ya_solicitados || []).includes(d.destino);
  const sugerido = p[d.aReponer] || 0;
  const card = document.createElement("div");
  card.className = "destino-card";
  card.innerHTML = `
    <h4>${d.label}</h4>
    <div class="fila-mini"><span>Stock hoy</span><span>${fmtNum(d.stock(p))}</span></div>
    <div class="fila-mini"><span>Vendido 60d</span><span>${fmtNum(p[d.vendido])}</span></div>
    <div class="fila-mini"><span>Vel. diaria/sem.</span><span>${fmtNum(p[d.velDiaria])} / ${fmtNum(p[d.velSemanal])}</span></div>
    <div class="fila-mini"><span>Días quiebre</span><span>${fmtNum(p[d.diasQuiebre])}</span></div>
    <div class="fila-mini"><span>Fecha quiebre</span><span>${fmtDate(p[d.fechaQuiebre])}</span></div>
    <div class="fila-mini"><span>Alerta</span><span><span class="badge" style="${alertaClass(p[d.alerta])}">${p[d.alerta] || "—"}</span></span></div>
    ${yaSolicitado ? '<div class="fila-mini solicitado">✓ Ya solicitado en este destino</div>' : ""}
    <div class="agregar">
      <input type="number" min="0" value="${sugerido}" class="qty-input" data-destino="${d.destino}">
      <button class="secondary btn-agregar" data-destino="${d.destino}">🛒 Agregar</button>
    </div>
  `;
  card.querySelector(".btn-agregar").addEventListener("click", () => {
    const qty = Number(card.querySelector(".qty-input").value);
    if (!qty || qty <= 0) return;
    addLineaCarrito({
      sku: p.sku, nombre: p.nombre, proveedor: p.proveedor,
      destino: d.destino, cantidad: qty, cantidad_sugerida: sugerido,
      stock_hoy: d.stock(p) ?? 0,
    });
    actualizarBarraCarrito();
    const btn = card.querySelector(".btn-agregar");
    btn.textContent = "✓ Agregado";
    setTimeout(() => { btn.textContent = "🛒 Agregar"; }, 1200);
  });
  return card;
}

function renderDetalle(p) {
  const canal = { "ML Pret": p.unid_ml_pret, "ML Lavan": p.unid_ml_lavan, "TN Pret": p.unid_tn_pret, "TN Lavan": p.unid_tn_lavan };
  const tr = document.createElement("tr");
  tr.className = "fila-detalle";
  const td = document.createElement("td");
  td.colSpan = 10;

  const destinos = document.createElement("div");
  destinos.className = "destinos";
  for (const key of Object.keys(DESTINOS)) destinos.appendChild(renderDestinoCard(p, key));

  const resto = document.createElement("div");
  resto.className = "detalle-grid";
  resto.innerHTML = `
    <div class="detalle-item"><div class="label">Confianza métrica</div><div class="valor">${p.confianza || "—"}</div></div>
    <div class="detalle-item"><div class="label">Sobrestock</div><div class="valor">${p.sobrestock_categoria || "—"}</div></div>
    <div class="detalle-item"><div class="label">Categoría</div><div class="valor">${p.categoria || "—"}</div></div>
    <div class="detalle-item"><div class="label">Canal dominante</div><div class="valor">${p.canal_dominante || "—"}</div></div>
    <div class="detalle-item"><div class="label">Revenue 60d</div><div class="valor">$${fmtNum(p.revenue_60d)}</div></div>
    <div class="detalle-item"><div class="label">Ganancia 60d</div><div class="valor">$${fmtNum(p.ganancia_60d)}</div></div>
    ${Object.entries(canal).map(([k, v]) => `<div class="detalle-item"><div class="label">${k}</div><div class="valor">${fmtNum(v)} uds</div></div>`).join("")}
  `;

  const acciones = document.createElement("div");
  acciones.className = "detalle-acciones";
  const btnDescontinuar = document.createElement("button");
  btnDescontinuar.className = "secondary";
  btnDescontinuar.textContent = "Descontinuar";
  btnDescontinuar.addEventListener("click", async () => {
    if (!confirm(`¿Marcar ${p.sku} como descontinuado? Deja de aparecer en las sugerencias de reposición.`)) return;
    await apiFetch(`/productos/${encodeURIComponent(p.sku)}/descontinuar`, {
      method: "POST", body: JSON.stringify({ descontinuado: true, por: getUser() }),
    });
    cargar();
  });
  acciones.appendChild(btnDescontinuar);

  td.appendChild(destinos);
  td.appendChild(resto);
  td.appendChild(acciones);
  tr.appendChild(td);
  return tr;
}

function render() {
  const rows = filasVisibles();
  document.getElementById("contador").textContent = `${rows.length} productos`;
  const tbody = document.getElementById("filas");
  tbody.innerHTML = "";

  const chkTodos = document.getElementById("chkTodos");
  chkTodos.checked = rows.length > 0 && rows.every((p) => SELECTED.has(p.sku));
  chkTodos.onclick = (e) => e.stopPropagation();
  chkTodos.onchange = () => {
    if (chkTodos.checked) rows.forEach((p) => SELECTED.add(p.sku));
    else rows.forEach((p) => SELECTED.delete(p.sku));
    render();
    actualizarBotonesMasivos();
  };

  for (const p of rows) {
    const tr = document.createElement("tr");
    tr.className = "fila-producto";
    const abierta = EXPANDIDAS.has(p.sku);
    const alertaResumen = peorAlerta(p);
    tr.innerHTML = `
      <td><input type="checkbox" class="chk-fila" ${SELECTED.has(p.sku) ? "checked" : ""}></td>
      <td><span class="flecha ${abierta ? "abierta" : ""}">▸</span></td>
      <td>${p.sku}</td>
      <td>${p.nombre || "<span class=muted>(sin nombre)</span>"}</td>
      <td></td>
      <td>${fmtNum(DESTINOS.deposito.stock(p))}</td>
      <td>${fmtNum(DESTINOS.full_pret.stock(p))}</td>
      <td>${fmtNum(DESTINOS.full_lavan.stock(p))}</td>
      <td>${fmtNum(velSemanalTotal(p))}</td>
      <td><span class="badge" style="${alertaClass(alertaResumen)}">${alertaResumen || "—"}</span></td>
    `;

    const chkFila = tr.querySelector(".chk-fila");
    chkFila.addEventListener("click", (e) => e.stopPropagation());
    chkFila.addEventListener("change", () => {
      if (chkFila.checked) SELECTED.add(p.sku); else SELECTED.delete(p.sku);
      chkTodos.checked = rows.length > 0 && rows.every((x) => SELECTED.has(x.sku));
      actualizarBotonesMasivos();
    });

    const tdProveedor = tr.children[4];
    const select = document.createElement("select");
    select.className = "proveedor-select";
    for (const prov of listaProveedores()) {
      const opt = document.createElement("option");
      opt.value = prov; opt.textContent = prov;
      if (prov === p.proveedor) opt.selected = true;
      select.appendChild(opt);
    }
    const otro = document.createElement("option");
    otro.value = "__otro__"; otro.textContent = "Otro…";
    select.appendChild(otro);

    const guardarProveedor = async (valor) => {
      await apiFetch(`/productos/${encodeURIComponent(p.sku)}/proveedor`, {
        method: "POST", body: JSON.stringify({ proveedor: valor }),
      });
      p.proveedor_manual = valor; p.proveedor = valor;
      renderProveedores();
      render();
    };

    const inputOtro = document.createElement("input");
    inputOtro.type = "text";
    inputOtro.placeholder = "Nombre del proveedor…";
    inputOtro.style.display = "none";
    inputOtro.style.marginLeft = "4px";
    inputOtro.addEventListener("click", (e) => e.stopPropagation());
    inputOtro.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && inputOtro.value.trim()) guardarProveedor(inputOtro.value.trim());
    });
    inputOtro.addEventListener("blur", () => {
      if (inputOtro.value.trim()) guardarProveedor(inputOtro.value.trim());
    });
    select.addEventListener("click", (e) => e.stopPropagation());
    select.addEventListener("change", async () => {
      if (select.value === "__otro__") {
        inputOtro.style.display = "inline-block";
        inputOtro.focus();
        return;
      }
      await guardarProveedor(select.value);
    });
    tdProveedor.appendChild(select);
    tdProveedor.appendChild(inputOtro);

    tr.addEventListener("click", () => {
      if (EXPANDIDAS.has(p.sku)) EXPANDIDAS.delete(p.sku); else EXPANDIDAS.add(p.sku);
      render();
    });

    tbody.appendChild(tr);
    if (abierta) tbody.appendChild(renderDetalle(p));
  }
}

async function cargar() {
  document.getElementById("status").textContent = "Cargando…";
  document.getElementById("tabla").style.display = "none";
  try {
    const vista = document.getElementById("filtroVista").value;
    const qs = vista === "descontinuados" ? "?descontinuados=true" : "";
    PRODUCTOS = await apiFetch(`/productos${qs}`);
    renderProveedores();
    renderProveedorMasivoSelect();
    renderCategorias();
    render();
    actualizarBarraCarrito();
    actualizarBotonesMasivos();
    document.getElementById("status").style.display = "none";
    document.getElementById("tabla").style.display = "table";
  } catch (e) {
    document.getElementById("status").textContent = `Error: ${e.message}`;
  }
}

function renderProveedorMasivoSelect() {
  const sel = document.getElementById("selectProveedorMasivo");
  const valorActual = sel.value;
  sel.innerHTML = '<option value="">Asignar proveedor…</option>';
  for (const prov of listaProveedores()) {
    const opt = document.createElement("option");
    opt.value = prov; opt.textContent = prov;
    sel.appendChild(opt);
  }
  const otro = document.createElement("option");
  otro.value = "__otro__"; otro.textContent = "Otro…";
  sel.appendChild(otro);
  sel.value = valorActual || "";
}

function actualizarBotonesMasivos() {
  const n = SELECTED.size;
  const btnPedido = document.getElementById("btnArmarPedido");
  const btnDescontinuar = document.getElementById("btnDescontinuarMasivo");
  const selectProveedor = document.getElementById("selectProveedorMasivo");
  const btnAsignarProveedor = document.getElementById("btnAsignarProveedorMasivo");
  btnPedido.textContent = `🧾 Armar pedido (${n})`;
  btnDescontinuar.textContent = `🚫 Descontinuar (${n})`;
  btnAsignarProveedor.textContent = `👤 Asignar (${n})`;
  btnPedido.disabled = n === 0;
  btnDescontinuar.disabled = n === 0;
  selectProveedor.disabled = n === 0;
  btnAsignarProveedor.disabled = n === 0;
}

function actualizarBarraCarrito() {
  const carrito = getCarrito();
  const bar = document.getElementById("carritoBar");
  if (!carrito.length) { bar.classList.remove("visible"); return; }
  bar.classList.add("visible");
  const totalUnidades = carrito.reduce((s, l) => s + l.cantidad, 0);
  document.getElementById("carritoTexto").textContent = `🛒 ${carrito.length} líneas · ${totalUnidades} unidades`;
}

document.getElementById("filtroVista").addEventListener("change", cargar);
document.getElementById("filtroProveedor").addEventListener("change", render);
document.getElementById("filtroCategoria").addEventListener("change", render);
document.getElementById("ordenarPor").addEventListener("change", render);
document.getElementById("ocultarSolicitados").addEventListener("change", render);
document.getElementById("buscador").addEventListener("input", render);
document.getElementById("btnRefrescar").addEventListener("click", cargar);
document.getElementById("btnVerCarrito").addEventListener("click", () => { window.location.href = "pedido.html"; });
document.getElementById("btnLimpiarFiltros").addEventListener("click", () => {
  document.getElementById("buscador").value = "";
  document.getElementById("filtroProveedor").value = "";
  document.getElementById("filtroCategoria").value = "";
  document.getElementById("ordenarPor").value = "sugerido";
  const vistaCambio = document.getElementById("filtroVista").value !== "necesita";
  document.getElementById("filtroVista").value = "necesita";
  // "Descontinuados" trae un dataset distinto del servidor (no es un filtro
  // client-side) — si veníamos de ahí hace falta recargar, no solo re-renderizar.
  vistaCambio ? cargar() : render();
});

// Selección masiva (checkbox por fila + "tildar todos los filtrados", ver
// render()/SELECTED más arriba) — segundo punto de entrada a estas dos
// acciones, además de los botones dentro del panel expandido por fila.
document.getElementById("btnArmarPedido").addEventListener("click", () => {
  const seleccionados = PRODUCTOS.filter((p) => SELECTED.has(p.sku));
  for (const p of seleccionados) {
    for (const key of Object.keys(DESTINOS)) {
      const d = DESTINOS[key];
      const sugerido = p[d.aReponer] || 0;
      if (sugerido > 0) {
        addLineaCarrito({
          sku: p.sku, nombre: p.nombre, proveedor: p.proveedor,
          destino: d.destino, cantidad: sugerido, cantidad_sugerida: sugerido,
          stock_hoy: d.stock(p) ?? 0,
        });
      }
    }
  }
  window.location.href = "pedido.html";
});
document.getElementById("btnDescontinuarMasivo").addEventListener("click", async () => {
  const skus = Array.from(SELECTED);
  if (!skus.length) return;
  if (!confirm(`¿Marcar ${skus.length} producto(s) como descontinuado(s)? Dejan de aparecer en las sugerencias de reposición.`)) return;
  await Promise.all(skus.map((sku) =>
    apiFetch(`/productos/${encodeURIComponent(sku)}/descontinuar`, {
      method: "POST", body: JSON.stringify({ descontinuado: true, por: getUser() }),
    })
  ));
  SELECTED.clear();
  cargar();
});

document.getElementById("selectProveedorMasivo").addEventListener("change", () => {
  const esOtro = document.getElementById("selectProveedorMasivo").value === "__otro__";
  document.getElementById("inputProveedorMasivoOtro").style.display = esOtro ? "inline-block" : "none";
  if (esOtro) document.getElementById("inputProveedorMasivoOtro").focus();
});
document.getElementById("btnAsignarProveedorMasivo").addEventListener("click", async () => {
  const select = document.getElementById("selectProveedorMasivo");
  const inputOtro = document.getElementById("inputProveedorMasivoOtro");
  const valor = select.value === "__otro__" ? inputOtro.value.trim() : select.value;
  const skus = Array.from(SELECTED);
  if (!valor || !skus.length) return;
  if (!confirm(`¿Asignar el proveedor "${valor}" a ${skus.length} producto(s)?`)) return;
  await Promise.all(skus.map((sku) =>
    apiFetch(`/productos/${encodeURIComponent(sku)}/proveedor`, {
      method: "POST", body: JSON.stringify({ proveedor: valor }),
    })
  ));
  select.value = "";
  inputOtro.value = "";
  inputOtro.style.display = "none";
  SELECTED.clear();
  cargar();
});

cargar();
</script>
</body>
</html>
