<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<title>Armado de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Pantalla para el celular de quien arma: escanear la etiqueta y confirmar producto por producto.
     Siempre clara (se usa en el depósito, con luz), con texto grande. */
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #17201b; --soft: #6b766f; --line: #e1e5df;
    --ok: #1d9a5b; --ok-soft: #dcf3e6; --no: #d8443b; --no-soft: #fbe3e1;
    --warn: #f2b632; --warn-soft: #fff3d2; --cam: #0f1512;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .vista { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

  /* Barra superior */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 10px; }
  .bar b { font-family: var(--display); font-size: 24px; font-weight: 800; }
  .bar small { color: var(--soft); font-size: 13px; text-align: right; line-height: 1.2; }
  .link { background: none; border: none; padding: 6px 0; color: var(--soft); font-size: 14px; text-decoration: underline; }

  /* Escanear */
  #vScan { background: var(--cam); color: #fff; }
  #vScan .bar small, #vScan .link { color: #c8d0cb; }
  .cam { position: relative; flex: 1; overflow: hidden; display: grid; place-items: center; }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mira { position: relative; width: min(68vw, 300px); aspect-ratio: 1; border: 4px solid var(--ok); border-radius: 18px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
  .cam-tip { position: absolute; top: 16px; left: 16px; right: 16px; text-align: center; font-weight: 600; font-size: 17px; text-shadow: 0 1px 3px #000; }
  .cam-msg { position: absolute; bottom: 16px; left: 16px; right: 16px; text-align: center; background: rgba(0,0,0,.7);
    border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .cam-msg.error { background: var(--no); }
  .manual { padding: 12px 16px 16px; display: grid; gap: 10px; }
  .manual form { display: flex; gap: 8px; }
  .manual input { flex: 1; min-width: 0; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 2px solid #3a443e;
    background: #1b231f; color: #fff; }
  .manual input::placeholder { color: #8d9891; font-size: 16px; }
  .manual .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { background: #2a332e; border: none; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: #fff; }

  /* Botones grandes */
  .cta { border: none; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 17px; background: var(--ink); color: #fff; width: 100%; }
  .cta.ok { background: var(--ok); }
  .cta.no { background: var(--no); }
  .cta.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .cta:disabled { opacity: .5; }
  .cta.chico { width: auto; padding: 12px 18px; font-size: 16px; }

  /* Avisos */
  .avisos { display: grid; gap: 8px; padding: 0 16px; }
  .aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .aviso.rojo { background: var(--no); color: #fff; }
  .aviso.amarillo { background: var(--warn-soft); border: 2px solid var(--warn); }
  .aviso::before { content: "!"; flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 14px; background: #fff; color: var(--no); }
  .aviso.amarillo::before { background: var(--warn); color: var(--ink); }

  /* Resumen inicial / elegir pedido */
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 16px; display: flex; flex-direction: column; gap: 14px; }
  .cabecera { padding: 0 16px; display: grid; gap: 4px; }
  .cabecera h1 { margin: 0; font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 800; }
  .cabecera p { margin: 0; color: var(--soft); font-size: 16px; }
  .tienda { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 6px; background: var(--ink); color: #fff; justify-self: start; }
  .tienda.lavan { background: #6b4e8e; }
  .lista { display: grid; gap: 8px; padding: 0 16px; }
  .fila { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; background: var(--card);
    border-radius: 14px; padding: 8px 10px; border: 2px solid transparent; text-align: left; width: 100%; }
  button.fila { border-color: var(--line); }
  .fila img, .fila .sinfoto { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--line); }
  .fila .t { font-size: 15px; line-height: 1.2; font-weight: 600; min-width: 0; }
  .fila .t small { display: block; color: var(--soft); font-weight: 500; font-size: 14px; }
  .fila .t small.why { color: var(--no); font-weight: 600; }
  .fila .q { font-family: var(--display); font-weight: 800; font-size: 24px; }
  .mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; }
  .mark.ok { background: var(--ok); }
  .mark.no { background: var(--no); }
  .pie { padding: 12px 16px 16px; display: grid; gap: 10px; flex: none; }

  /* Tarjetas */
  .dots { display: flex; gap: 5px; padding: 0 16px 10px; }
  .dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .dots i.ok { background: var(--ok); }
  .dots i.no { background: var(--no); }
  .dots i.busca { background: var(--warn); }
  .dots i.now { background: var(--ink); }
  #parecido { margin: 0 16px 8px; }
  .deck { position: relative; flex: 1; margin: 0 16px; min-height: 0; }
  .card { position: absolute; inset: 0; background: var(--card); border-radius: 22px; box-shadow: 0 10px 28px -16px rgba(0,0,0,.45);
    overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; }
  .card.volando { transition: transform .25s ease-out, opacity .25s ease-out; }
  .photo { position: relative; flex: 1; min-height: 0; background: #eceeea; }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .qty { position: absolute; right: 12px; top: 12px; background: var(--ink); color: #fff; border-radius: 16px; padding: 6px 14px 8px; text-align: center; line-height: 1; }
  .qty span { display: block; font-size: 12px; letter-spacing: .1em; font-weight: 700; margin-bottom: 2px; }
  .qty strong { font-family: var(--display); font-size: 52px; font-weight: 800; }
  .info { padding: 12px 16px 16px; display: grid; gap: 8px; flex: none; }
  .nombre { font-weight: 600; font-size: 17px; line-height: 1.2; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase;
    background: var(--bg); border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 10px 6px; }
  .sku { font-size: 13px; color: var(--soft); letter-spacing: .03em; word-break: break-all; }
  .stamp { position: absolute; top: 28px; font-family: var(--display); font-weight: 800; font-size: 34px; padding: 2px 12px; border: 4px solid;
    border-radius: 10px; background: rgba(255,255,255,.9); z-index: 2; opacity: 0; pointer-events: none; }
  .stamp.ok { left: 18px; color: var(--ok); transform: rotate(-14deg); }
  .stamp.no { right: 18px; color: var(--no); transform: rotate(12deg); }
  .acciones { display: flex; justify-content: center; gap: 40px; padding: 14px 0 6px; flex: none; }
  .btn { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 3px solid;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.4); font-size: 32px; font-weight: 800; }
  .btn.no { border-color: var(--no); color: var(--no); }
  .btn.ok { border-color: var(--ok); color: var(--ok); }
  .hint { text-align: center; font-size: 13px; color: var(--soft); padding-bottom: 12px; flex: none; }

  /* Hoja de motivos */
  .velo { position: fixed; inset: 0; background: rgba(15,21,18,.5); z-index: 20; display: flex; align-items: flex-end; }
  .hoja { width: 100%; background: var(--card); border-radius: 22px 22px 0 0; padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
  .hoja h3 { margin: 4px 0; font-family: var(--display); font-size: 26px; font-weight: 800; }
  .opt { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 15px 14px; font-weight: 700; font-size: 17px;
    display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .opt small { color: var(--soft); font-weight: 500; font-size: 14px; }
  .opt.rojo { border-color: var(--no); color: var(--no); }

  /* Resultado */
  .veredicto { margin: 0 16px; border-radius: 18px; padding: 16px; display: grid; gap: 4px; color: #fff; }
  .veredicto.no { background: var(--no); }
  .veredicto.ok { background: var(--ok); text-align: center; }
  .veredicto b { font-family: var(--display); font-size: 32px; line-height: 1; font-weight: 800; }
  .veredicto span { font-size: 15px; }
  .cargando { padding: 40px 16px; text-align: center; color: var(--soft); }
  .vacio { padding: 24px 16px; color: var(--soft); text-align: center; }
  .quien { padding: 0 16px; display: grid; gap: 12px; }
  .quien input { font: inherit; font-size: 22px; padding: 14px; border-radius: 12px; border: 2px solid var(--line); }
  .tareas { flex: 1; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .tareas h1 { margin: 0 0 6px; font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 800; }
  .tarea { display: grid; gap: 4px; text-align: left; background: var(--card); border: 2.5px solid var(--ink); border-radius: 18px; padding: 22px 18px; }
  .tarea b { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; }
  .tarea span { color: var(--soft); font-size: 16px; }
  .tarea.principal { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tarea.principal span { color: #e6f6ed; }
  /* ── Búsqueda ── */
  #bBody { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  /* El logo del tablero es blanco; sobre fondo claro se invierte a negro */
  .logo { height: 22px; width: auto; max-width: 60%; display: block; filter: invert(1); }
  .logo.grande { height: 38px; max-width: 100%; margin-bottom: 20px; }
  #bBody > * { flex-shrink: 0; }
  #bBody.centro { justify-content: center; }
  .grupo { display: grid; gap: 6px; }
  .grupo > span, .rotulo { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 700; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { border: 2.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 8px; font-weight: 700; font-size: 16px; }
  .seg button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .seg button small { display: block; font-weight: 500; font-size: 13px; color: var(--soft); }
  .seg button.on small { color: #c8d0cb; }
  .caja { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 2px; }
  .caja b { font-family: var(--display); font-size: 34px; line-height: 1; }
  .caja span { font-size: 14px; color: var(--soft); }
  .cat { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: center; background: var(--card); border-radius: 14px;
    padding: 12px 14px; border: none; text-align: left; width: 100%; }
  .cat b { font-weight: 700; font-size: 16px; }
  .cat .u { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; }
  .cat small { color: var(--soft); font-size: 13px; }
  .cat small.no { color: var(--no); font-weight: 700; }
  .cat small.ok { color: var(--ok); font-weight: 700; }
  .cat small .quien { color: var(--ink); font-weight: 700; }
  .cat.hecha { background: var(--ok-soft); }
  .barra { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
  .barra i { display: block; height: 100%; }
  .barra i.ok { background: var(--ok); }
  .barra i.no { background: var(--no); }
  .marca-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 800; color: var(--soft); padding: 6px 2px 0; }
  .marca-h em { font-style: normal; font-family: var(--display); font-size: 20px; letter-spacing: 0; color: var(--ink); }
  .slot { position: relative; border-radius: 14px; overflow: hidden; }
  .slot .fondo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff; background: var(--ok); }
  .slot .fondo.izq { background: var(--no); }
  .prod { position: relative; display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; background: var(--card);
    padding: 7px 10px 7px 7px; border-radius: 14px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .prod.vuelve { transition: transform .2s ease-out; }
  .prod img, .prod .sinfoto { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--line); pointer-events: none; }
  .prod .t { min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .prod .t small { display: block; color: var(--soft); font-weight: 500; font-size: 12.5px; }
  .prod .t small.no { color: var(--no); font-weight: 700; }
  .prod .t small.ok { color: var(--ok); font-weight: 700; }
  .prod .t small.extra { color: #8a5a00; font-weight: 700; }
  .prod .var { display: block; font-family: var(--display); font-weight: 800; font-size: 19px; text-transform: uppercase; color: var(--ink); }
  .prod .q { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-align: right; }
  .prod .q small { display: block; font-family: var(--body); font-size: 11.5px; font-weight: 600; color: var(--soft); }
  .prod.ok { background: var(--ok-soft); }
  .prod.no { background: var(--no-soft); }
  .prod .mk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; }
  .prod .mk.ok { background: var(--ok); }
  .prod .mk.no { background: var(--no); }
  .foto-g { position: relative; height: 38vh; min-height: 180px; border-radius: 18px; overflow: hidden; background: #eceeea; flex: none; }
  .foto-g img { width: 100%; height: 100%; object-fit: contain; }
  .ped { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--card); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
  .ped .tag { font-size: 11.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; background: var(--ink); color: #fff; }
  .ped .tag.ml { background: #f3d23a; color: var(--ink); }
  .ped b { font-family: var(--display); font-size: 24px; }
  .ped small { display: block; color: var(--soft); font-size: 12.5px; }
  .marcado { font-size: 14px; color: var(--soft); text-align: center; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; }
  .stepper button { height: 64px; border-radius: 16px; border: 2.5px solid var(--line); background: var(--card); font-size: 32px; font-weight: 800; }
  .stepper strong { text-align: center; font-family: var(--display); font-size: 56px; font-weight: 800; line-height: 1; }
  .stepper strong small { font-size: 24px; color: var(--soft); }
  .actualizado { font-size: 13px; color: var(--soft); text-align: center; }
  .falta-item { background: var(--card); border-radius: 14px; padding: 10px 12px; display: grid; gap: 3px; font-size: 14px; }
  .falta-item .var { font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; }
  .falta-item small { color: var(--soft); font-size: 12.5px; }
  .falta-item small.no { color: var(--no); font-weight: 700; font-size: 13.5px; }
  @media (prefers-reduced-motion: reduce) { .card.volando { transition: none; } }
</style>
</head>
<body>

<!-- 1. Escanear -->
<section class="vista" id="vScan">
  <div class="bar"><button class="link" id="btnTarea" type="button" style="color:#fff;text-decoration:none"><b>‹ Empaquetado</b></button><button class="link" id="btnQuien" type="button"></button></div>
  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="cam-tip">Apuntá al QR de la etiqueta</div>
    <div class="mira"></div>
    <div class="cam-msg" id="camMsg" hidden></div>
  </div>
  <div class="manual">
    <form id="formManual" autocomplete="off">
      <input id="inpNumero" inputmode="numeric" placeholder="O escribí el número de venta" aria-label="Número de venta">
      <button class="cta ok chico" type="submit">Buscar</button>
    </form>
    <div class="row">
      <button class="pill" id="btnFaltantes" type="button">Pedidos con faltante</button>
      <button class="link" id="btnCamara" type="button" hidden>Reintentar cámara</button>
    </div>
  </div>
</section>

<!-- Qué vas a hacer hoy -->
<section class="vista" id="vInicio" hidden>
  <div class="bar"><img class="logo" src="assets/logo-white.png" alt="Pret a Home"><button class="link" id="btnQuien2" type="button"></button></div>
  <div class="tareas">
    <h1>¿Qué vas a hacer hoy?</h1>
    <button class="tarea" type="button" id="btnBusqueda"><b>Búsqueda</b><span>Juntar los productos de los pedidos</span></button>
    <button class="tarea principal" type="button" id="btnEmpaquetado"><b>Empaquetado</b><span>Escanear la etiqueta y controlar cada paquete</span></button>
  </div>
</section>

<!-- Ingreso: nombre + contraseña del depósito -->
<section class="vista" id="vQuien" hidden>
  <form class="quien" id="formQuien" style="flex:1;align-content:center">
    <img class="logo grande" src="assets/logo-white.png" alt="Pret a Home">
    <h1 style="margin:0;font-family:var(--display);font-size:40px;line-height:1">Depósito</h1>
    <p style="margin:0;color:var(--soft)">Tu nombre queda guardado en cada pedido que revisás o buscás.</p>
    <input id="inpQuien" autocomplete="given-name" placeholder="Tu nombre" aria-label="Tu nombre">
    <input id="inpClave" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
    <div class="aviso rojo" id="loginError" hidden></div>
    <button class="cta" type="submit" id="btnEntrar">Entrar</button>
  </form>
</section>

<!-- Buscando / elegir / resumen inicial / resultado / faltantes: se dibujan en esta vista -->
<section class="vista" id="vPanel" hidden></section>

<!-- Tarjetas -->
<section class="vista" id="vCartas" hidden>
  <div class="bar"><b id="cTitulo"></b><small id="cPaso"></small></div>
  <div class="dots" id="cDots"></div>
  <div class="aviso amarillo" id="parecido" hidden></div>
  <div class="deck" id="deck"></div>
  <div class="acciones">
    <button class="btn no" id="btnNo" type="button" aria-label="No lo tengo">✕</button>
    <button class="btn ok" id="btnOk" type="button" aria-label="Lo tengo">✓</button>
  </div>
  <div class="hint">← No lo tengo · Lo tengo →</div>
</section>

<!-- Búsqueda de productos -->
<section class="vista" id="vBusq" hidden>
  <div class="bar"><button class="link" id="bAtras" type="button" style="color:var(--ink);text-decoration:none"><b id="bTitulo">‹ Búsqueda</b></button><small id="bSub"></small></div>
  <div id="bBody"></div>
  <div class="pie" id="bPie"></div>
</section>

<div class="velo" id="veloB" hidden>
  <div class="hoja" id="hojaB"></div>
</div>

<div class="velo" id="velo" hidden>
  <div class="hoja">
    <h3>¿Qué pasó con este producto?</h3>
    <button class="opt rojo" type="button" data-motivo="no_hay">No hay en el depósito</button>
    <button class="opt" type="button" data-motivo="buscando">Sigo buscando <small>Vuelve al final</small></button>
    <button class="opt" type="button" data-motivo="volver">Me equivoqué <small>Volver</small></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
// ─── API ────────────────────────────────────────────────────────────────────
// Login propio del depósito (nombre + contraseña del depósito, distinta de la del tablero).
// Queda guardado en el celular hasta tocar "Salir". La función es armado-api (al lado de reposicion-api).
const ARMADO_API = new URLSearchParams(location.search).get("api")
  || window.REPOSICION_API_URL.replace("reposicion-api", "armado-api");

const QUIEN_KEY = "armado_quien", CLAVE_KEY = "armado_clave";
let quien = "", clave = "";
try { quien = localStorage.getItem(QUIEN_KEY) || ""; clave = localStorage.getItem(CLAVE_KEY) || ""; } catch {}

async function armadoFetch(path, body) {
  const r = await fetch(ARMADO_API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-App-Password": clave },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    salir("La contraseña cambió o no es correcta. Volvé a entrar.");
    throw new Error("401");
  }
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}

let pedido = null;        // el que se está armando
let codigoLeido = "";
let inicio = null;
let lineas = [];          // [{...item, estado: null|'ok'|'no_hay'|'buscando', confirmado_at}]
let cola = [];            // índices de líneas pendientes, en el orden en que se muestran

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function mostrar(id) {
  for (const v of ["vInicio", "vScan", "vQuien", "vPanel", "vCartas", "vBusq"]) $(v).hidden = v !== id;
  if (id === "vScan") iniciarCamara(); else detenerCamara();
  if (id !== "vBusq") detenerBusqueda();
}

function vibrar(ms) { try { navigator.vibrate?.(ms); } catch {} }
let audio;
function pitido(frec = 880, dur = 0.12) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = frec; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.15, audio.currentTime);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}

// Pantalla siempre encendida mientras se usa
async function pedirWakeLock() {
  try { await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pedirWakeLock(); });

// ─── Ingreso ────────────────────────────────────────────────────────────────
function pintarQuien() {
  const txt = quien ? `${quien} · Salir` : "";
  $("btnQuien").textContent = txt;
  $("btnQuien2").textContent = txt;
}

function salir(motivo = "") {
  clave = "";
  try { localStorage.removeItem(CLAVE_KEY); } catch {}
  $("inpQuien").value = quien;
  $("inpClave").value = "";
  $("loginError").hidden = !motivo;
  $("loginError").textContent = motivo;
  mostrar("vQuien");
  (quien ? $("inpClave") : $("inpQuien")).focus();
}
$("btnQuien").onclick = () => salir();
$("btnQuien2").onclick = () => salir();

$("formQuien").onsubmit = async (e) => {
  e.preventDefault();
  const nombre = $("inpQuien").value.trim();
  const pass = $("inpClave").value;
  if (!nombre || !pass) {
    $("loginError").hidden = false;
    $("loginError").textContent = !nombre ? "Escribí tu nombre." : "Escribí la contraseña.";
    return;
  }
  $("btnEntrar").disabled = true;
  try {
    const r = await fetch(ARMADO_API + "/ingresar", { headers: { "X-App-Password": pass } });
    if (r.status === 401) throw new Error("clave");
    if (!r.ok) throw new Error("red");
    quien = nombre; clave = pass;
    try { localStorage.setItem(QUIEN_KEY, quien); localStorage.setItem(CLAVE_KEY, clave); } catch {}
    $("loginError").hidden = true;
    pintarQuien();
    mostrar("vInicio");
  } catch (err) {
    $("loginError").hidden = false;
    $("loginError").textContent = err.message === "clave" ? "Contraseña incorrecta." : "No se pudo conectar. Revisá la conexión.";
  }
  $("btnEntrar").disabled = false;
};

// ─── Qué vas a hacer hoy ────────────────────────────────────────────────────
$("btnEmpaquetado").onclick = () => mostrar("vScan");
$("btnTarea").onclick = () => mostrar("vInicio");
$("btnBusqueda").onclick = () => abrirBusqueda();

// ─── Cámara y QR ────────────────────────────────────────────────────────────
let stream = null, loopId = null, detector = null, leyendo = false;
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

function mensajeCamara(txt, error = false) {
  $("camMsg").hidden = !txt;
  $("camMsg").textContent = txt || "";
  $("camMsg").classList.toggle("error", error);
}

async function iniciarCamara() {
  if (!navigator.mediaDevices?.getUserMedia) {
    mensajeCamara("Este navegador no permite usar la cámara. Escribí el número de venta.", true);
    return;
  }
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
    const v = $("video");
    v.srcObject = stream;
    await v.play();
    $("btnCamara").hidden = true;
    if ("BarcodeDetector" in window) {
      try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch { detector = null; }
    }
    leyendo = false;
    loopId = setInterval(leerCuadro, 180);
  } catch (err) {
    stream = null;
    $("btnCamara").hidden = false;
    mensajeCamara("No se pudo abrir la cámara. Dale permiso al navegador o escribí el número de venta.", true);
  }
}

function detenerCamara() {
  clearInterval(loopId); loopId = null;
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
}

async function leerCuadro() {
  const v = $("video");
  if (leyendo || !v.videoWidth) return;
  leyendo = true;
  try {
    let texto = null;
    if (detector) {
      const r = await detector.detect(v);
      texto = r[0]?.rawValue || null;
    } else if (window.jsQR) {
      // Se lee solo el centro de la imagen (donde está la mira), achicado para que sea rápido.
      const lado = Math.min(v.videoWidth, v.videoHeight) * 0.8;
      const escala = Math.min(1, 640 / lado);
      canvas.width = canvas.height = Math.round(lado * escala);
      ctx.drawImage(v, (v.videoWidth - lado) / 2, (v.videoHeight - lado) / 2, lado, lado, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      texto = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" })?.data || null;
    }
    if (texto) {
      pitido(); vibrar(60);
      await buscar(texto);
      return; // buscar() cambia de pantalla y apaga la cámara
    }
  } catch {}
  leyendo = false;
}

$("btnCamara").onclick = () => iniciarCamara();
$("formManual").onsubmit = (e) => {
  e.preventDefault();
  const v = $("inpNumero").value.trim();
  if (v) buscar(v);
};

// ─── Buscar el pedido ───────────────────────────────────────────────────────
function panel(html) { $("vPanel").innerHTML = html; mostrar("vPanel"); }

async function buscar(codigo) {
  codigoLeido = codigo;
  mensajeCamara("");
  panel(`<div class="bar"><b>Buscando…</b></div><div class="cargando">Buscando el pedido</div>`);
  try {
    const r = await armadoFetch("/buscar", { codigo });
    if (!r.pedidos.length) return noEncontrado(r.motivo || "No encontré el pedido.");
    if (r.pedidos.length === 1) return resumenInicial(r.pedidos[0]);
    elegirPedido(r.pedidos);
  } catch (err) {
    console.error(err);
    noEncontrado("No se pudo buscar el pedido. Revisá la conexión y probá de nuevo.");
  }
}

function noEncontrado(motivo) {
  pitido(220, 0.25); vibrar([80, 60, 80]);
  $("inpNumero").value = "";
  mostrar("vScan");
  mensajeCamara(motivo, true);
}

const nombreTienda = (t) => (t === "lavan" ? "Casa Laván" : "Pret a Home");
const unidades = (items) => items.reduce((s, i) => s + i.cantidad, 0);
const fotoHTML = (src) => src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<div class="sinfoto"></div>`;

function elegirPedido(pedidos) {
  panel(`
    <div class="bar"><b>¿Cuál es?</b><small>Hay ${pedidos.length} pedidos con ese número</small></div>
    <div class="scroll"><div class="lista">
      ${pedidos.map((p, i) => `
        <button class="fila" type="button" data-i="${i}">
          ${fotoHTML(p.items[0]?.imagen)}
          <div class="t">${nombreTienda(p.tienda)} · #${esc(p.pedido)}<small>${esc(p.envio_tipo || "")} · ${unidades(p.items)} unidades</small></div>
          <span class="q">›</span>
        </button>`).join("")}
    </div></div>
    <div class="pie"><button class="cta ghost" type="button" id="btnVolverScan">Volver a escanear</button></div>`);
  for (const b of $("vPanel").querySelectorAll("[data-i]")) b.onclick = () => resumenInicial(pedidos[+b.dataset.i]);
  $("btnVolverScan").onclick = () => mostrar("vScan");
}

function avisosHTML(avisos) {
  return avisos.length ? `<div class="avisos">${avisos.map((a) => `<div class="aviso ${a.nivel}">${esc(a.texto)}</div>`).join("")}</div>` : "";
}

function resumenInicial(p) {
  pedido = p;
  const hayRojo = p.avisos.some((a) => a.nivel === "rojo");
  if (hayRojo) { pitido(220, 0.35); vibrar([120, 80, 120]); }
  const u = unidades(p.items);
  panel(`
    <div class="bar"><b>Pedido encontrado</b><small>${esc(p.envio_tipo || "")}</small></div>
    <div class="scroll">
      <div class="cabecera">
        <span class="tienda ${p.tienda}">${nombreTienda(p.tienda)}</span>
        <h1>#${esc(p.pedido)}</h1>
        <p>${p.items.length} producto${p.items.length === 1 ? "" : "s"} · ${u} unidad${u === 1 ? "" : "es"}</p>
      </div>
      ${avisosHTML(p.avisos)}
      <div class="lista">
        ${p.items.map((i) => `
          <div class="fila">${fotoHTML(i.imagen)}
            <div class="t">${esc(i.nombre)}<small>${esc(i.variante.join(" · "))}</small></div>
            <span class="q">×${i.cantidad}</span></div>`).join("")}
      </div>
    </div>
    <div class="pie">
      <button class="cta ${hayRojo ? "no" : ""}" type="button" id="btnEmpezar">${hayRojo ? "Armar igual" : "Empezar a armar"}</button>
      <button class="cta ghost" type="button" id="btnVolverScan">Volver a escanear</button>
    </div>`);
  $("btnEmpezar").onclick = empezar;
  $("btnVolverScan").onclick = () => mostrar("vScan");
}

// ─── Tarjetas ───────────────────────────────────────────────────────────────
function empezar() {
  inicio = new Date().toISOString();
  lineas = pedido.items.map((i) => ({ ...i, estado: null, confirmado_at: null }));
  cola = lineas.map((_, i) => i);
  $("cTitulo").textContent = `#${pedido.pedido}`;
  mostrar("vCartas");
  pintarCarta();
}

function pintarDots(actual) {
  $("cDots").innerHTML = lineas.map((l, i) =>
    `<i class="${i === actual ? "now" : l.estado === "ok" ? "ok" : l.estado === "no_hay" ? "no" : l.estado === "buscando" ? "busca" : ""}"></i>`).join("");
}

function pintarCarta() {
  if (!cola.length) return resultado();
  const idx = cola[0];
  const l = lineas[idx];
  const hechos = lineas.filter((x) => x.estado === "ok" || x.estado === "no_hay").length;
  $("cPaso").textContent = l.estado === "buscando" ? "Lo estabas buscando" : `Producto ${hechos + 1} de ${lineas.length}`;
  pintarDots(idx);

  // Aviso cuando el pedido lleva el mismo producto en otra variante
  const hermanos = lineas.filter((x) => x.grupo === l.grupo);
  if (hermanos.length > 1 && l.variante.length) {
    $("parecido").hidden = false;
    $("parecido").textContent = `Este pedido lleva ${hermanos.length} variantes de este producto. Fijate que sea ${l.variante.join(" · ").toUpperCase()}.`;
  } else {
    $("parecido").hidden = true;
  }

  $("deck").innerHTML = `
    <div class="card" id="carta">
      <div class="stamp ok" id="sOk">LO TENGO</div>
      <div class="stamp no" id="sNo">NO LO TENGO</div>
      <div class="photo">${l.imagen ? `<img src="${esc(l.imagen)}" alt="${esc(l.nombre)}" draggable="false">` : ""}
        ${l.cantidad > 1 ? `<div class="qty"><span>LLEVA</span><strong>${l.cantidad}</strong></div>` : ""}</div>
      <div class="info">
        <div class="nombre">${esc(l.nombre)}</div>
        ${l.variante.length ? `<div class="chips">${l.variante.map((v) => `<span class="chip">${esc(v)}</span>`).join("")}</div>` : ""}
        ${l.sku ? `<div class="sku">${esc(l.sku)}</div>` : ""}
      </div>
    </div>`;
  activarArrastre($("carta"));
}

function activarArrastre(card) {
  let x0 = null, dx = 0;
  const umbral = () => Math.min(110, window.innerWidth * 0.25);
  const mover = () => {
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    $("sOk").style.opacity = Math.max(0, Math.min(1, dx / umbral()));
    $("sNo").style.opacity = Math.max(0, Math.min(1, -dx / umbral()));
  };
  card.addEventListener("pointerdown", (e) => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.classList.remove("volando"); });
  card.addEventListener("pointermove", (e) => { if (x0 === null) return; dx = e.clientX - x0; mover(); });
  const soltar = () => {
    if (x0 === null) return;
    x0 = null;
    if (dx > umbral()) return decidir("ok");
    if (dx < -umbral()) return decidir("no");
    card.classList.add("volando"); dx = 0; mover();
  };
  card.addEventListener("pointerup", soltar);
  card.addEventListener("pointercancel", soltar);
}

function sacarCarta(direccion) {
  const card = $("carta");
  if (!card) return Promise.resolve();
  card.classList.add("volando");
  card.style.transform = `translateX(${direccion * window.innerWidth}px) rotate(${direccion * 20}deg)`;
  card.style.opacity = "0";
  return new Promise((r) => setTimeout(r, 220));
}

let decidiendo = false;
async function decidir(que) {
  const idx = cola[0];
  if (idx === undefined || decidiendo) return;
  if (que === "ok") {
    decidiendo = true;
    vibrar(40);
    await sacarCarta(1);
    lineas[idx].estado = "ok";
    lineas[idx].confirmado_at = new Date().toISOString();
    cola.shift();
    decidiendo = false;
    pintarCarta();
  } else {
    $("sNo").style.opacity = 1;
    $("velo").hidden = false;
  }
}

$("btnOk").onclick = () => decidir("ok");
$("btnNo").onclick = () => decidir("no");

for (const b of document.querySelectorAll("#velo [data-motivo]")) {
  b.onclick = async () => {
    $("velo").hidden = true;
    const idx = cola[0];
    const motivo = b.dataset.motivo;
    if (motivo === "volver") return pintarCarta();
    vibrar(80);
    await sacarCarta(-1);
    cola.shift();
    if (motivo === "no_hay") {
      lineas[idx].estado = "no_hay";
      lineas[idx].confirmado_at = new Date().toISOString();
    } else {
      // Sigo buscando: pasa al final y vuelve a aparecer antes de cerrar
      lineas[idx].estado = "buscando";
      cola.push(idx);
    }
    pintarCarta();
  };
}
$("velo").onclick = (e) => { if (e.target === $("velo")) { $("velo").hidden = true; pintarCarta(); } };

// ─── Resultado ──────────────────────────────────────────────────────────────
function resultado() {
  const faltan = lineas.filter((l) => l.estado === "no_hay");
  const ok = !faltan.length;
  if (ok) { pitido(660, 0.1); setTimeout(() => pitido(990, 0.15), 120); vibrar([40, 40, 40]); }
  else { pitido(220, 0.35); vibrar([120, 80, 120]); }
  panel(`
    <div class="bar"><b>#${esc(pedido.pedido)}</b><small>Revisión final</small></div>
    <div class="scroll">
      ${ok
        ? `<div class="veredicto ok"><b>Pedido completo</b><span>${lineas.length} producto${lineas.length === 1 ? "" : "s"} · ${unidades(lineas)} unidades. Cerrá la caja.</span></div>`
        : `<div class="veredicto no"><b>Falta${faltan.length === 1 ? "" : "n"} ${faltan.length} producto${faltan.length === 1 ? "" : "s"}. No cierres la caja.</b><span>Dejalo aparte: queda en "Pedidos con faltante".</span></div>`}
      ${avisosHTML(pedido.avisos.filter((a) => a.nivel === "rojo"))}
      <div class="lista">
        ${lineas.map((l) => `
          <div class="fila">${fotoHTML(l.imagen)}
            <div class="t">${esc(l.nombre)}${l.cantidad > 1 ? ` ×${l.cantidad}` : ""}
              <small class="${l.estado === "no_hay" ? "why" : ""}">${l.estado === "no_hay" ? "No hay en el depósito" : esc(l.variante.join(" · "))}</small></div>
            <span class="mark ${l.estado === "ok" ? "ok" : "no"}">${l.estado === "ok" ? "✓" : "✕"}</span></div>`).join("")}
      </div>
      <div class="cabecera" id="guardando"><p>Guardando…</p></div>
    </div>
    <div class="pie">
      <button class="cta ${ok ? "ok" : ""}" type="button" id="btnSiguiente" disabled>Escanear el siguiente pedido</button>
      ${ok ? "" : `<button class="cta ghost" type="button" id="btnRevisar">Volver a revisar lo que falta</button>`}
    </div>`);
  $("btnSiguiente").onclick = () => mostrar("vScan");
  if (!ok) $("btnRevisar").onclick = () => {
    for (const l of lineas) if (l.estado === "no_hay") { l.estado = null; l.confirmado_at = null; }
    cola = lineas.map((l, i) => (l.estado === "ok" ? -1 : i)).filter((i) => i >= 0);
    mostrar("vCartas");
    pintarCarta();
  };
  guardar();
}

async function guardar() {
  const estado = $("guardando");
  try {
    await armadoFetch("/controles", {
      canal: pedido.canal, tienda: pedido.tienda, pedido: pedido.pedido, envio: pedido.envio,
      codigo_leido: codigoLeido, armado_por: quien, inicio_at: inicio,
      items: lineas.map((l) => ({ sku: l.sku, nombre: l.nombre, variante: l.variante, cantidad: l.cantidad, estado: l.estado, confirmado_at: l.confirmado_at })),
    });
    estado.innerHTML = `<p>Guardado${quien ? ` · armó ${esc(quien)}` : ""}.</p>`;
    $("btnSiguiente").disabled = false;
  } catch (err) {
    console.error(err);
    estado.innerHTML = `<div class="aviso rojo">No se pudo guardar el control. Revisá la conexión.</div>
      <button class="cta ghost" type="button" id="btnReintentar" style="margin-top:8px">Reintentar</button>`;
    $("btnReintentar").onclick = () => { estado.innerHTML = "<p>Guardando…</p>"; guardar(); };
    $("btnSiguiente").disabled = false;
    $("btnSiguiente").textContent = "Seguir sin guardar";
  }
}

// ─── Pedidos con faltante ───────────────────────────────────────────────────

    const { faltantes } = await armadoFetch("/faltantes");

      <div class="bar"><b>Con faltante</b><small>Últimos 14 días</small></div>
      <div class="scroll">
        ${faltantes.length ? `<div class="lista">${faltantes.map((c) => `
          <div class="fila" style="grid-template-columns:1fr">
            <div class="t">${nombreTienda(c.tienda)} · #${esc(c.pedido)}
              <small>${fmtFechaHora(c.creado_at)}${c.armado_por ? ` · ${esc(c.armado_por)}` : ""}</small>
              ${c.armado_items.map((i) => `<small class="why">Falta: ${esc(i.nombre)}${i.variante ? ` (${esc(i.variante)})` : ""}${i.cantidad > 1 ? ` ×${i.cantidad}` : ""}</small>`).join("")}
            </div>
          </div>`).join("")}</div>
          <p class="vacio">Cuando llegue lo que falta, escaneá el pedido de nuevo y confirmalo completo: sale de esta lista.</p>`
        : `<p class="vacio">No hay pedidos con faltante.</p>`}

  }
  $("btnVolverScan").onclick = () => mostrar("vScan");

$("btnFaltantes").onclick = verFaltantes;

// ─── Búsqueda de productos ──────────────────────────────────────────────────
// Varias personas buscan a la vez: las marcas se guardan en la base (una por SKU por día,
// gana la última) y cada celular las vuelve a pedir cada pocos segundos.
const SIN_CAT = "Sin categoría", SIN_MARCA = "Otros";
const busq = {
  lineas: [], actualizado: null, cargando: false,
  filtro: { canal: "todo", tienda: "todo" },
  vista: "elegir", categoria: null, sku: null,
  marcas: new Map(), presencia: [], firma: "",
  pollId: null, refrescoId: null,
};

function detenerBusqueda() {
  clearInterval(busq.pollId); busq.pollId = null;
  clearInterval(busq.refrescoId); busq.refrescoId = null;
}

async function abrirBusqueda() {
  busq.vista = "elegir";
  mostrar("vBusq");
  pintarBusqueda();
  await cargarPendientes(false);
  busq.pollId = setInterval(leerEstado, 5000);
  busq.refrescoId = setInterval(() => cargarPendientes(false), 3 * 60_000);
  leerEstado();
}

async function cargarPendientes(refrescar) {
  if (busq.cargando) return;
  busq.cargando = true;
  if (!busq.lineas.length) pintarBusqueda();
  try {
    const r = await armadoFetch(`/busqueda/pendientes${refrescar ? "?refrescar=1" : ""}`);
    busq.lineas = r.lineas;
    busq.actualizado = r.actualizado_at;
  } catch (err) {
    console.error(err);
    busq.error = "No se pudieron traer los pedidos. Revisá la conexión.";
  }
  busq.cargando = false;
  pintarBusqueda();
}

async function leerEstado() {
  try {
    const q = new URLSearchParams({ por: quien });
    if (busq.vista === "lista" || busq.vista === "detalle") q.set("categoria", busq.categoria || "");
    const r = await armadoFetch(`/busqueda/estado?${q}`);
    const firma = JSON.stringify(r);
    if (firma === busq.firma) return;
    busq.firma = firma;
    busq.marcas = new Map(r.marcas.map((m) => [m.sku, m]));
    busq.presencia = r.presencia.filter((p) => p.por !== quien);
    pintarBusqueda();
  } catch (err) { console.error(err); }
}

function lineasFiltradas() {
  const f = busq.filtro;
  return busq.lineas.filter((l) => (f.canal === "todo" || l.canal === f.canal) && (f.tienda === "todo" || l.tienda === f.tienda));
}

/** Un producto por SKU con el total a buscar y sus pedidos. */
function productos() {
  const porSku = new Map();
  for (const l of lineasFiltradas()) {
    const clave = l.sku || `${l.nombre}|${l.variante.join("|")}`;
    let p = porSku.get(clave);
    if (!p) {
      p = { sku: clave, nombre: l.nombre, variante: l.variante, imagen: l.imagen,
        categoria: l.categoria || SIN_CAT, marca: l.marca || SIN_MARCA, unidades: 0, pedidos: [] };
      porSku.set(clave, p);
    }
    p.unidades += l.cantidad;
    p.pedidos.push(l);
  }
  return [...porSku.values()];
}

/** En qué quedó un producto: pendiente, encontrado o con faltante (y si aparecieron unidades nuevas). */
function estadoDe(p) {
  const m = busq.marcas.get(p.sku);
  if (!m) return { tipo: "pend", buscar: p.unidades, encontradas: 0, faltan: 0, m: null };
  const extra = p.unidades - m.requeridas;
  if (extra > 0) return { tipo: "pend", buscar: extra, encontradas: m.encontradas, faltan: 0, extra, m };
  const faltan = Math.min(p.unidades, m.requeridas - m.encontradas);
  return { tipo: faltan > 0 ? "no" : "ok", buscar: 0, encontradas: Math.min(m.encontradas, p.unidades), faltan, m };
}

const horaCorta = (iso) => new Date(iso).toLocaleTimeString("es-AR", {
  hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/Argentina/Buenos_Aires" });
const sumar = (xs, f) => xs.reduce((s, x) => s + f(x), 0);
const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

function cabecera(titulo, sub, atras) {
  $("bTitulo").textContent = titulo;
  $("bSub").innerHTML = sub || "";
  $("bAtras").onclick = atras;
}

function pintarBusqueda() {
  if ($("vBusq").hidden) return;
  const cuerpo = $("bBody");
  const scroll = cuerpo.scrollTop;
  cuerpo.classList.remove("centro");
  $("bPie").innerHTML = "";

  if (busq.cargando && !busq.lineas.length) {
    cabecera("‹ Búsqueda", "", () => mostrar("vInicio"));
    cuerpo.innerHTML = `<div class="cargando">Trayendo los pedidos pendientes…</div>`;
    return;
  }
  if (busq.error && !busq.lineas.length) {
    cabecera("‹ Búsqueda", "", () => mostrar("vInicio"));
    cuerpo.innerHTML = `<div class="aviso rojo">${esc(busq.error)}</div>`;
    $("bPie").innerHTML = `<button class="cta" type="button" id="bReintentar">Reintentar</button>`;
    $("bReintentar").onclick = () => { busq.error = null; cargarPendientes(true); };
    return;
  }
  ({ elegir: vistaElegir, canal: vistaCanal, cats: vistaCats, lista: vistaLista, detalle: vistaDetalle, falta: vistaFalta })[busq.vista]();
  if (busq.vista === "lista" || busq.vista === "cats") cuerpo.scrollTop = scroll;
}

function ir(vista, extra = {}) {
  Object.assign(busq, { vista }, extra);
  $("bBody").scrollTop = 0;
  pintarBusqueda();
  if (vista === "lista" || vista === "cats") leerEstado();
}

function resumenPedidos(lineas) {
  return { pedidos: new Set(lineas.map((l) => `${l.canal}|${l.tienda}|${l.pedido}`)).size, unidades: sumar(lineas, (l) => l.cantidad) };
}

function vistaElegir() {
  cabecera("‹ Búsqueda", busq.actualizado ? `Pendientes al<br>${horaCorta(busq.actualizado)}` : "", () => mostrar("vInicio"));
  const r = resumenPedidos(busq.lineas);
  $("bBody").classList.add("centro");
  $("bBody").innerHTML = `
    <h1 style="margin:0 0 4px;font-family:var(--display);font-size:38px;line-height:1">¿Qué querés buscar?</h1>
    <button class="tarea principal" type="button" id="bTodo"><b>Todo</b><span>Mercado Libre y Tiendanube, las dos marcas</span>
      <span style="font-family:var(--display);font-size:22px;font-weight:800;color:#fff">${pl(r.pedidos, "pedido", "pedidos")} · ${pl(r.unidades, "unidad", "unidades")}</span></button>
    <button class="tarea" type="button" id="bPorCanal"><b>Por canal</b><span>Elegís Mercado Libre o Tiendanube, y Pret a Home o Casa Laván</span></button>`;
  $("bTodo").onclick = () => { busq.filtro = { canal: "todo", tienda: "todo" }; ir("cats"); };
  $("bPorCanal").onclick = () => {
    if (busq.filtro.canal === "todo") busq.filtro = { canal: "ml", tienda: "pret" };
    ir("canal");
  };
}

function vistaCanal() {
  cabecera("‹ Por canal", "", () => ir("elegir"));
  const f = busq.filtro;
  const cuenta = (canal, tienda) => resumenPedidos(busq.lineas.filter((l) => (!canal || l.canal === canal) && (!tienda || l.tienda === tienda))).pedidos;
  const sel = resumenPedidos(lineasFiltradas());
  const nombreCanal = f.canal === "ml" ? "Mercado Libre" : "Tiendanube";
  $("bBody").innerHTML = `
    <div class="grupo"><span>Canal</span><div class="seg">
      <button type="button" data-canal="ml" class="${f.canal === "ml" ? "on" : ""}">Mercado Libre<small>${pl(cuenta("ml", f.tienda), "pedido", "pedidos")}</small></button>
      <button type="button" data-canal="tn" class="${f.canal === "tn" ? "on" : ""}">Tiendanube<small>${pl(cuenta("tn", f.tienda), "pedido", "pedidos")}</small></button>
    </div></div>
    <div class="grupo"><span>Marca</span><div class="seg">
      <button type="button" data-tienda="pret" class="${f.tienda === "pret" ? "on" : ""}">Pret a Home<small>${pl(cuenta(f.canal, "pret"), "pedido", "pedidos")}</small></button>
      <button type="button" data-tienda="lavan" class="${f.tienda === "lavan" ? "on" : ""}">Casa Laván<small>${pl(cuenta(f.canal, "lavan"), "pedido", "pedidos")}</small></button>
    </div></div>
    <div class="caja"><span>${nombreCanal} · ${nombreTienda(f.tienda)}</span><b>${pl(sel.unidades, "unidad", "unidades")}</b>
      <span>${pl(sel.pedidos, "pedido", "pedidos")} · ${pl(productos().length, "producto distinto", "productos distintos")}</span></div>`;
  for (const b of $("bBody").querySelectorAll("[data-canal]")) b.onclick = () => { busq.filtro.canal = b.dataset.canal; pintarBusqueda(); };
  for (const b of $("bBody").querySelectorAll("[data-tienda]")) b.onclick = () => { busq.filtro.tienda = b.dataset.tienda; pintarBusqueda(); };
  $("bPie").innerHTML = `<button class="cta ok" type="button" id="bEmpezar" ${sel.unidades ? "" : "disabled"}>${sel.unidades ? "Empezar a buscar" : "No hay nada pendiente"}</button>`;
  $("bEmpezar").onclick = () => ir("cats");
}

function nombreFiltro() {
  const f = busq.filtro;
  if (f.canal === "todo") return "Todo";
  return `${f.canal === "ml" ? "ML" : "TN"} ${f.tienda === "lavan" ? "Laván" : "Pret"}`;
}

function vistaCats() {
  const prods = productos();
  const total = sumar(prods, (p) => p.unidades);
  const pend = sumar(prods, (p) => estadoDe(p).buscar);
  cabecera(`‹ ${nombreFiltro()}`, `${pl(pend, "unidad", "unidades")}<br>por buscar`, () => ir(busq.filtro.canal === "todo" ? "elegir" : "canal"));
  const cats = new Map();
  for (const p of prods) {
    const c = cats.get(p.categoria) || { nombre: p.categoria, prods: [] };
    c.prods.push(p);
    cats.set(p.categoria, c);
  }
  const lista = [...cats.values()].map((c) => {
    const u = sumar(c.prods, (p) => p.unidades);
    const enc = sumar(c.prods, (p) => estadoDe(p).encontradas);
    const falt = sumar(c.prods, (p) => estadoDe(p).faltan);
    const pend = sumar(c.prods, (p) => estadoDe(p).buscar);
    const gente = busq.presencia.filter((x) => x.categoria === c.nombre).map((x) => x.por);
    return { ...c, u, enc, falt, pend, gente };
  }).sort((a, b) => b.u - a.u);
  const totalFalta = sumar(prods, (p) => estadoDe(p).faltan);

  $("bBody").innerHTML = lista.length ? lista.map((c) => {
    let estado;
    if (!c.pend && !c.falt) estado = `<small class="ok">✓ Todo encontrado</small>`;
    else if (!c.pend) estado = `<small class="no">Faltan ${pl(c.falt, "unidad", "unidades")}</small>`;
    else if (c.enc || c.falt) estado = `<small>${c.u - c.pend} de ${c.u} marcadas${c.falt ? ` · <span style="color:var(--no);font-weight:700">faltan ${c.falt}</span>` : ""}</small>`;
    else estado = `<small>${pl(c.prods.length, "producto", "productos")}</small>`;
    const gente = c.gente.length ? ` · <span class="quien">buscando: ${esc(c.gente.join(", "))}</span>` : "";
    return `<button class="cat ${c.pend ? "" : "hecha"}" type="button" data-cat="${esc(c.nombre)}">
      <b>${esc(c.nombre)}</b><span class="u">${c.u}</span>
      ${estado.replace("</small>", `${gente}</small>`)}<span></span>
      <div class="barra"><i class="ok" style="width:${(c.enc / c.u) * 100}%"></i><i class="no" style="width:${(c.falt / c.u) * 100}%"></i></div>
    </button>`;
  }).join("") + `<div class="actualizado">Pedidos al ${busq.actualizado ? horaCorta(busq.actualizado) : "—"} ·
      <button class="link" type="button" id="bRefrescar">${busq.cargando ? "actualizando…" : "actualizar"}</button></div>`
    : `<p class="vacio">No hay nada pendiente para buscar.</p>`;
  for (const b of $("bBody").querySelectorAll("[data-cat]")) b.onclick = () => ir("lista", { categoria: b.dataset.cat });
  const r = $("bRefrescar");
  if (r) r.onclick = () => cargarPendientes(true);
  if (totalFalta) {
    $("bPie").innerHTML = `<button class="cta ghost" type="button" id="bVerFalta">Ver lo que falta (${totalFalta})</button>`;
    $("bVerFalta").onclick = () => ir("falta");
  }
}

function filaProducto(p) {
  const e = estadoDe(p);
  const foto = p.imagen ? `<img src="${esc(p.imagen)}" alt="" loading="lazy">` : `<div class="sinfoto"></div>`;
  const variante = p.variante.length ? `<span class="var">${esc(p.variante.join(" · "))}</span>` : "";
  let detalle, lado;
  if (e.tipo === "pend") {
    detalle = e.extra ? `<small class="extra">Aparecieron ${e.extra} más</small>` : "";
    lado = `<div class="q">${e.buscar}<small>${pl(new Set(p.pedidos.map((l) => l.pedido)).size, "pedido", "pedidos")}</small></div>`;
  } else if (e.tipo === "ok") {
    detalle = `<small class="ok">${esc(e.m.por || "")} · ${horaCorta(e.m.marcado_at)}</small>`;
    lado = `<span class="mk ok">✓</span>`;
  } else {
    detalle = `<small class="no">${e.encontradas ? `Hay ${e.encontradas} · faltan ${e.faltan}` : `No hay · faltan ${e.faltan}`} · ${esc(e.m.por || "")}</small>`;
    lado = `<span class="mk no">✕</span>`;
  }
  return `<div class="slot"><div class="fondo"><span>✓ LA TENGO</span><span></span></div>
    <div class="prod ${e.tipo === "pend" ? "" : e.tipo}" data-sku="${esc(p.sku)}">${foto}
      <div class="t">${esc(p.nombre)}${variante}${detalle}</div>${lado}</div></div>`;
}

function vistaLista() {
  const prods = productos().filter((p) => p.categoria === busq.categoria);
  const pend = sumar(prods, (p) => estadoDe(p).buscar);
  const gente = busq.presencia.filter((x) => x.categoria === busq.categoria).map((x) => x.por);
  cabecera(`‹ ${busq.categoria}`, `${pl(pend, "unidad", "unidades")} por buscar${gente.length ? `<br>con ${esc(gente.join(", "))}` : ""}`, () => ir("cats"));
  const marcas = new Map();
  for (const p of prods) {
    const m = marcas.get(p.marca) || [];
    m.push(p);
    marcas.set(p.marca, m);
  }
  const orden = (p) => (estadoDe(p).tipo === "pend" ? 0 : 1);
  $("bBody").innerHTML = [...marcas.entries()]
    .sort((a, b) => sumar(b[1], (p) => p.unidades) - sumar(a[1], (p) => p.unidades))
    .map(([marca, ps]) => `
      <div class="marca-h">${esc(marca)} <em>${sumar(ps, (p) => p.unidades)} u.</em></div>
      ${ps.sort((a, b) => orden(a) - orden(b) || b.unidades - a.unidades).map(filaProducto).join("")}`).join("")
    + `<div class="hint">← No la tengo · Tocá para ver los pedidos · La tengo →</div>`;
  for (const el of $("bBody").querySelectorAll(".prod")) activarDeslizar(el);
}

/** Fila deslizable: a la derecha "la tengo", a la izquierda "no la tengo"; un toque abre el detalle. */
function activarDeslizar(el) {
  const p = () => productos().find((x) => x.sku === el.dataset.sku);
  const fondo = el.previousElementSibling;
  let x0 = null, y0 = 0, dx = 0, horizontal = null;
  el.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; dx = 0; horizontal = null; el.classList.remove("vuelve"); });
  el.addEventListener("pointermove", (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    const dy = e.clientY - y0;
    if (horizontal === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      horizontal = Math.abs(dx) > Math.abs(dy);
      if (horizontal) try { el.setPointerCapture(e.pointerId); } catch {}
    }
    if (!horizontal) return;
    el.style.transform = `translateX(${dx}px)`;
    fondo.classList.toggle("izq", dx < 0);
    fondo.firstElementChild.textContent = dx > 0 ? "✓ LA TENGO" : "";
    fondo.lastElementChild.textContent = dx < 0 ? "NO LA TENGO ✕" : "";
  });
  const soltar = () => {
    if (x0 === null) return;
    x0 = null;
    const umbral = Math.min(100, el.offsetWidth * 0.28);
    el.classList.add("vuelve");
    el.style.transform = "";
    if (horizontal === null) return ir("detalle", { sku: el.dataset.sku });
    if (!horizontal) return;
    const prod = p();
    if (!prod) return;
    if (dx > umbral) marcarTodas(prod);
    else if (dx < -umbral) pedirCantidad(prod);
  };
  el.addEventListener("pointerup", soltar);
  el.addEventListener("pointercancel", () => { x0 = null; el.classList.add("vuelve"); el.style.transform = ""; });
}

async function guardarMarca(p, encontradasNuevas) {
  const e = estadoDe(p);
  // Si después de marcar aparecieron unidades nuevas, lo encontrado antes se suma.
  const base = e.extra ? e.encontradas : 0;
  const encontradas = base + encontradasNuevas;
  const estado = encontradas >= p.unidades ? "ok" : encontradas === 0 ? "no_hay" : "parcial";
  const marca = { sku: p.sku, estado, requeridas: p.unidades, encontradas, por: quien, marcado_at: new Date().toISOString() };
  busq.marcas.set(p.sku, marca); // se ve al instante; la base confirma en el próximo ciclo
  vibrar(estado === "ok" ? 40 : 90);
  pintarBusqueda();
  try { await armadoFetch("/busqueda/marcar", marca); leerEstado(); }
  catch (err) { console.error(err); alertaB("No se pudo guardar la marca. Revisá la conexión."); busq.marcas.delete(p.sku); pintarBusqueda(); }
}

async function desmarcar(p) {
  busq.marcas.delete(p.sku);
  pintarBusqueda();
  try { await armadoFetch("/busqueda/marcar", { sku: p.sku, estado: "borrar" }); }
  catch (err) { console.error(err); alertaB("No se pudo desmarcar. Revisá la conexión."); }
}

function alertaB(txt) {
  const div = document.createElement("div");
  div.className = "aviso rojo";
  div.textContent = txt;
  $("bBody").prepend(div);
  setTimeout(() => div.remove(), 5000);
}

function marcarTodas(p) { guardarMarca(p, estadoDe(p).buscar); }

function cerrarHoja() { $("veloB").hidden = true; }
$("veloB").onclick = (e) => { if (e.target === $("veloB")) cerrarHoja(); };

/** No la tiene (o no todas): si buscaba más de una, pregunta cuántas encontró. */
function pedirCantidad(p) {
  const buscar = estadoDe(p).buscar || p.unidades;
  const titulo = `${esc(p.nombre)}${p.variante.length ? ` · ${esc(p.variante.join(" · "))}` : ""}`;
  if (buscar <= 1) {
    $("hojaB").innerHTML = `
      <h3>¿Qué pasó con este producto?</h3>
      <div style="font-size:14px;color:var(--soft);margin-top:-6px">${titulo}</div>
      <button class="opt rojo" type="button" id="hNoHay">No hay en el depósito</button>
      <button class="opt" type="button" id="hSigo">Sigo buscando <small>Queda pendiente</small></button>
      <button class="opt" type="button" id="hVolver">Me equivoqué <small>Volver</small></button>`;
  } else {
    let n = 0;
    $("hojaB").innerHTML = `
      <h3>¿Cuántas encontraste?</h3>
      <div style="font-size:14px;color:var(--soft);margin-top:-6px">${titulo} · había que buscar ${buscar}</div>
      <div class="stepper"><button type="button" id="hMenos">−</button><strong id="hN"></strong><button type="button" id="hMas">+</button></div>
      <button class="cta ok" type="button" id="hGuardar"></button>
      <button class="opt rojo" type="button" id="hNoHay">No hay ninguna</button>
      <button class="opt" type="button" id="hSigo">Sigo buscando <small>Queda pendiente</small></button>`;
    const pintar = () => {
      $("hN").innerHTML = `${n} <small>de ${buscar}</small>`;
      $("hGuardar").textContent = n ? `Encontré ${n} · faltan ${buscar - n}` : "Elegí cuántas encontraste";
      $("hGuardar").disabled = !n;
    };
    $("hMenos").onclick = () => { n = Math.max(0, n - 1); pintar(); };
    $("hMas").onclick = () => { n = Math.min(buscar - 1, n + 1); pintar(); };
    $("hGuardar").onclick = () => { cerrarHoja(); guardarMarca(p, n); };
    pintar();
  }
  $("hNoHay").onclick = () => { cerrarHoja(); guardarMarca(p, 0); };
  $("hSigo").onclick = cerrarHoja;
  const v = $("hVolver");
  if (v) v.onclick = cerrarHoja;
  $("veloB").hidden = false;
}

function vistaDetalle() {
  const p = productos().find((x) => x.sku === busq.sku);
  if (!p) return ir("lista");
  const e = estadoDe(p);
  cabecera(`‹ ${busq.categoria}`, esc(p.marca), () => ir("lista"));
  const porPedido = new Map();
  for (const l of p.pedidos) {
    const k = `${l.canal}|${l.tienda}|${l.pedido}`;
    const x = porPedido.get(k) || { ...l, cantidad: 0 };
    x.cantidad += l.cantidad;
    porPedido.set(k, x);
  }
  const pedidos = [...porPedido.values()].sort((a, b) => b.cantidad - a.cantidad);
  let marcado = "";
  if (e.m) {
    const txt = e.tipo === "ok" ? "Encontrada" : e.tipo === "no" ? (e.encontradas ? `Hay ${e.encontradas}, faltan ${e.faltan}` : "No hay") : `Ya se marcaron ${e.m.requeridas}`;
    marcado = `<div class="marcado">${txt} · ${esc(e.m.por || "")} · ${horaCorta(e.m.marcado_at)} ·
      <button class="link" type="button" id="bDesmarcar">desmarcar</button></div>`;
  }
  $("bBody").innerHTML = `
    <div class="foto-g">${p.imagen ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}">` : ""}
      <div class="qty"><span>BUSCÁ</span><strong>${e.tipo === "pend" ? e.buscar : p.unidades}</strong></div></div>
    <div class="nombre">${esc(p.nombre)}</div>
    ${p.variante.length ? `<div class="chips">${p.variante.map((v) => `<span class="chip">${esc(v)}</span>`).join("")}</div>` : ""}
    <div class="sku">${esc(p.sku)}</div>
    ${marcado}
    <div class="grupo"><span>Para ${pl(pedidos.length, "pedido", "pedidos")}</span>
      ${pedidos.map((l) => `<div class="ped"><span class="tag ${l.canal}">${l.canal.toUpperCase()}</span>
        <div>${nombreTienda(l.tienda)} · ${l.canal === "tn" ? `#${esc(l.pedido)}` : esc(l.logistica || "")}
          <small>${l.canal === "tn" ? esc(l.logistica || "") : `Venta ${esc(l.pedido)}`}</small></div><b>×${l.cantidad}</b></div>`).join("")}
    </div>`;
  if (e.m) $("bDesmarcar").onclick = () => desmarcar(p);
  if (e.tipo === "pend") {
    $("bPie").innerHTML = `<div class="acciones" style="padding:0">
      <button class="btn no" type="button" id="bNo" aria-label="No la tengo">✕</button>
      <button class="btn ok" type="button" id="bOk" aria-label="La tengo">✓</button></div>`;
    $("bOk").onclick = () => { marcarTodas(p); ir("lista"); };
    $("bNo").onclick = () => pedirCantidad(p);
  }
}

function vistaFalta() {
  cabecera("‹ Lo que falta", "", () => ir("cats"));
  const prods = productos().filter((p) => estadoDe(p).faltan > 0);
  $("bBody").innerHTML = prods.length ? `
    <div class="aviso rojo">Estos pedidos no se van a poder despachar completos.</div>
    ${prods.map((p) => {
      const e = estadoDe(p);
      const peds = [...new Set(p.pedidos.map((l) => `${nombreTienda(l.tienda)} · ${l.canal === "tn" ? "#" + l.pedido : (l.logistica || "ML") + " " + l.pedido}`))];
      return `<div class="falta-item"><b>${esc(p.nombre)}</b>
        ${p.variante.length ? `<span class="var">${esc(p.variante.join(" · "))}</span>` : ""}
        <small class="no">Faltan ${e.faltan} de ${p.unidades}${e.m?.por ? ` · marcó ${esc(e.m.por)}` : ""}</small>
        ${peds.map((x) => `<small>${esc(x)}</small>`).join("")}</div>`;
    }).join("")}` : `<p class="vacio">No falta nada.</p>`;
}

// ─── Arranque ───────────────────────────────────────────────────────────────
(async () => {
  pintarQuien();
  pedirWakeLock();
  if (!quien || !clave) salir();
  else mostrar("vInicio");
})();
</script>
</body>
