<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposición — Historial de quiebres</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff;
    --abierto:#b02a37; --cerrado:#1e7e34; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { padding: 16px 20px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .badge.abierto { background: var(--abierto); }
  .badge.cerrado { background: var(--cerrado); }
  #status { padding: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🕳️ Historial de quiebres de stock</h1>
  <div class="toolbar">
    <input type="text" id="filtroSku" placeholder="Filtrar por SKU…">
    <button id="btnFiltrar">Buscar</button>
    <button id="btnLimpiar">Ver todos</button>
  </div>
  <div id="status">Cargando…</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr><th>SKU</th><th>Destino</th><th>Fecha quiebre</th><th>Stock previo</th><th>Vel. semanal al quebrar</th><th>Repuesto</th><th>Estado</th></tr>
    </thead>
    <tbody id="filas"></tbody>
  </table>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
renderNav("quiebres");

const DESTINO_LABEL = { deposito: "Depósito", full_pret: "Full Pret", full_lavan: "Full Lavan" };

function render(quiebres) {
  const tbody = document.getElementById("filas");
  tbody.innerHTML = "";
  for (const q of quiebres) {
    const abierto = !q.fecha_reposicion;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${q.sku}</td>
      <td>${DESTINO_LABEL[q.destino] || q.destino}</td>
      <td>${fmtDate(q.fecha_quiebre)}</td>
      <td>${fmtNum(q.stock_previo)}</td>
      <td>${fmtNum(q.vel_semanal_al_quebrar)}</td>
      <td>${q.fecha_reposicion ? fmtDate(q.fecha_reposicion) : "—"}</td>
      <td><span class="badge ${abierto ? "abierto" : "cerrado"}">${abierto ? "Sigue sin stock" : "Repuesto"}</span></td>
    `;
    tbody.appendChild(tr);
  }
}

async function cargar(sku) {
  document.getElementById("status").textContent = "Cargando…";
  document.getElementById("tabla").style.display = "none";
  try {
    const qs = sku ? `?sku=${encodeURIComponent(sku)}` : "";
    const quiebres = await apiFetch(`/quiebres${qs}`);
    render(quiebres);
    document.getElementById("status").style.display = "none";
    document.getElementById("tabla").style.display = "table";
  } catch (e) {
    document.getElementById("status").textContent = `Error: ${e.message}`;
  }
}

document.getElementById("btnFiltrar").addEventListener("click", () => cargar(document.getElementById("filtroSku").value.trim()));
document.getElementById("btnLimpiar").addEventListener("click", () => { document.getElementById("filtroSku").value = ""; cargar(); });
document.getElementById("filtroSku").addEventListener("keydown", (e) => { if (e.key === "Enter") cargar(e.target.value.trim()); });

cargar();
</script>
</body>
</html>
