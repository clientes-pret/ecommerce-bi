<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposición — Carrito</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { padding: 16px 20px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .grupo { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .grupo h2 { margin: 0 0 12px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  input[type=number] { width: 80px; background: #0f1115; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  .hint { color: var(--muted); font-size: 11px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-right: 8px; }
  button.secondary { background: #0f1115; border: 1px solid var(--border); color: var(--text); }
  button.link { background: transparent; color: var(--muted); padding: 2px 6px; font-size: 12px; margin: 0; }
  button.link:hover { color: #e57373; }
  button:disabled { opacity: 0.5; cursor: default; }
  .grupo-acciones { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
  .ok-msg { color: #6fcf97; font-size: 13px; }
  #vacio { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🛒 Carrito de reposición</h1>
  <div id="vacio" style="display:none">
    El carrito está vacío. Volvé al <a href="index.html" style="color:var(--accent)">tablero</a>, elegí un SKU,
    decidí cantidad para depósito/Full y agregalo al carrito.
  </div>
  <div id="grupos"></div>
</main>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/logo-black-base64.js"></script>
<script src="app.js"></script>
<script>
renderNav("pedido");

const DESTINO_LABEL = { deposito: "Depósito", full_pret: "Full Pret a Home", full_lavan: "Full Casa Lavan" };

function agruparPorProveedor(lineas) {
  const grupos = new Map();
  for (const l of lineas) {
    if (!grupos.has(l.proveedor)) grupos.set(l.proveedor, []);
    grupos.get(l.proveedor).push(l);
  }
  return grupos;
}

function lineasDelGrupo(grupoEl) {
  const lineas = [];
  grupoEl.querySelectorAll("tbody tr[data-sku]").forEach((tr) => {
    const qty = Number(tr.querySelector("input.qty-linea").value);
    if (qty > 0) {
      lineas.push({
        sku: tr.dataset.sku,
        nombre: tr.dataset.nombre,
        destino: tr.dataset.destino,
        cantidad_pedida: qty,
        cantidad_sugerida: Number(tr.dataset.sugerida || 0),
      });
    }
  });
  return lineas;
}

function generarPDF(proveedor, lineas) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const hoy = new Date().toLocaleDateString("es-AR");
  doc.addImage(LOGO_PDF_BASE64, "PNG", 14, 8, 50, 8.89);
  doc.setFontSize(14);
  doc.text(`Orden de pedido — ${proveedor}`, 14, 32);
  doc.setFontSize(10);
  doc.text(`Fecha: ${hoy}  |  Pedido por: ${getUser()}`, 14, 39);

  let y = 52;
  doc.setFontSize(11);
  doc.text("SKU", 14, y);
  doc.text("Producto", 50, y);
  doc.text("Destino", 140, y);
  doc.text("Cantidad", 175, y);
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  doc.setFontSize(10);
  for (const l of lineas) {
    if (y > 280) { doc.addPage(); y = 20; }
    doc.text(String(l.sku), 14, y);
    doc.text(String(l.nombre || "").slice(0, 45), 50, y);
    doc.text(DESTINO_LABEL[l.destino] || l.destino, 140, y);
    doc.text(String(l.cantidad_pedida), 175, y);
    y += 7;
  }

  const totalUnidades = lineas.reduce((s, l) => s + l.cantidad_pedida, 0);
  y += 4;
  doc.setFontSize(11);
  doc.text(`Total: ${lineas.length} líneas, ${totalUnidades} unidades`, 14, y);

  doc.save(`pedido_${proveedor.replace(/\s+/g, "_")}_${hoy.replace(/\//g, "-")}.pdf`);
}

async function confirmarPedido(proveedor, lineas, grupoEl) {
  const btn = grupoEl.querySelector(".btn-confirmar");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  try {
    const res = await apiFetch("/pedidos", {
      method: "POST",
      body: JSON.stringify({ proveedor, creado_por: getUser(), items: lineas }),
    });
    // El pedido ya quedó registrado en el servidor — sacamos del carrito
    // local las líneas de este proveedor que se acaban de confirmar.
    const restantes = getCarrito().filter((l) => l.proveedor !== proveedor);
    setCarrito(restantes);
    grupoEl.querySelector(".grupo-acciones").insertAdjacentHTML(
      "beforeend", `<span class="ok-msg">✓ Pedido #${res.pedido_id} guardado</span>`
    );
    btn.textContent = "Guardado";
    grupoEl.querySelectorAll("input, button.link").forEach((el) => el.disabled = true);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Confirmar pedido";
    alert(`Error guardando el pedido: ${e.message}`);
  }
}

function quitarLinea(sku, destino) {
  quitarLineaCarrito(sku, destino);
  render();
}

function renderGrupo(proveedor, lineas) {
  const el = document.createElement("div");
  el.className = "grupo";
  const filas = lineas.map((l) => `
    <tr data-sku="${l.sku}" data-nombre="${(l.nombre || "").replace(/"/g, "&quot;")}" data-destino="${l.destino}" data-sugerida="${l.cantidad_sugerida || 0}">
      <td>${l.sku}</td>
      <td>${l.nombre || "—"}</td>
      <td>${DESTINO_LABEL[l.destino] || l.destino}</td>
      <td>
        <input type="number" class="qty-linea" value="${l.cantidad}" min="0">
        <div class="hint">stock al agregar: ${fmtNum(l.stock_hoy)}</div>
      </td>
      <td><button class="link btn-quitar">✕ Quitar</button></td>
    </tr>`).join("");

  el.innerHTML = `
    <h2>📦 ${proveedor} — ${lineas.length} líneas</h2>
    <table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Destino</th><th>Cantidad</th><th></th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <div class="grupo-acciones">
      <button class="secondary btn-pdf">⬇ Descargar PDF</button>
      <button class="btn-confirmar">Confirmar pedido</button>
    </div>
  `;

  el.querySelectorAll(".btn-quitar").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tr = btn.closest("tr");
      quitarLinea(tr.dataset.sku, tr.dataset.destino);
    });
  });
  el.querySelector(".btn-pdf").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas con cantidad > 0.");
    generarPDF(proveedor, lineas);
  });
  el.querySelector(".btn-confirmar").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas con cantidad > 0.");
    confirmarPedido(proveedor, lineas, el);
  });

  return el;
}

function render() {
  const carrito = getCarrito();
  const cont = document.getElementById("grupos");
  cont.innerHTML = "";
  if (!carrito.length) {
    document.getElementById("vacio").style.display = "block";
    return;
  }
  document.getElementById("vacio").style.display = "none";
  const grupos = agruparPorProveedor(carrito);
  for (const [proveedor, lineas] of grupos) {
    cont.appendChild(renderGrupo(proveedor, lineas));
  }
}

render();
</script>
</body>
</html>
