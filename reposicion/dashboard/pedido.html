<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposición — Armar pedido</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { padding: 16px 20px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .grupo { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .grupo h2 { margin: 0 0 12px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  input[type=number] { width: 70px; background: #0f1115; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  input[type=checkbox] { transform: scale(1.1); }
  .hint { color: var(--muted); font-size: 11px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-right: 8px; }
  button.secondary { background: #0f1115; border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }
  .grupo-acciones { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
  .ok-msg { color: #6fcf97; font-size: 13px; }
  #vacio { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🧾 Armar pedido de reposición</h1>
  <div id="vacio" style="display:none">
    No hay productos seleccionados. Volvé al <a href="index.html" style="color:var(--accent)">tablero</a> y elegí SKUs con el checkbox.
  </div>
  <div id="grupos"></div>
</main>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
renderNav("pedido");

const items = JSON.parse(localStorage.getItem("repo_pedido_borrador") || "[]");

function agruparPorProveedor(items) {
  const grupos = new Map();
  for (const it of items) {
    if (!grupos.has(it.proveedor)) grupos.set(it.proveedor, []);
    grupos.get(it.proveedor).push(it);
  }
  return grupos;
}

function lineasDelGrupo(grupoEl) {
  // Recorre cada fila de producto del grupo y arma las líneas habilitadas (depósito/full_pret/full_lavan)
  const lineas = [];
  grupoEl.querySelectorAll("tbody tr[data-sku]").forEach((tr) => {
    const sku = tr.dataset.sku;
    const nombre = tr.dataset.nombre;
    for (const destino of ["deposito", "full_pret", "full_lavan"]) {
      const chk = tr.querySelector(`input.chk-destino[data-destino="${destino}"]`);
      const qty = tr.querySelector(`input.qty-destino[data-destino="${destino}"]`);
      if (chk && chk.checked && Number(qty.value) > 0) {
        lineas.push({
          sku, nombre, destino,
          cantidad_pedida: Number(qty.value),
          cantidad_sugerida: Number(qty.dataset.sugerida || 0),
        });
      }
    }
  });
  return lineas;
}

function generarPDF(proveedor, lineas) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const hoy = new Date().toLocaleDateString("es-AR");
  doc.setFontSize(14);
  doc.text(`Orden de pedido — ${proveedor}`, 14, 18);
  doc.setFontSize(10);
  doc.text(`Fecha: ${hoy}  |  Pedido por: ${getUser()}`, 14, 25);

  let y = 38;
  doc.setFontSize(11);
  doc.text("SKU", 14, y);
  doc.text("Producto", 50, y);
  doc.text("Destino", 140, y);
  doc.text("Cantidad", 175, y);
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  const destinoLabel = { deposito: "Depósito", full_pret: "Full Pret", full_lavan: "Full Lavan" };
  doc.setFontSize(10);
  for (const l of lineas) {
    if (y > 280) { doc.addPage(); y = 20; }
    doc.text(String(l.sku), 14, y);
    doc.text(String(l.nombre || "").slice(0, 45), 50, y);
    doc.text(destinoLabel[l.destino] || l.destino, 140, y);
    doc.text(String(l.cantidad_pedida), 175, y);
    y += 7;
  }

  const totalUnidades = lineas.reduce((s, l) => s + l.cantidad_pedida, 0);
  y += 4;
  doc.setFontSize(11);
  doc.text(`Total: ${lineas.length} SKUs, ${totalUnidades} unidades`, 14, y);

  doc.save(`pedido_${proveedor.replace(/\s+/g, "_")}_${hoy.replace(/\//g, "-")}.pdf`);
}

async function confirmarPedido(proveedor, lineas, grupoEl) {
  const btn = grupoEl.querySelector(".btn-confirmar");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  try {
    const res = await apiFetch("/pedidos", {
      method: "POST",
      body: JSON.stringify({ proveedor, creado_por: getUser(), items: lineas }),
    });
    grupoEl.querySelector(".grupo-acciones").insertAdjacentHTML(
      "beforeend", `<span class="ok-msg">✓ Pedido #${res.pedido_id} guardado</span>`
    );
    btn.textContent = "Guardado";
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Confirmar pedido";
    alert(`Error guardando el pedido: ${e.message}`);
  }
}

function renderGrupo(proveedor, productos) {
  const el = document.createElement("div");
  el.className = "grupo";
  const filas = productos.map((p) => `
    <tr data-sku="${p.sku}" data-nombre="${(p.nombre || "").replace(/"/g, "&quot;")}">
      <td>${p.sku}</td>
      <td>${p.nombre || "—"}</td>
      <td>
        <input type="checkbox" class="chk-destino" data-destino="deposito" ${p.a_reponer_deposito > 0 ? "checked" : ""}>
        <input type="number" class="qty-destino" data-destino="deposito" data-sugerida="${p.a_reponer_deposito || 0}"
               value="${p.a_reponer_deposito || 0}" min="0">
        <div class="hint">stock hoy: ${p.stock_deposito_hoy}</div>
      </td>
      <td>
        <input type="checkbox" class="chk-destino" data-destino="full_pret" ${p.a_reponer_full_pret > 0 ? "checked" : ""}>
        <input type="number" class="qty-destino" data-destino="full_pret" data-sugerida="${p.a_reponer_full_pret || 0}"
               value="${p.a_reponer_full_pret || 0}" min="0">
        <div class="hint">stock hoy: ${p.stock_full_pret_hoy}</div>
      </td>
      <td>
        <input type="checkbox" class="chk-destino" data-destino="full_lavan" ${p.a_reponer_full_lavan > 0 ? "checked" : ""}>
        <input type="number" class="qty-destino" data-destino="full_lavan" data-sugerida="${p.a_reponer_full_lavan || 0}"
               value="${p.a_reponer_full_lavan || 0}" min="0">
        <div class="hint">stock hoy: ${p.stock_full_lavan_hoy}</div>
      </td>
    </tr>`).join("");

  el.innerHTML = `
    <h2>📦 ${proveedor} — ${productos.length} SKUs</h2>
    <table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Depósito</th><th>Full Pret</th><th>Full Lavan</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <div class="grupo-acciones">
      <button class="secondary btn-pdf">⬇ Descargar PDF</button>
      <button class="btn-confirmar">Confirmar pedido</button>
    </div>
  `;

  el.querySelector(".btn-pdf").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas habilitadas con cantidad > 0.");
    generarPDF(proveedor, lineas);
  });
  el.querySelector(".btn-confirmar").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas habilitadas con cantidad > 0.");
    confirmarPedido(proveedor, lineas, el);
  });

  return el;
}

function render() {
  if (!items.length) {
    document.getElementById("vacio").style.display = "block";
    return;
  }
  const grupos = agruparPorProveedor(items);
  const cont = document.getElementById("grupos");
  for (const [proveedor, productos] of grupos) {
    cont.appendChild(renderGrupo(proveedor, productos));
  }
}

render();
</script>
</body>
</html>
