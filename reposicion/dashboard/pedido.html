<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F4F0">
<title>Reposición — Carrito</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { padding: 16px 20px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .grupo { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .grupo h2 { margin: 0 0 12px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  input[type=number] { width: 80px; background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  .total-cell { font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-right: 8px; }
  button.secondary { background: var(--campo); border: 1px solid var(--border); color: var(--text); }
  button.link { background: transparent; color: var(--muted); padding: 2px 6px; font-size: 12px; margin: 0; }
  button.link:hover { color: #e57373; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.borrar { background: transparent; border: 1px solid #6b3a3a; color: #e57373; margin: 0; }
  button.borrar:hover:not(:disabled) { background: #2a1a1a; }
  .cabecera-carrito { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grupo-acciones { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grupo-acciones .btn-borrar { margin-left: auto; }
  .ok-msg { color: #6fcf97; font-size: 13px; }
  .grupo-opciones { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .grupo-opciones select { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; margin-left: 6px; }
  .grupo-opciones input.titulo-extra { background: var(--campo); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin-left: 6px; width: 320px; max-width: 100%; }
  .solo-deposito .col-full, .solo-deposito .col-total { display: none; }
  .aviso-pend { font-size: 11px; color: #f0b45a; margin-top: 3px; }
  .aviso-pend.otro { color: var(--muted); }
  #vacio { padding: 40px; text-align: center; color: var(--muted); }
</style>
<link rel="stylesheet" href="tema.css?v=1">
</head>
<body>
<main>
  <div class="cabecera-carrito">
    <h1>🛒 Carrito de reposición</h1>
    <button type="button" id="btnVaciar" class="borrar" hidden>🗑 Vaciar carrito</button>
  </div>
  <div id="vacio" style="display:none">
    El carrito está vacío. Volvé al <a href="index.html" style="color:var(--accent)">tablero</a>, elegí un SKU,
    decidí cantidad para depósito/Full y agregalo al carrito.
  </div>
  <div id="grupos"></div>
</main>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/logo-black-base64.js"></script>
<script src="app.js?v=20261127"></script>
<script>
renderNav("pedido");

// Lo que ya está pedido y sin recibir, por SKU. Un pedido nuevo REEMPLAZA lo pendiente del mismo producto con ese
// proveedor (no suma); lo pedido a otros proveedores se mantiene.
let PENDIENTES = null;   // Map sku → [{proveedor, oc, unidad, falta}]
let PROVEEDORES = [];
const escapar = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function cargarPendientes() {
  try {
    const [pedidos, provs] = await Promise.all([apiFetch("/pedidos"), apiFetch("/proveedores")]);
    const mapa = new Map();
    for (const p of pedidos) {
      if (p.estado !== "enviado" && p.estado !== "recibido_parcial") continue;
      for (const i of p.items || []) {
        const falta = i.cantidad_pedida - (i.cantidad_recibida || 0);
        if (i.recibido_completo || falta <= 0) continue;
        if (!mapa.has(i.sku)) mapa.set(i.sku, []);
        const lista = mapa.get(i.sku), ya = lista.find((x) => x.oc === p.id);
        if (ya) ya.falta += falta; else lista.push({ proveedor: p.proveedor, oc: p.id, unidad: p.unidad_medida, falta });
      }
    }
    PENDIENTES = mapa;
    PROVEEDORES = [...new Set([...provs, ...pedidos.map((p) => p.proveedor)])].filter(Boolean).sort((a, b) => a.localeCompare(b, "es"));
  } catch (e) {
    PENDIENTES = null;
    console.warn("No se pudieron leer los pedidos pendientes", e);
  }
  document.querySelectorAll("#grupos .grupo").forEach((el) => { llenarProveedores(el); pintarAvisos(el); });
}

const textoPend = (x) => `${fmtNum(x.falta)} ${x.unidad === "bultos" ? "bultos" : "u."} (OC ${x.oc})`;
const proveedorElegido = (grupoEl) => grupoEl.querySelector(".sel-proveedor").value;

function llenarProveedores(grupoEl) {
  const sel = grupoEl.querySelector(".sel-proveedor"), actual = sel.value;
  const lista = [...new Set([grupoEl.dataset.proveedor, ...PROVEEDORES])];
  sel.innerHTML = lista.map((p) => `<option ${p === actual ? "selected" : ""}>${escapar(p)}</option>`).join("");
}

// Devuelve los productos de este pedido que reemplazan algo pendiente.
function pintarAvisos(grupoEl) {
  const estado = grupoEl.querySelector(".estado-pend"), reemplazan = [];
  if (grupoEl.dataset.oc) return reemplazan;   // ya confirmado
  estado.textContent = PENDIENTES ? "" : "No pude revisar lo que ya está pedido: si hay pendientes del mismo proveedor, este pedido los reemplaza.";
  const prov = proveedorElegido(grupoEl);
  grupoEl.querySelectorAll("tbody tr[data-sku]").forEach((tr) => {
    const caja = tr.querySelector(".avisos"), lista = PENDIENTES?.get(tr.dataset.sku) || [];
    const conCantidad = (Number(tr.querySelector(".qty-deposito").value) || 0) + (Number(tr.querySelector(".qty-full").value) || 0) > 0;
    const mismos = lista.filter((x) => x.proveedor === prov), otros = lista.filter((x) => x.proveedor !== prov);
    caja.innerHTML = (mismos.length ? `<div class="aviso-pend">Pendiente: ${mismos.map(textoPend).join(" + ")} → ${conCantidad ? "este pedido lo reemplaza" : "sigue igual si queda en 0"}</div>` : "")
      + otros.map((x) => `<div class="aviso-pend otro">También pedido a ${escapar(x.proveedor)}: ${textoPend(x)} (se mantiene)</div>`).join("");
    if (mismos.length && conCantidad) reemplazan.push(`${tr.dataset.sku}: ${mismos.map(textoPend).join(" + ")}`);
  });
  return reemplazan;
}

function agruparPorProveedor(lineas) {
  const grupos = new Map();
  for (const l of lineas) {
    if (!grupos.has(l.proveedor)) grupos.set(l.proveedor, []);
    grupos.get(l.proveedor).push(l);
  }
  return grupos;
}

// Depósito y Full ya no son filas separadas — se juntan en una fila por SKU
// con una columna editable por destino (Full Pret y Full Lavan comparten la
// columna "Full", ver nota en app.js:agruparLineasPorSku), ordenada por
// nombre de producto A-Z.
function agruparPorSku(lineas) {
  const bySku = new Map();
  for (const l of lineas) {
    if (!bySku.has(l.sku)) bySku.set(l.sku, { sku: l.sku, nombre: l.nombre, deposito: null, full: null });
    const g = bySku.get(l.sku);
    if (l.destino === "deposito") g.deposito = l; else g.full = l;
  }
  return Array.from(bySku.values()).sort((a, b) =>
    (a.nombre || "").localeCompare(b.nombre || "", "es", { sensitivity: "base" })
  );
}

function lineasDelGrupo(grupoEl) {
  const lineas = [];
  grupoEl.querySelectorAll("tbody tr[data-sku]").forEach((tr) => {
    const sku = tr.dataset.sku;
    const nombre = tr.dataset.nombre;
    const inpDep = tr.querySelector(".qty-deposito");
    const inpFull = tr.querySelector(".qty-full");
    const qDep = Number(inpDep.value) || 0;
    const qFull = Number(inpFull.value) || 0;
    if (qDep > 0) {
      lineas.push({
        sku, nombre, destino: "deposito", cantidad_pedida: qDep,
        cantidad_sugerida: Number(inpDep.dataset.sugerida || 0),
      });
    }
    if (qFull > 0) {
      lineas.push({
        sku, nombre, destino: inpFull.dataset.destino || "full_pret", cantidad_pedida: qFull,
        cantidad_sugerida: Number(inpFull.dataset.sugerida || 0),
      });
    }
  });
  return lineas;
}

async function confirmarPedido(proveedor, lineas, grupoEl) {
  const reemplazan = pintarAvisos(grupoEl);
  if (reemplazan.length && !confirm(`Este pedido a ${proveedor} REEMPLAZA lo pendiente de ${reemplazan.length} producto${reemplazan.length === 1 ? "" : "s"} (no se suma):\n\n${reemplazan.slice(0, 10).join("\n")}${reemplazan.length > 10 ? `\n… y ${reemplazan.length - 10} más` : ""}\n\nLas cantidades que cargaste son el total que querés recibir. ¿Confirmar?`)) return;
  const btn = grupoEl.querySelector(".btn-confirmar"), btnBorrar = grupoEl.querySelector(".btn-borrar");
  btn.disabled = true;
  btnBorrar.disabled = true;
  btn.textContent = "Guardando…";
  try {
    const res = await apiFetch("/pedidos", {
      method: "POST",
      body: JSON.stringify({
        proveedor, creado_por: getUser(), items: lineas,
        unidad_medida: grupoEl.querySelector(".sel-unidad").value,
        titulo_extra: grupoEl.querySelector(".titulo-extra").value.trim(),
      }),
    });
    // El pedido ya quedó registrado en el servidor — sacamos del carrito
    // local las líneas de este proveedor que se acaban de confirmar.
    const restantes = getCarrito().filter((l) => l.proveedor !== grupoEl.dataset.proveedor);
    setCarrito(restantes);
    grupoEl.querySelector(".grupo-acciones").insertAdjacentHTML(
      "beforeend", `<span class="ok-msg">✓ ${tituloOC(res.pedido_id, proveedor, grupoEl.querySelector(".titulo-extra").value)} guardada</span>`
    );
    btn.textContent = "Guardado";
    grupoEl.dataset.oc = res.pedido_id; // el PDF ya sale con el número de OC
    grupoEl.querySelectorAll("input, select, button.link").forEach((el) => el.disabled = true);
    grupoEl.querySelectorAll(".avisos, .estado-pend").forEach((el) => el.textContent = "");
    btnBorrar.remove();   // ya es un pedido guardado: se maneja desde Pedidos
    actualizarVista();
    cargarPendientes();
  } catch (e) {
    btn.disabled = false;
    btnBorrar.disabled = false;
    btn.textContent = "Confirmar pedido";
    alert(`Error guardando el pedido: ${e.message}`);
  }
}

// Quitar un producto NO vuelve a dibujar el carrito: render() reconstruye todo
// desde localStorage, y las cantidades editadas (y el destino/unidad elegidos)
// solo viven en los inputs, así que se perdían. Acá solo se saca la fila.
function quitarLinea(tr) {
  const sku = tr.dataset.sku;
  quitarLineaCarrito(sku, "deposito");
  quitarLineaCarrito(sku, "full_pret");
  quitarLineaCarrito(sku, "full_lavan");
  const grupoEl = tr.closest(".grupo");
  tr.remove();
  const quedan = grupoEl.querySelectorAll("tbody tr[data-sku]").length;
  if (!quedan) {
    grupoEl.remove();
  } else {
    grupoEl.querySelector("h2").textContent =
      `📦 ${grupoEl.dataset.proveedor} — ${quedan} producto${quedan === 1 ? "" : "s"}`;
  }
  actualizarVista();
}

// Aviso de carrito vacío, botón "Vaciar carrito" y contador del menú, sin volver a dibujar los pedidos.
function actualizarVista() {
  const n = getCarrito().length;
  document.getElementById("vacio").style.display = document.querySelector("#grupos .grupo") ? "none" : "block";
  document.getElementById("btnVaciar").hidden = !n;
  const navLink = document.querySelector('nav a[href="pedido.html"]');
  if (navLink) navLink.textContent = n ? `Carrito (${n})` : "Carrito";
}

function borrarPedido(grupoEl) {
  const n = grupoEl.querySelectorAll("tbody tr[data-sku]").length;
  if (!confirm(`¿Borrar del carrito el pedido a ${grupoEl.dataset.proveedor} (${n} producto${n === 1 ? "" : "s"})?\n\nNo se puede deshacer. Los pedidos ya confirmados no se tocan.`)) return;
  setCarrito(getCarrito().filter((l) => String(l.proveedor) !== grupoEl.dataset.proveedor));
  grupoEl.remove();
  actualizarVista();
}

function vaciarCarrito() {
  // Se quitan solo los pedidos sin confirmar; los ya guardados quedan en pantalla para bajar el PDF.
  const abiertos = [...document.querySelectorAll("#grupos .grupo:not([data-oc])")];
  if (abiertos.some((el) => el.querySelector(".btn-confirmar").disabled)) return alert("Esperá a que termine de guardarse el pedido.");
  if (!confirm(`¿Vaciar el carrito? ${abiertos.length === 1 ? "Se borra 1 pedido" : `Se borran ${abiertos.length} pedidos`} sin confirmar.\n\nNo se puede deshacer. Los pedidos ya confirmados no se tocan.`)) return;
  setCarrito([]);
  abiertos.forEach((el) => el.remove());
  actualizarVista();
}

function renderGrupo(proveedor, lineas) {
  const el = document.createElement("div");
  el.className = "grupo";
  el.dataset.proveedor = proveedor;
  const grupos = agruparPorSku(lineas);
  const filas = grupos.map((g) => {
    const nombre = g.nombre || (g.deposito || g.full)?.nombre || "";
    const totalInicial = (g.deposito?.cantidad || 0) + (g.full?.cantidad || 0);
    return `
    <tr data-sku="${g.sku}" data-nombre="${(nombre || "").replace(/"/g, "&quot;")}">
      <td>${g.sku}</td>
      <td>${nombre || "—"}<div class="avisos"></div></td>
      <td>
        <input type="number" class="qty-deposito" value="${g.deposito ? g.deposito.cantidad : 0}" min="0"
               data-sugerida="${g.deposito?.cantidad_sugerida || 0}">
        <div class="hint">stock: ${fmtNum(g.deposito?.stock_hoy)}</div>
      </td>
      <td class="col-full">
        <input type="number" class="qty-full" value="${g.full ? g.full.cantidad : 0}" min="0"
               data-destino="${g.full?.destino || "full_pret"}" data-sugerida="${g.full?.cantidad_sugerida || 0}">
        <div class="hint">stock: ${fmtNum(g.full?.stock_hoy)}</div>
      </td>
      <td class="total-cell col-total">${totalInicial}</td>
      <td><button class="link btn-quitar">✕ Quitar</button></td>
    </tr>`;
  }).join("");

  el.innerHTML = `
    <h2>📦 ${proveedor} — ${grupos.length} producto${grupos.length === 1 ? "" : "s"}</h2>
    <div class="grupo-opciones">
      <label>Proveedor:
        <select class="sel-proveedor"><option>${escapar(proveedor)}</option></select></label>
      <label>Destino:
        <select class="sel-destino">
          <option value="separar">Separar depósito y Full</option>
          <option value="deposito">Todo a depósito (suma depósito + Full)</option>
        </select></label>
      ${selectorUnidad()}
      <label>Título a mano (opcional):
        <input type="text" class="titulo-extra" maxlength="120" placeholder="ej. Sábanas 1200 hilos" title="Se agrega al título: OC 124 - Proveedor - tu texto"></label>
    </div>
    <div class="aviso-pend estado-pend"></div>
    <table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Depósito</th><th class="col-full">Full</th><th class="col-total">Total</th><th></th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <div class="grupo-acciones">
      <button class="secondary btn-pdf">⬇ Descargar PDF</button>
      <button class="btn-confirmar">Confirmar pedido</button>
      <button type="button" class="borrar btn-borrar">🗑 Borrar pedido</button>
    </div>
  `;

  el.querySelectorAll(".btn-quitar").forEach((btn) => {
    btn.addEventListener("click", () => {
      quitarLinea(btn.closest("tr"));
    });
  });
  el.querySelectorAll(".qty-deposito, .qty-full").forEach((inp) => {
    inp.addEventListener("input", () => {
      const tr = inp.closest("tr");
      const qDep = Number(tr.querySelector(".qty-deposito").value) || 0;
      const qFull = Number(tr.querySelector(".qty-full").value) || 0;
      tr.querySelector(".total-cell").textContent = qDep + qFull;
      pintarAvisos(el);
    });
  });
  el.querySelector(".sel-proveedor").addEventListener("change", () => pintarAvisos(el));
  // "Todo a depósito": la cantidad de Full se suma a la de depósito (la
  // sugerencia de ambos destinos va junta, como si el depósito después
  // repartiera a Full) y la columna Full se oculta. Al volver a "Separar" se
  // restauran las cantidades que había antes de juntar.
  el.querySelector(".sel-destino").addEventListener("change", (e) => {
    const solo = e.target.value === "deposito";
    el.classList.toggle("solo-deposito", solo);
    el.querySelectorAll("tbody tr[data-sku]").forEach((tr) => {
      const inpDep = tr.querySelector(".qty-deposito");
      const inpFull = tr.querySelector(".qty-full");
      if (solo) {
        tr.dataset.depAntes = inpDep.value;
        tr.dataset.fullAntes = inpFull.value;
        inpDep.value = (Number(inpDep.value) || 0) + (Number(inpFull.value) || 0);
        inpDep.dataset.sugeridaAntes = inpDep.dataset.sugerida;
        inpDep.dataset.sugerida = (Number(inpDep.dataset.sugerida) || 0) + (Number(inpFull.dataset.sugerida) || 0);
        inpFull.value = 0;
      } else if (tr.dataset.depAntes !== undefined) {
        inpDep.value = tr.dataset.depAntes;
        inpFull.value = tr.dataset.fullAntes;
        inpDep.dataset.sugerida = inpDep.dataset.sugeridaAntes;
      }
      tr.querySelector(".total-cell").textContent =
        (Number(inpDep.value) || 0) + (Number(inpFull.value) || 0);
    });
  });
  el.querySelector(".btn-pdf").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas con cantidad > 0.");
    generarPDF(proveedorElegido(el), lineas, el.querySelector(".sel-unidad").value, el.dataset.oc || null, el.querySelector(".titulo-extra").value);
  });
  el.querySelector(".btn-confirmar").addEventListener("click", () => {
    const lineas = lineasDelGrupo(el);
    if (!lineas.length) return alert("No hay líneas con cantidad > 0.");
    confirmarPedido(proveedorElegido(el), lineas, el);
  });
  el.querySelector(".btn-borrar").addEventListener("click", () => borrarPedido(el));

  return el;
}

function render() {
  const carrito = getCarrito();
  const cont = document.getElementById("grupos");
  cont.innerHTML = "";
  for (const [proveedor, lineas] of agruparPorProveedor(carrito)) {
    cont.appendChild(renderGrupo(proveedor, lineas));
  }
  actualizarVista();
}

document.getElementById("btnVaciar").addEventListener("click", vaciarCarrito);
render();
if (getCarrito().length) cargarPendientes();
</script>
</body>
</html>
