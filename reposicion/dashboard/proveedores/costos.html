<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costos · Panel de control</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=11">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, guard, nav, qs, peso0, parseMonto, hoy, RUBROS_COSTO, camposRepite, activarRepite, guardarCosto, peso, dolar, camposMoneda, montoEn, actualizarDolar, detalleDolar, ATRIB, camposAtribucion, leerAtribucion, textoAtribucion } from './app.js';
import { graficoSimple, activarTooltips, etqMes, MESN } from './analisis.js?v=5';
const perfil = await guard(['admin', 'dueno']);
// Sub-menús de Costos: cada uno muestra solo los rubros que le corresponden (por nombre del rubro).
const RUBROS = {
  software: { titulo: 'Software', match: /software|suscrip/i, cat: 'Software y suscripciones', tipo: 'fijo' },
  sueldos: { titulo: 'Sueldos', match: /sueldo|cargas sociales|horas extra/i, cat: 'Sueldos y cargas sociales', tipo: 'fijo' },
  servicios: { titulo: 'Servicios', match: /servicio/i, cat: 'Servicios (luz, gas, internet)', tipo: 'fijo' },
  publicidad: { titulo: 'Publicidad', match: /publicidad|marketing|influencer/i, cat: 'Publicidad', tipo: 'variable' },
};
const RUBRO_KEY = RUBROS[qs('rubro')] ? qs('rubro') : null, RUBRO = RUBROS[RUBRO_KEY];
const enRubro = (c) => !RUBRO || RUBRO.match.test(c.categoria || '');
nav(perfil, RUBRO_KEY ? 'costos-' + RUBRO_KEY : 'costos');
const TIPOS = { fijo: { nombre: 'Fijo', color: '#2449B8', chip: 'info' }, variable: { nombre: 'Variable', color: '#E8935A', chip: 'warn' } };
const mesDe = (s) => String(s).slice(0, 7);
const addMes = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, '0')}`; };
const nom = (ym) => `${MESN[Number(ym.slice(5)) - 1]} ${ym.slice(0, 4)}`;
const Nom = (ym) => nom(ym).charAt(0).toUpperCase() + nom(ym).slice(1);
const pct = (v, base) => (base > 0 ? (v / base * 100).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—');
let filas = [], ventas = {}, reglas = [], mes = hoy().slice(0, 7), editId = null, borrarId = null, msg = '';
let accion = null, msgRec = ''; // accion = { id, que: 'monto' | 'fin' | 'borrar' } sobre un costo que se repite
const MES_ACTUAL = hoy().slice(0, 7);
let tab = ['fijo', 'variable'].includes(qs('tipo')) ? qs('tipo') : 'all';

async function cargar() {
  const { data } = await sb.from('cc_costos').select('*').order('periodo').order('id').limit(5000);
  filas = (data || []).filter(enRubro).map((f) => ({ ...f, ym: mesDe(f.periodo), monto: Number(f.monto) }));
}
// Ventas por mes (todos los canales) del scorecard, para mostrar cada costo como % de lo vendido.
async function cargarVentas() {
  const { data } = await sb.from('v_scorecard_mensual').select('periodo,ventas');
  ventas = {};
  for (const r of data || []) if (r.ventas != null) ventas[mesDe(r.periodo)] = (ventas[mesDe(r.periodo)] || 0) + Number(r.ventas);
}
// Reparto del mes por marca/canal/área (v_costos_atribucion: mix por ventas del mes, áreas en partes iguales).
let reparto = [];
async function cargarReparto() {
  const { data } = await sb.from('v_costos_atribucion').select('costo_id,marca,canal,area,monto,por_ventas').eq('periodo', mes + '-01').limit(10000);
  reparto = (data || []).map((r) => ({ ...r, monto: Number(r.monto) }));
}
const recargar = async () => { await Promise.all([cargar(), cargarReglas()]); await cargarReparto(); pintar(); };
// Costos que se repiten: definiciones en cc_costos_recurrentes; cada mes se carga en cc_costos (cc_costos_al_dia).
async function cargarReglas() {
  const { data } = await sb.from('cc_costos_recurrentes').select('*').order('desde').order('id');
  reglas = (data || []).filter(enRubro).map((r) => ({ ...r, monto: Number(r.monto), d: mesDe(r.desde), h: r.hasta ? mesDe(r.hasta) : null }));
}
await actualizarDolar(); // dólar oficial para los costos en USD (antes de cargar los meses que se repiten)
await sb.rpc('cc_costos_al_dia'); // carga los meses que falten hasta el mes en curso (si falla, la pantalla sigue andando)
// Extras de cada sub-menú: Sueldos (equipo y adelantos), Publicidad (inversión en ads del scorecard).
let equipo = [], adelantos = [], adsMes = {};
async function cargarExtras() {
  if (RUBRO_KEY === 'sueldos') {
    const [{ data: eq }, { data: ad }] = await Promise.all([
      sb.from('cc_equipo').select('area,sueldo,activo').eq('activo', true),
      sb.from('cc_adelantos_sueldo').select('fecha,empleado,monto,descuenta_mes').order('fecha', { ascending: false }).limit(500),
    ]);
    equipo = eq || []; adelantos = ad || [];
  }
  if (RUBRO_KEY === 'publicidad') {
    const { data } = await sb.from('v_scorecard_ads_mensual').select('periodo,plataforma,inversion');
    adsMes = {}; for (const r of data || []) if (r.inversion != null) { const k = mesDe(r.periodo); (adsMes[k] ||= {}); adsMes[k][r.plataforma] = (adsMes[k][r.plataforma] || 0) + Number(r.inversion); }
  }
}
function extras() {
  if (RUBRO_KEY === 'sueldos') {
    const masa = equipo.reduce((a, p) => a + Number(p.sueldo || 0), 0), cargado = total(mes);
    const delMes = adelantos.filter((a) => a.descuenta_mes.slice(0, 7) === mes), dados = adelantos.filter((a) => a.fecha.slice(0, 7) === mes);
    return `<div class="grid dos" style="margin-top:16px">
      <div class="cc-card"><div class="cc-label">Sueldos según Equipo</div><div class="cc-valor md num">${peso0(masa)}</div><div class="cc-sub">${equipo.length} personas activas · cargado en Costos este mes: ${peso0(cargado)}${masa && cargado ? ` (${Math.round(cargado / masa * 100)}%)` : ''} · <a href="equipo.html">ver Equipo</a></div></div>
      <div class="cc-card"><div class="cc-label">Adelantos de sueldo</div><div class="cc-valor md num">${peso0(delMes.reduce((a, x) => a + Number(x.monto), 0))}</div><div class="cc-sub">se descuentan del sueldo de ${nom(mes)}${dados.length ? ` · dados en ${nom(mes)}: ${dados.map((x) => esc(x.empleado.split(' ')[0]) + ' ' + peso0(x.monto)).join(', ')}` : ''} · <a href="nuevo.html?vista=adelanto">cargar adelanto</a></div></div></div>`;
  }
  if (RUBRO_KEY === 'publicidad') {
    const a = adsMes[mes] || {}, plat = [['meta', 'Meta Ads'], ['google', 'Google Ads'], ['ml', 'Mercado Libre Ads']], tot = plat.reduce((x, [k]) => x + (a[k] || 0), 0);
    return `<section class="card" style="margin-top:16px"><div class="row between wrapRow"><h2 style="margin:0">Inversión en anuncios · ${nom(mes)}</h2><span class="muted small">del scorecard, ambas marcas · total ${peso0(tot)}</span></div>
      <div class="centro-comando" style="margin:12px 0 0">${plat.map(([k, n]) => `<div class="cc-card"><div class="cc-label">${n}</div><div class="cc-valor md num">${a[k] != null ? peso0(a[k]) : '—'}</div></div>`).join('')}</div>
      <p class="cc-nota">Esta inversión ya entra sola en el P&amp;L y el cashflow. Acá cargá solo lo demás (agencia, influencers, producción de contenido) para no contarla dos veces.</p></section>`;
  }
  return '';
}
await Promise.all([cargar(), cargarVentas(), cargarReglas(), cargarExtras(), cargarReparto()]);
const total = (ym, t = 'all') => filas.filter((f) => f.ym === ym && (t === 'all' || f.tipo === t)).reduce((a, f) => a + f.monto, 0);

function pintar() {
  const delMes = filas.filter((f) => f.ym === mes), vtas = ventas[mes] || 0;
  const tot = total(mes), fij = total(mes, 'fijo'), vari = total(mes, 'variable');
  const prev = total(addMes(mes, -1)), var_ = prev > 0 ? ((tot / prev) - 1) * 100 : null;
  const porCat = Object.entries(delMes.reduce((o, f) => ((o[f.categoria] = (o[f.categoria] || 0) + f.monto), o), {})).sort((a, b) => b[1] - a[1]);
  const visibles = delMes.filter((f) => tab === 'all' || f.tipo === tab).sort((a, b) => a.tipo.localeCompare(b.tipo) || b.monto - a.monto);
  const totVis = visibles.reduce((a, f) => a + f.monto, 0);
  const doce = Array.from({ length: 12 }, (_, i) => addMes(mes, i - 11)), serie = doce.map((m) => ({ mes: m, etq: etqMes(m), valor: total(m, tab) }));
  const e = editId ? filas.find((f) => f.id === editId) : null;
  const tipoForm = e?.tipo || (tab === 'variable' ? 'variable' : tab === 'fijo' ? 'fijo' : RUBRO?.tipo || 'fijo');
  const todasCats = [...new Set([...RUBROS_COSTO.fijo, ...RUBROS_COSTO.variable, ...filas.map((f) => f.categoria)])];
  const subVentas = vtas > 0 ? `de las ventas (${peso0(vtas)})` : 'de las ventas';
  const seg = [['all', 'Todos'], ['fijo', 'Fijos'], ['variable', 'Variables']].map(([k, t]) => `<button type="button" data-tab="${k}" aria-pressed="${tab === k}">${t}</button>`).join('');
  $('#app').innerHTML = `<div class="cabecera"><div><h1>Costos${RUBRO ? ' · ' + RUBRO.titulo : ''} · ${Nom(mes)}</h1><p>${RUBRO ? `Rubros de ${RUBRO.titulo.toLowerCase()} · <a href="costos.html">ver todos los costos</a>` : 'Fijos: no dependen de cuánto vendés. Variables: suben y bajan con cada venta.'}</p></div>
    <div class="row wrapRow"><button class="btn" id="ant" aria-label="Mes anterior">‹</button><input type="month" id="mes" value="${mes}" style="width:auto" aria-label="Mes"><button class="btn" id="sig" aria-label="Mes siguiente">›</button>
    <a class="btn primary" href="#nuevo-costo" id="irNuevo">＋ Nuevo costo</a></div></div>
  ${avisoVencen()}
  ${extras()}
  <div class="centro-comando">
    <div class="cc-card"><div class="cc-label">Total costos</div><div class="cc-valor num">${peso0(tot)}</div><div class="cc-sub"><span>${pct(tot, vtas)} ${subVentas}</span>${var_ == null ? '' : `<span>${var_ >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(var_))}% vs ${nom(addMes(mes, -1))}</span>`}</div></div>
    <div class="cc-card"><div class="cc-label">Fijos</div><div class="cc-valor num">${peso0(fij)}</div><div class="cc-sub">${pct(fij, vtas)} de las ventas</div></div>
    <div class="cc-card"><div class="cc-label">Variables</div><div class="cc-valor num">${peso0(vari)}</div><div class="cc-sub">${pct(vari, vtas)} de las ventas</div></div>
    <div class="cc-card"><div class="cc-label">Mayor rubro del mes</div><div class="cc-valor md">${porCat[0] ? esc(porCat[0][0]) : '—'}</div><div class="cc-sub">${porCat[0] ? `${peso0(porCat[0][1])} · ${Math.round((porCat[0][1] / tot) * 100)}% del total` : 'nada cargado'}</div></div>
  </div>
  <section class="card tabla"><div class="cab"><div><h2>Detalle del mes</h2><span class="muted">${vtas > 0 ? `% sobre las ventas de ${nom(mes)} del scorecard` : 'Sin ventas del scorecard este mes para calcular el %'}</span></div>
    <div class="seg gris" role="group" aria-label="Tipo de costo">${seg}</div></div>
    <div class="scroll">${visibles.length ? `<table><thead><tr><th scope="col">Rubro</th><th scope="col">Tipo</th><th scope="col">Detalle</th><th scope="col" class="r">Importe</th><th scope="col" class="r">% ventas</th><th scope="col"><span class="muted" style="font-weight:400">&nbsp;</span></th></tr></thead><tbody>
    ${visibles.map((f) => `<tr><th scope="row">${esc(f.categoria)}${f.recurrente_id ? ' <span class="chip" title="Se carga solo todos los meses">se repite</span>' : ''}</th><td><span class="chip cuadro ${TIPOS[f.tipo].chip}">${TIPOS[f.tipo].nombre}</span></td><td>${esc(f.concepto || '')}${atribHTML(f)}${f.nota ? `<div class="small muted">${esc(f.nota)}</div>` : ''}</td>
      <td class="r num"><b>${peso0(f.monto)}</b>${detalleDolar(f)}</td><td class="r num muted">${pct(f.monto, vtas)}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-ed="${f.id}">Editar</button> <button class="btn sm danger" data-del="${f.id}">${borrarId === f.id ? '¿Seguro? Borrar' : 'Borrar'}</button></td></tr>`).join('')}
    <tr class="total"><th scope="row">Total</th><td></td><td></td><td class="r num">${peso0(totVis)}</td><td class="r num muted">${pct(totVis, vtas)}</td><td></td></tr></tbody></table>`
    : `<p class="muted" style="padding:0 24px 12px">Todavía no hay costos ${tab === 'fijo' ? 'fijos ' : tab === 'variable' ? 'variables ' : ''}cargados en ${nom(mes)}.</p>`}</div></section>
  ${seccionReparto(new Set(visibles.map((f) => f.id)))}
  ${seccionRecurrentes()}
  <div class="card chart"><h2 style="margin-top:0">Últimos 12 meses${tab === 'all' ? '' : ` · ${tab === 'fijo' ? 'fijos' : 'variables'}`} <span class="muted small" style="font-weight:400">(tocá una columna para ver ese mes)</span></h2>${serie.some((s) => s.valor > 0) ? graficoSimple(serie, tab === 'all' ? '#3A3F47' : TIPOS[tab].color, mes) : '<p class="muted">El gráfico aparece cuando haya costos cargados en alguno de estos 12 meses.</p>'}</div>
  <section class="card" id="nuevo-costo"><h2 style="margin-top:0">${e ? 'Editar costo' : 'Cargar un costo'}</h2>
    <div class="muted small">Lo que se paga todos los meses (fijos) o lo que cambia según lo que se vende (variables).</div>
    <div class="campos">
      <div><label for="tipo">Tipo</label><select id="tipo"><option value="fijo" ${tipoForm === 'fijo' ? 'selected' : ''}>Fijo</option><option value="variable" ${tipoForm === 'variable' ? 'selected' : ''}>Variable</option></select></div>
      <div><label for="cat">Rubro</label><input id="cat" list="cats" placeholder="Elegí o escribí uno nuevo" value="${esc(e?.categoria || RUBRO?.cat || '')}"><datalist id="cats">${todasCats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div><label for="con">Detalle (opcional)</label><input id="con" placeholder="Ej.: Alquiler local + depósito" value="${esc(e?.concepto || '')}"></div>
      <div><label for="monto">Importe</label><div class="row" style="gap:8px">${camposMoneda(e?.moneda)}<input id="monto" inputmode="decimal" placeholder="1.250.000,00" value="${e ? String(e.moneda === 'USD' ? e.monto_usd : e.monto).replace('.', ',') : ''}"></div>
        <div class="small muted" id="monedaAyuda" ${e?.moneda === 'USD' ? '' : 'hidden'}>Se pasa a pesos con el dólar oficial (Banco Nación, venta) del día 1 de cada mes.</div></div>
      <div><label for="per">${e ? 'Mes' : 'Mes (o primer mes)'}</label><input type="month" id="per" value="${e ? e.ym : mes}"></div>
      ${e ? '' : camposRepite(tipoForm, mes)}
      <div class="${e ? '' : 'ancho'}"><label for="nota">Nota (opcional)</label><input id="nota" value="${esc(e?.nota || '')}"></div>
      <div class="ancho"><div class="small" style="font-weight:600;margin:4px 0 8px">¿De qué es este costo?</div>${camposAtribucion(e || {})}
        <p class="muted small" style="margin:-4px 0 12px">Si tildás varias marcas o canales, el costo se reparte según lo que vendió cada uno ese mes. Entre áreas, en partes iguales.</p></div>
    </div>
    ${e?.recurrente_id ? '<p class="cc-nota">Este costo se repite todos los meses: acá cambiás solo este mes. Para cambiar el monto de acá en adelante usá "Cambiar monto" en Costos que se repiten.</p>' : ''}
    <div class="pie"><p class="err">${esc(msg)}</p>${e ? '<button class="btn" id="cancelar">Cancelar</button>' : ''}<button class="btn primary" id="guardar">${e ? 'Guardar cambios' : 'Guardar'}</button></div>
  </section>
  <p class="muted small" style="line-height:1.6">Las ventas para calcular los porcentajes salen del scorecard (Tienda Nube, Mercado Libre y local, ambas marcas).</p>`;
  const ir = async (m) => { mes = m; editId = null; msg = ''; await cargarReparto(); pintar(); };
  $('#ant').onclick = () => ir(addMes(mes, -1)); $('#sig').onclick = () => ir(addMes(mes, 1)); $('#mes').onchange = (ev) => ev.target.value && ir(ev.target.value);
  $$('rect.hit[data-mes]').forEach((r) => (r.onclick = () => ir(r.dataset.mes)));
  $$('[data-tab]').forEach((b) => (b.onclick = () => {
    tab = b.dataset.tab; const u = new URL(location.href);
    tab === 'all' ? u.searchParams.delete('tipo') : u.searchParams.set('tipo', tab); history.replaceState(null, '', u);
    pintar();
  }));
  $('#guardar').onclick = guardar; if ($('#cancelar')) $('#cancelar').onclick = () => { editId = null; msg = ''; pintar(); };
  $('#moneda').onchange = () => ($('#monedaAyuda').hidden = $('#moneda').value !== 'USD');
  if (!e) { activarRepite(); $('#tipo').onchange = () => { $('#rep').value = $('#tipo').value === 'fijo' ? 'siempre' : 'no'; $('#rep').onchange(); }; }
  activarRecurrentes();
  $$('[data-ed]').forEach((b) => (b.onclick = () => { editId = +b.dataset.ed; msg = ''; pintar(); $('#nuevo-costo').scrollIntoView(); }));
  $$('[data-del]').forEach((b) => (b.onclick = async () => { const i = +b.dataset.del; if (borrarId !== i) { borrarId = i; pintar(); return; } await sb.from('cc_costos').delete().eq('id', i); borrarId = null; await recargar(); }));
}
async function guardar() {
  const tipo = $('#tipo').value, categoria = $('#cat').value.trim(), monto = parseMonto($('#monto').value), per = $('#per').value;
  if (!categoria) { msg = 'Elegí o escribí el rubro.'; return pintar(); }
  if (!(monto >= 0) || !$('#monto').value.trim()) { msg = 'Poné un importe válido (ej. 1.250.000,50).'; return pintar(); }
  if (!per) { msg = 'Elegí el mes.'; return pintar(); }
  const atrib = leerAtribucion();
  if (atrib.error) { msg = atrib.error; return pintar(); }
  const concepto = $('#con').value.trim() || null, nota = $('#nota').value.trim() || null, moneda = $('#moneda').value;
  const { error } = editId
    ? await sb.from('cc_costos').update({ tipo, categoria, concepto, ...montoEn(moneda, monto), ...atrib, periodo: per + '-01', nota }).eq('id', editId)
    : await guardarCosto({ tipo, categoria, concepto, monto, mes: per, nota, moneda, atrib });
  if (error) { msg = 'No se pudo guardar: ' + error.message; return pintar(); }
  msg = ''; editId = null; mes = per; await recargar();
}

// ---- Atribución: texto bajo el detalle y reparto del mes por marca/canal y por área ----
const atribHTML = (c) => { const t = textoAtribucion(c); return t ? `<div class="small" style="color:var(--brand-hover)">${esc(t)}</div>` : ''; };
function seccionReparto(ids) {
  const xs = reparto.filter((r) => ids.has(r.costo_id)), tot = xs.reduce((a, r) => a + r.monto, 0);
  if (!xs.length || !(tot > 0)) return '';
  const suma = (fn) => xs.reduce((o, r) => ((o[fn(r)] = (o[fn(r)] || 0) + r.monto), o), {});
  const porCanal = suma((r) => r.marca + '|' + r.canal), porArea = suma((r) => r.area);
  const filas = (pares) => pares.filter(([, v]) => v >= 0.5).map(([t, v]) => `<tr><th scope="row">${t}</th><td class="r num"><b>${peso0(v)}</b></td><td class="r num muted">${pct(v, tot)}</td></tr>`).join('');
  const canalPares = Object.keys(ATRIB.marcas.ops).flatMap((m) => Object.keys(ATRIB.canales.ops).map((c) => [`${ATRIB.marcas.ops[m]} · ${ATRIB.canales.ops[c]}`, porCanal[m + '|' + c] || 0]));
  const areaPares = Object.entries(ATRIB.areas.ops).map(([k, t]) => [t, porArea[k] || 0]);
  const iguales = new Set(xs.filter((r) => !r.por_ventas).map((r) => r.costo_id)).size;
  const tabla = (titulo, pares) => `<div><h3 style="margin:0 0 8px;font-size:15px">${titulo}</h3><table><tbody>${filas(pares)}</tbody></table></div>`;
  return `<section class="card"><div class="row between wrapRow"><h2 style="margin:0">Reparto del mes</h2><span class="muted small">${peso0(tot)} · lo que es de varias marcas o canales se reparte por las ventas de ${nom(mes)}; entre áreas, en partes iguales</span></div>
    <div class="grid dos" style="margin-top:12px">${tabla('Por marca y canal', canalPares)}${tabla('Por área', areaPares)}</div>
    ${iguales ? `<p class="cc-nota">${iguales} ${iguales === 1 ? 'costo se repartió' : 'costos se repartieron'} en partes iguales porque esas marcas y canales todavía no tienen ventas cargadas en ${nom(mes)}.</p>` : ''}</section>`;
}

// ---- Costos que se repiten: aviso de los que terminan pronto, lista y acciones ----
const terminaPronto = (r) => r.h && r.h >= MES_ACTUAL && r.h <= addMes(MES_ACTUAL, 2);
function avisoVencen() {
  const xs = reglas.filter(terminaPronto);
  if (!xs.length) return '';
  return `<div class="card" style="background:#FDF0E6;border-color:#F3C9A6;color:#7A3A0A;margin:20px 0 0;padding:14px 20px">
    <b>Costos que terminan pronto:</b> ${xs.map((r) => `${esc(r.categoria)}${r.concepto ? ' (' + esc(r.concepto) + ')' : ''} · último mes ${nom(r.h)}`).join(' · ')}</div>`;
}
function estadoRegla(r) {
  if (r.d > MES_ACTUAL) return `<span class="chip cuadro info">Empieza en ${nom(r.d)}</span>`;
  if (!r.h) return '<span class="chip cuadro ok">Sin fin</span>';
  if (r.h < MES_ACTUAL) return '<span class="chip cuadro">Terminado</span>';
  return terminaPronto(r) ? `<span class="chip cuadro warn">Termina en ${nom(r.h)}</span>` : `<span class="chip cuadro ok">Hasta ${nom(r.h)}</span>`;
}
function filaAccion(r) {
  if (!accion || accion.id !== r.id) return '';
  const n = filas.filter((f) => f.recurrente_id === r.id).length;
  const campo = accion.que === 'monto'
    ? `<div><label for="accMonto">Monto nuevo por mes</label><div class="row" style="gap:8px">${camposMoneda(r.moneda, 'accMoneda')}<input id="accMonto" inputmode="decimal" placeholder="1.250.000,00" style="max-width:220px"></div></div>
       <div><label for="accMes">Desde</label><input type="month" id="accMes" value="${r.d > MES_ACTUAL ? r.d : MES_ACTUAL}" style="width:auto"></div>
       <p class="muted small" style="margin:0 0 12px">Los meses anteriores quedan con el monto de antes.</p>`
    : accion.que === 'fin'
      ? `<div><label for="accMes">Último mes que se paga</label><input type="month" id="accMes" value="${r.d > MES_ACTUAL ? r.d : MES_ACTUAL}" style="width:auto"></div>
         <p class="muted small" style="margin:0 0 12px">Se borran los meses ya cargados después de ese mes.</p>`
      : accion.que === 'reparto'
        ? `<div style="flex:1 1 100%">${camposAtribucion(r, 'ac')}<p class="muted small" style="margin:0 0 12px">Se aplica a todos los meses ya cargados de este costo y a los que vengan.</p></div>`
      : `<p style="margin:0 0 12px"><b>¿Borrar este costo y sus ${n} ${n === 1 ? 'mes cargado' : 'meses cargados'}?</b> <span class="muted small">Usalo si se cargó por error; si dejó de pagarse, mejor "Terminar".</span></p>`;
  return `<tr><td colspan="8" style="background:#FAF9F6"><div class="row wrapRow" style="align-items:flex-end;gap:12px">${campo}
    <div class="row" style="gap:8px;margin-bottom:12px"><button class="btn sm" data-acc-cancel>Cancelar</button><button class="btn sm ${accion.que === 'borrar' ? 'danger' : 'primary'}" data-acc-ok>${accion.que === 'monto' ? 'Guardar monto' : accion.que === 'fin' ? 'Terminar' : accion.que === 'reparto' ? 'Guardar reparto' : 'Sí, borrar'}</button></div></div>
    ${msgRec ? `<p class="err" style="margin:0 0 8px">${esc(msgRec)}</p>` : ''}</td></tr>`;
}
function filaRegla(r) {
  const vigente = !r.h || r.h >= MES_ACTUAL;
  return `<tr><th scope="row">${esc(r.categoria)}</th><td><span class="chip cuadro ${TIPOS[r.tipo].chip}">${TIPOS[r.tipo].nombre}</span></td><td>${esc(r.concepto || '')}${atribHTML(r)}${r.nota ? `<div class="small muted">${esc(r.nota)}</div>` : ''}</td>
    <td class="r num">${r.moneda === 'USD' ? `<b>${dolar(r.monto_usd)}</b><div class="small muted">≈ ${peso0(r.monto)} con el dólar de hoy (${peso(r.cotizacion)}); cada mes se convierte con el del día 1</div>` : `<b>${peso0(r.monto)}</b>`}</td><td>${nom(r.d)}</td><td>${r.h ? nom(r.h) : 'sin fin'}</td><td>${estadoRegla(r)}</td>
    <td class="r" style="white-space:nowrap">${vigente ? `<button class="btn sm" data-acc="monto" data-id="${r.id}">Cambiar monto</button> <button class="btn sm" data-acc="fin" data-id="${r.id}">Terminar</button> ` : ''}<button class="btn sm" data-acc="reparto" data-id="${r.id}">Reparto</button> <button class="btn sm danger" data-acc="borrar" data-id="${r.id}">Borrar</button></td></tr>${filaAccion(r)}`;
}
function seccionRecurrentes() {
  const vis = reglas.filter((r) => tab === 'all' || r.tipo === tab);
  const vigentes = vis.filter((r) => !r.h || r.h >= MES_ACTUAL), terminados = vis.filter((r) => r.h && r.h < MES_ACTUAL);
  const cab = '<thead><tr><th scope="col">Rubro</th><th scope="col">Tipo</th><th scope="col">Detalle</th><th scope="col" class="r">Por mes</th><th scope="col">Desde</th><th scope="col">Hasta</th><th scope="col">Estado</th><th scope="col"></th></tr></thead>';
  const totalMes = vigentes.filter((r) => r.d <= MES_ACTUAL).reduce((a, r) => a + r.monto, 0);
  return `<section class="card tabla"><div class="cab"><div><h2>Costos que se repiten</h2><span class="muted">Se cargan solos cada mes${vigentes.length ? ` · hoy suman ${peso0(totalMes)} por mes` : ''}</span></div></div>
    <div class="scroll">${vigentes.length ? `<table style="min-width:900px">${cab}<tbody>${vigentes.map(filaRegla).join('')}</tbody></table>`
      : '<p class="muted" style="padding:0 24px 12px">Todavía no hay costos que se repitan. Al cargar un costo elegí "Se repite: todos los meses".</p>'}
    ${terminados.length ? `<details style="padding:4px 24px 12px"><summary class="muted small" style="cursor:pointer">Terminados (${terminados.length})</summary><table style="min-width:900px">${cab}<tbody>${terminados.map(filaRegla).join('')}</tbody></table></details>` : ''}</div></section>`;
}
function activarRecurrentes() {
  $$('[data-acc]').forEach((b) => (b.onclick = () => { accion = { id: +b.dataset.id, que: b.dataset.acc }; msgRec = ''; pintar(); }));
  const cancel = $('[data-acc-cancel]'); if (cancel) cancel.onclick = () => { accion = null; msgRec = ''; pintar(); };
  const ok = $('[data-acc-ok]'); if (!ok) return;
  ok.onclick = async () => {
    let res;
    if (accion.que === 'monto') {
      const m = parseMonto($('#accMonto').value), d = $('#accMes').value;
      if (!$('#accMonto').value.trim() || !(m >= 0)) { msgRec = 'Poné un monto válido (ej. 1.250.000,50).'; return pintar(); }
      if (!d) { msgRec = 'Elegí desde qué mes.'; return pintar(); }
      res = await sb.rpc('cc_costo_recurrente_cambiar_monto', { p_id: accion.id, p_desde: d + '-01', p_monto: m, p_moneda: $('#accMoneda').value });
      if (!res.error) res = await sb.rpc('cc_costos_al_dia');
    } else if (accion.que === 'fin') {
      const d = $('#accMes').value;
      if (!d) { msgRec = 'Elegí el último mes.'; return pintar(); }
      res = await sb.rpc('cc_costo_recurrente_terminar', { p_id: accion.id, p_ultimo: d + '-01' });
    } else if (accion.que === 'reparto') {
      const at = leerAtribucion('ac');
      if (at.error) { msgRec = at.error; return pintar(); }
      res = await sb.from('cc_costos_recurrentes').update(at).eq('id', accion.id);
      if (!res.error) res = await sb.from('cc_costos').update(at).eq('recurrente_id', accion.id);
    } else {
      res = await sb.from('cc_costos_recurrentes').delete().eq('id', accion.id);
    }
    if (res.error) { msgRec = 'No se pudo: ' + res.error.message; return pintar(); }
    accion = null; msgRec = ''; await recargar();
  };
}
activarTooltips();
pintar();
</script>
