<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costos · Panel de control</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=8">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, guard, nav, qs, peso0, parseMonto, hoy, RUBROS_COSTO } from './app.js';
import { graficoSimple, activarTooltips, etqMes, MESN } from './analisis.js?v=5';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'costos');
const TIPOS = { fijo: { nombre: 'Fijo', color: '#2449B8', chip: 'info' }, variable: { nombre: 'Variable', color: '#E8935A', chip: 'warn' } };
const mesDe = (s) => String(s).slice(0, 7);
const addMes = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, '0')}`; };
const nom = (ym) => `${MESN[Number(ym.slice(5)) - 1]} ${ym.slice(0, 4)}`;
const Nom = (ym) => nom(ym).charAt(0).toUpperCase() + nom(ym).slice(1);
const pct = (v, base) => (base > 0 ? (v / base * 100).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—');
let filas = [], ventas = {}, mes = hoy().slice(0, 7), editId = null, borrarId = null, msg = '';
let tab = ['fijo', 'variable'].includes(qs('tipo')) ? qs('tipo') : 'all';

async function cargar() {
  const { data } = await sb.from('cc_costos').select('*').order('periodo').order('id').limit(5000);
  filas = (data || []).map((f) => ({ ...f, ym: mesDe(f.periodo), monto: Number(f.monto) }));
}
// Ventas por mes (todos los canales) del scorecard, para mostrar cada costo como % de lo vendido.
async function cargarVentas() {
  const { data } = await sb.from('v_scorecard_mensual').select('periodo,ventas');
  ventas = {};
  for (const r of data || []) if (r.ventas != null) ventas[mesDe(r.periodo)] = (ventas[mesDe(r.periodo)] || 0) + Number(r.ventas);
}
await Promise.all([cargar(), cargarVentas()]);
const total = (ym, t = 'all') => filas.filter((f) => f.ym === ym && (t === 'all' || f.tipo === t)).reduce((a, f) => a + f.monto, 0);

function pintar() {
  const delMes = filas.filter((f) => f.ym === mes), vtas = ventas[mes] || 0;
  const tot = total(mes), fij = total(mes, 'fijo'), vari = total(mes, 'variable');
  const prev = total(addMes(mes, -1)), var_ = prev > 0 ? ((tot / prev) - 1) * 100 : null;
  const porCat = Object.entries(delMes.reduce((o, f) => ((o[f.categoria] = (o[f.categoria] || 0) + f.monto), o), {})).sort((a, b) => b[1] - a[1]);
  const visibles = delMes.filter((f) => tab === 'all' || f.tipo === tab).sort((a, b) => a.tipo.localeCompare(b.tipo) || b.monto - a.monto);
  const totVis = visibles.reduce((a, f) => a + f.monto, 0);
  const doce = Array.from({ length: 12 }, (_, i) => addMes(mes, i - 11)), serie = doce.map((m) => ({ mes: m, etq: etqMes(m), valor: total(m, tab) }));
  const e = editId ? filas.find((f) => f.id === editId) : null;
  const tipoForm = e?.tipo || (tab === 'variable' ? 'variable' : 'fijo');
  const todasCats = [...new Set([...RUBROS_COSTO.fijo, ...RUBROS_COSTO.variable, ...filas.map((f) => f.categoria)])];
  const fijosPrev = filas.filter((f) => f.ym === addMes(mes, -1) && f.tipo === 'fijo').length, fijosMes = delMes.some((f) => f.tipo === 'fijo');
  const subVentas = vtas > 0 ? `de las ventas (${peso0(vtas)})` : 'de las ventas';
  const seg = [['all', 'Todos'], ['fijo', 'Fijos'], ['variable', 'Variables']].map(([k, t]) => `<button type="button" data-tab="${k}" aria-pressed="${tab === k}">${t}</button>`).join('');
  $('#app').innerHTML = `<div class="cabecera"><div><h1>Costos · ${Nom(mes)}</h1><p>Fijos: no dependen de cuánto vendés. Variables: suben y bajan con cada venta.</p></div>
    <div class="row wrapRow"><button class="btn" id="ant" aria-label="Mes anterior">‹</button><input type="month" id="mes" value="${mes}" style="width:auto" aria-label="Mes"><button class="btn" id="sig" aria-label="Mes siguiente">›</button>
    <a class="btn primary" href="#nuevo-costo" id="irNuevo">＋ Nuevo costo</a></div></div>
  <div class="centro-comando">
    <div class="cc-card"><div class="cc-label">Total costos</div><div class="cc-valor num">${peso0(tot)}</div><div class="cc-sub"><span>${pct(tot, vtas)} ${subVentas}</span>${var_ == null ? '' : `<span>${var_ >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(var_))}% vs ${nom(addMes(mes, -1))}</span>`}</div></div>
    <div class="cc-card"><div class="cc-label">Fijos</div><div class="cc-valor num">${peso0(fij)}</div><div class="cc-sub">${pct(fij, vtas)} de las ventas</div></div>
    <div class="cc-card"><div class="cc-label">Variables</div><div class="cc-valor num">${peso0(vari)}</div><div class="cc-sub">${pct(vari, vtas)} de las ventas</div></div>
    <div class="cc-card"><div class="cc-label">Mayor rubro del mes</div><div class="cc-valor md">${porCat[0] ? esc(porCat[0][0]) : '—'}</div><div class="cc-sub">${porCat[0] ? `${peso0(porCat[0][1])} · ${Math.round((porCat[0][1] / tot) * 100)}% del total` : 'nada cargado'}</div></div>
  </div>
  <section class="card tabla"><div class="cab"><div><h2>Detalle del mes</h2><span class="muted">${vtas > 0 ? `% sobre las ventas de ${nom(mes)} del scorecard` : 'Sin ventas del scorecard este mes para calcular el %'}</span></div>
    <div class="seg gris" role="group" aria-label="Tipo de costo">${seg}</div></div>
    <div class="scroll">${visibles.length ? `<table><thead><tr><th scope="col">Rubro</th><th scope="col">Tipo</th><th scope="col">Detalle</th><th scope="col" class="r">Importe</th><th scope="col" class="r">% ventas</th><th scope="col"><span class="muted" style="font-weight:400">&nbsp;</span></th></tr></thead><tbody>
    ${visibles.map((f) => `<tr><th scope="row">${esc(f.categoria)}</th><td><span class="chip cuadro ${TIPOS[f.tipo].chip}">${TIPOS[f.tipo].nombre}</span></td><td>${esc(f.concepto || '')}${f.nota ? `<div class="small muted">${esc(f.nota)}</div>` : ''}</td>
      <td class="r num"><b>${peso0(f.monto)}</b></td><td class="r num muted">${pct(f.monto, vtas)}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-ed="${f.id}">Editar</button> <button class="btn sm danger" data-del="${f.id}">${borrarId === f.id ? '¿Seguro? Borrar' : 'Borrar'}</button></td></tr>`).join('')}
    <tr class="total"><th scope="row">Total</th><td></td><td></td><td class="r num">${peso0(totVis)}</td><td class="r num muted">${pct(totVis, vtas)}</td><td></td></tr></tbody></table>`
    : `<p class="muted" style="padding:0 24px 12px">Todavía no hay costos ${tab === 'fijo' ? 'fijos ' : tab === 'variable' ? 'variables ' : ''}cargados en ${nom(mes)}.</p>`}</div></section>
  <div class="card chart"><h2 style="margin-top:0">Últimos 12 meses${tab === 'all' ? '' : ` · ${tab === 'fijo' ? 'fijos' : 'variables'}`} <span class="muted small" style="font-weight:400">(tocá una columna para ver ese mes)</span></h2>${serie.some((s) => s.valor > 0) ? graficoSimple(serie, tab === 'all' ? '#3A3F47' : TIPOS[tab].color, mes) : '<p class="muted">El gráfico aparece cuando haya costos cargados en alguno de estos 12 meses.</p>'}</div>
  <section class="card" id="nuevo-costo"><h2 style="margin-top:0">${e ? 'Editar costo' : 'Cargar un costo'}</h2>
    <div class="muted small">Lo que se paga todos los meses (fijos) o lo que cambia según lo que se vende (variables).</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px">
      <div><label for="tipo">Tipo</label><select id="tipo"><option value="fijo" ${tipoForm === 'fijo' ? 'selected' : ''}>Fijo</option><option value="variable" ${tipoForm === 'variable' ? 'selected' : ''}>Variable</option></select></div>
      <div><label for="cat">Rubro</label><input id="cat" list="cats" placeholder="Elegí o escribí uno nuevo" value="${esc(e?.categoria || '')}"><datalist id="cats">${todasCats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div><label for="con">Detalle (opcional)</label><input id="con" placeholder="Ej.: Alquiler local + depósito" value="${esc(e?.concepto || '')}"></div>
      <div><label for="monto">Importe</label><input id="monto" inputmode="decimal" placeholder="1.250.000,00" value="${e ? String(e.monto).replace('.', ',') : ''}"></div>
      <div><label for="per">Mes</label><input type="month" id="per" value="${e ? e.ym : mes}"></div>
      <div><label for="nota">Nota (opcional)</label><input id="nota" value="${esc(e?.nota || '')}"></div>
    </div>
    <p class="err">${esc(msg)}</p>
    <div class="row wrapRow" style="justify-content:flex-end">
      ${!e ? `<button class="btn" id="copiar" ${fijosPrev && !fijosMes ? '' : 'disabled'} title="Copia los costos fijos del mes anterior a ${nom(mes)}">⟳ Copiar fijos de ${nom(addMes(mes, -1))}</button><span class="grow"></span>` : ''}
      ${e ? '<button class="btn" id="cancelar">Cancelar</button>' : ''}<button class="btn primary" id="guardar">${e ? 'Guardar cambios' : 'Guardar'}</button></div>
    ${!e ? `<div class="cc-nota">${fijosMes ? 'Este mes ya tiene costos fijos cargados.' : fijosPrev ? 'Como los fijos se repiten, podés copiar los del mes anterior y después ajustar lo que cambió.' : ''}</div>` : ''}
  </section>
  <p class="muted small" style="line-height:1.6">Las ventas para calcular los porcentajes salen del scorecard (Tienda Nube, Mercado Libre y local, ambas marcas).</p>`;
  const ir = (m) => { mes = m; editId = null; msg = ''; pintar(); };
  $('#ant').onclick = () => ir(addMes(mes, -1)); $('#sig').onclick = () => ir(addMes(mes, 1)); $('#mes').onchange = (ev) => ev.target.value && ir(ev.target.value);
  $$('rect.hit[data-mes]').forEach((r) => (r.onclick = () => ir(r.dataset.mes)));
  $$('[data-tab]').forEach((b) => (b.onclick = () => {
    tab = b.dataset.tab; const u = new URL(location.href);
    tab === 'all' ? u.searchParams.delete('tipo') : u.searchParams.set('tipo', tab); history.replaceState(null, '', u);
    pintar();
  }));
  $('#guardar').onclick = guardar; if ($('#cancelar')) $('#cancelar').onclick = () => { editId = null; msg = ''; pintar(); };
  if ($('#copiar')) $('#copiar').onclick = copiar;
  $$('[data-ed]').forEach((b) => (b.onclick = () => { editId = +b.dataset.ed; msg = ''; pintar(); $('#nuevo-costo').scrollIntoView(); }));
  $$('[data-del]').forEach((b) => (b.onclick = async () => { const i = +b.dataset.del; if (borrarId !== i) { borrarId = i; pintar(); return; } await sb.from('cc_costos').delete().eq('id', i); borrarId = null; await cargar(); pintar(); }));
}
async function guardar() {
  const tipo = $('#tipo').value, categoria = $('#cat').value.trim(), monto = parseMonto($('#monto').value), per = $('#per').value;
  if (!categoria) { msg = 'Elegí o escribí el rubro.'; return pintar(); }
  if (!(monto >= 0) || !$('#monto').value.trim()) { msg = 'Poné un importe válido (ej. 1.250.000,50).'; return pintar(); }
  if (!per) { msg = 'Elegí el mes.'; return pintar(); }
  const row = { tipo, categoria, concepto: $('#con').value.trim() || null, monto, periodo: per + '-01', nota: $('#nota').value.trim() || null };
  const { error } = editId ? await sb.from('cc_costos').update(row).eq('id', editId) : await sb.from('cc_costos').insert(row);
  if (error) { msg = 'No se pudo guardar: ' + error.message; return pintar(); }
  msg = ''; editId = null; mes = per; await cargar(); pintar();
}
async function copiar() {
  const prev = filas.filter((f) => f.ym === addMes(mes, -1) && f.tipo === 'fijo').map((f) => ({ tipo: 'fijo', categoria: f.categoria, concepto: f.concepto, monto: f.monto, periodo: mes + '-01', nota: f.nota }));
  if (!prev.length) return;
  const { error } = await sb.from('cc_costos').insert(prev);
  msg = error ? 'No se pudo copiar: ' + error.message : ''; await cargar(); pintar();
}
activarTooltips();
pintar();
</script>
</body>
</html>
