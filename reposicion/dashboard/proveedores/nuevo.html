<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar · Proveedores</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=11">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, guard, nav, qs, hoy, parseMonto, RUBROS_COSTO, camposRepite, activarRepite, guardarCosto } from './app.js';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'nuevo');
const { data: provs } = await sb.from('cc_proveedores').select('id,nombre,grupo').order('nombre');
const MESN = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const nomMes = (ym) => `${MESN[Number(ym.slice(5)) - 1]} ${ym.slice(0, 4)}`;

// Vista actual: mov (movimiento con un proveedor) · costo (fijo/variable) · adelanto (de sueldo) · prov (proveedor nuevo).
// Los links viejos (proveedor.html → ?proveedor=…&tipo=pago) siguen cayendo en "mov".
let vista = ['mov', 'costo', 'adelanto', 'prov'].includes(qs('vista')) ? qs('vista') : 'mov';

const MENU = [['mov', 'Pago, factura o nota con un proveedor'], ['costo', 'Costo fijo o variable'], ['adelanto', 'Adelanto de sueldo'], ['prov', 'Proveedor nuevo']];
function pintar() {
  $('#app').innerHTML = `<div class="cabecera"><div><h1>Registrar</h1><p>¿Qué querés cargar?</p></div></div>
    <div class="seg" role="group" aria-label="Qué cargar" style="margin:20px 0 16px">${MENU.map(([k, t]) => `<button type="button" aria-pressed="${vista === k}" data-v="${k}">${t}</button>`).join('')}</div>
    <div id="vista"></div>`;
  $$('[data-v]').forEach((b) => (b.onclick = () => { vista = b.dataset.v; pintar(); }));
  ({ mov: vistaMovimiento, costo: vistaCosto, adelanto: vistaAdelanto, prov: vistaProveedor })[vista]();
}

// ---- 1) Movimiento con un proveedor ----
function vistaMovimiento() {
  const tipo0 = qs('tipo') || 'pago';
  $('#vista').innerHTML = `<form class="card" id="f"><h2 style="margin-top:0">Movimiento con un proveedor</h2>
<div class="campos">
<div><label for="prov">Proveedor</label><select id="prov" required><option value="">Elegir…</option>${(provs || []).map((p) => `<option value="${p.id}" ${qs('proveedor') == p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>
<div><label for="tipo">Qué es</label><select id="tipo">${[['pago', 'Pago'], ['comprobante', 'Factura / comprobante'], ['nota_credito', 'Nota de crédito'], ['nota_debito', 'Nota de débito'], ['ajuste', 'Ajuste']].map(([v, t]) => `<option value="${v}" ${v === tipo0 ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
<div id="ajuste" hidden><label for="suma">El ajuste…</label><select id="suma"><option value="resta">Baja lo que debemos</option><option value="suma">Aumenta lo que debemos</option></select></div>
<div><label for="fecha">Fecha</label><input type="date" id="fecha" value="${hoy()}" required></div>
<div><label for="imp">Importe</label><input id="imp" inputmode="decimal" placeholder="1.250.000,00" required></div>
<div id="pago" hidden><label for="medio">Medio de pago</label><select id="medio"><option value="transferencia">Transferencia</option><option value="cheque">Cheque</option><option value="efectivo">Efectivo</option><option value="otro">Otro</option></select></div>
<div id="chq1" hidden><label for="chqnro">N° de cheque</label><input id="chqnro"></div>
<div id="chq2" hidden><label for="chqfec">Fecha de cobro</label><input type="date" id="chqfec"></div>
<div><label id="lnum" for="num">Número de comprobante</label><input id="num"></div>
<div class="ancho"><label for="nota">Nota (opcional)</label><input id="nota"></div>
</div>
<div class="pie"><p class="err" id="err"></p><button class="btn primary" id="ok">Guardar</button></div></form>`;
  const ajustar = () => {
    const t = $('#tipo').value, chq = t === 'pago' && $('#medio').value === 'cheque';
    $('#ajuste').hidden = t !== 'ajuste'; $('#pago').hidden = t !== 'pago'; $('#chq1').hidden = $('#chq2').hidden = !chq;
    $('#lnum').textContent = t === 'pago' ? 'Referencia (opcional)' : 'Número de comprobante';
  };
  $('#tipo').onchange = $('#medio').onchange = ajustar; ajustar();
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#err').textContent = ''; $('#ok').disabled = true;
    const tipo = $('#tipo').value, monto = parseMonto($('#imp').value), prov = $('#prov').value;
    if (!prov || !(monto > 0)) { $('#err').textContent = 'Elegí proveedor e ingresá un importe mayor a 0.'; $('#ok').disabled = false; return; }
    const baja = tipo === 'pago' || tipo === 'nota_credito' || (tipo === 'ajuste' && $('#suma').value === 'resta');
    const etiqueta = { pago: 'PAGO', comprobante: 'FC', nota_credito: 'NC', nota_debito: 'ND', ajuste: 'AJUSTE' }[tipo];
    const num = $('#num').value.trim();
    const row = { proveedor_id: +prov, fecha: $('#fecha').value, tipo, detalle: [etiqueta, num].filter(Boolean).join(' '), numero: num || null, ingreso: baja ? 0 : monto, pago: baja ? monto : 0, nota: $('#nota').value.trim() || null, origen: 'app' };
    if (tipo === 'pago') {
      row.medio_pago = $('#medio').value;
      if (row.medio_pago === 'cheque') { row.cheque_nro = $('#chqnro').value.trim() || null; row.cheque_fecha_cobro = $('#chqfec').value || null; row.cheque_cobrado = false; }
    }
    const { error } = await sb.from('cc_movimientos').insert(row);
    if (error) { $('#err').textContent = error.message; $('#ok').disabled = false; return; }
    $('#ok').textContent = 'Guardado ✓'; setTimeout(() => (location.href = `proveedor.html?id=${prov}`), 600);
  };
}

// ---- 2) Costo fijo o variable ----
let costoTipo = 'fijo', costoMsg = null;
function vistaCosto() {
  const cats = RUBROS_COSTO[costoTipo];
  $('#vista').innerHTML = `<form class="card" id="f"><div class="row between wrapRow"><div><h2 style="margin:0">Costo fijo o variable</h2>
<div class="muted small" style="margin-top:4px">${costoTipo === 'fijo' ? 'Lo que se paga todos los meses sin importar cuánto se venda.' : 'Lo que cambia según lo que se vende o se compra.'}</div></div>
<div class="seg gris" role="group" aria-label="Tipo de costo"><button type="button" aria-pressed="${costoTipo === 'fijo'}" data-t="fijo">Fijo</button><button type="button" aria-pressed="${costoTipo === 'variable'}" data-t="variable">Variable</button></div></div>
<div class="campos">
<div><label for="cat">Rubro</label><input id="cat" list="cats" placeholder="Elegí o escribí uno nuevo" autocomplete="off"><datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>
<div><label for="con">Detalle (opcional)</label><input id="con" placeholder="${costoTipo === 'fijo' ? 'Ej.: Alquiler local + depósito' : 'Ej.: Comisión Mercado Libre'}"></div>
<div><label for="imp">Importe</label><input id="imp" inputmode="decimal" placeholder="1.250.000,00"></div>
<div><label for="per">${costoTipo === 'fijo' ? 'Mes (o primer mes)' : 'Mes'}</label><input type="month" id="per" value="${hoy().slice(0, 7)}"></div>
${camposRepite(costoTipo, hoy().slice(0, 7))}
<div class="ancho"><label for="nota">Nota (opcional)</label><input id="nota"></div>
</div>
<div class="pie"><p class="err" id="err"></p>${costoMsg ? `<p class="ok-t"><b>Guardado ✓</b> ${esc(costoMsg.txt)} · <a href="costos.html?tipo=${costoMsg.tipo}">Ver ${costoMsg.tipo === 'fijo' ? 'costos fijos' : 'costos variables'}</a></p>` : ''}
<button class="btn primary" id="ok">Guardar costo</button></div></form>`;
  $$('[data-t]').forEach((b) => (b.onclick = () => { costoTipo = b.dataset.t; costoMsg = null; vistaCosto(); }));
  activarRepite();
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#err').textContent = ''; costoMsg = null;
    const categoria = $('#cat').value.trim(), monto = parseMonto($('#imp').value), per = $('#per').value;
    if (!categoria) { $('#err').textContent = 'Elegí o escribí el rubro.'; return; }
    if (!$('#imp').value.trim() || !(monto >= 0)) { $('#err').textContent = 'Poné un importe válido (ej. 1.250.000,50).'; return; }
    if (!per) { $('#err').textContent = 'Elegí el mes.'; return; }
    $('#ok').disabled = true;
    const rep = $('#rep').value, hasta = $('#repHasta').value;
    const { error } = await guardarCosto({ tipo: costoTipo, categoria, concepto: $('#con').value.trim() || null, monto, mes: per, nota: $('#nota').value.trim() || null });
    if (error) { $('#err').textContent = 'No se pudo guardar: ' + error.message; $('#ok').disabled = false; return; }
    const cuando = rep === 'no' ? nomMes(per) : rep === 'siempre' ? `todos los meses desde ${nomMes(per)}` : `de ${nomMes(per)} a ${nomMes(hasta)}`;
    costoMsg = { tipo: costoTipo, txt: `${categoria} · ${cuando}` };
    vistaCosto(); // formulario limpio, listo para cargar otro
  };
}

// ---- 3) Adelanto de sueldo ----
// No es un costo extra: sale plata ese día y se descuenta del sueldo del mes elegido (lo usa el Cashflow).
let adelMsg = '';
async function vistaAdelanto() {
  const [{ data: ads }, { data: eq }] = await Promise.all([
    sb.from('cc_adelantos_sueldo').select('*').order('fecha', { ascending: false }).order('id', { ascending: false }).limit(200),
    sb.from('cc_equipo').select('nombre').eq('activo', true),
  ]);
  const lista = ads || [], empleados = [...new Set([...(eq || []).map((p) => p.nombre), ...lista.map((a) => a.empleado)])].sort();
  const peso0 = (n) => Number(n).toLocaleString('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
  const fec = (d) => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4);
  $('#vista').innerHTML = `<form class="card" id="f"><h2 style="margin:0">Adelanto de sueldo</h2>
<div class="muted small" style="margin-top:4px">No suma un gasto: adelanta la salida de plata y se descuenta del sueldo del mes que elijas.</div>
<div class="campos">
<div><label for="emp">Empleado</label><input id="emp" list="emps" autocomplete="off" required><datalist id="emps">${empleados.map((e) => `<option value="${esc(e)}">`).join('')}</datalist></div>
<div><label for="imp">Importe</label><input id="imp" inputmode="decimal" placeholder="150.000,00" required></div>
<div><label for="fecha">Fecha del adelanto</label><input type="date" id="fecha" value="${hoy()}" required></div>
<div><label for="desc">Se descuenta del sueldo de</label><input type="month" id="desc" value="${hoy().slice(0, 7)}" required></div>
<div class="ancho"><label for="nota">Nota (opcional)</label><input id="nota"></div>
</div>
<div class="pie"><p class="err" id="err"></p>${adelMsg ? `<p class="ok-t"><b>Guardado ✓</b> ${esc(adelMsg)}</p>` : ''}<button class="btn primary" id="ok">Guardar adelanto</button></div></form>
<section class="card tabla"><div class="cab"><h2>Últimos adelantos</h2></div><div class="scroll">${lista.length ? `<table><thead><tr><th scope="col">Fecha</th><th scope="col">Empleado</th><th scope="col" class="r">Importe</th><th scope="col">Se descuenta de</th><th scope="col">Nota</th><th scope="col"></th></tr></thead><tbody>
${lista.slice(0, 30).map((a) => `<tr><td class="num">${fec(a.fecha)}</td><th scope="row">${esc(a.empleado)}</th><td class="r num"><b>${peso0(a.monto)}</b></td><td>${nomMes(a.descuenta_mes.slice(0, 7))}</td><td class="muted">${esc(a.nota || '')}</td>
<td class="r"><button type="button" class="btn sm danger" data-borrar="${a.id}">Borrar</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="padding:0 24px 12px">Todavía no hay adelantos cargados.</p>'}</div></section>`;
  $$('[data-borrar]').forEach((b) => (b.onclick = async () => {
    if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? Borrar'; return; }
    await sb.from('cc_adelantos_sueldo').delete().eq('id', +b.dataset.borrar); adelMsg = ''; vistaAdelanto();
  }));
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#err').textContent = ''; adelMsg = '';
    const empleado = $('#emp').value.trim().replace(/\s+/g, ' '), monto = parseMonto($('#imp').value), fecha = $('#fecha').value, desc = $('#desc').value;
    if (!empleado) { $('#err').textContent = 'Poné el nombre del empleado.'; return; }
    if (!(monto > 0)) { $('#err').textContent = 'Poné un importe mayor a 0 (ej. 150.000,00).'; return; }
    if (!fecha || !desc) { $('#err').textContent = 'Elegí la fecha y el mes del sueldo.'; return; }
    $('#ok').disabled = true;
    const { error } = await sb.from('cc_adelantos_sueldo').insert({ empleado, monto, fecha, descuenta_mes: desc + '-01', nota: $('#nota').value.trim() || null });
    if (error) { $('#err').textContent = 'No se pudo guardar: ' + error.message; $('#ok').disabled = false; return; }
    adelMsg = `${empleado} · se descuenta del sueldo de ${nomMes(desc)}`;
    vistaAdelanto();
  };
}

// ---- 4) Proveedor nuevo ----
let provMsg = null;
function vistaProveedor() {
  $('#vista').innerHTML = `<form class="card" id="f"><h2 style="margin-top:0">Proveedor nuevo</h2>
<div class="campos">
<div><label for="nombre">Nombre</label><input id="nombre" autocomplete="off" required></div>
<div><label for="grupo">Grupo (opcional)</label><input id="grupo" list="grupos" placeholder="Para juntar cuentas del mismo proveedor" autocomplete="off"><datalist id="grupos">${[...new Set((provs || []).map((p) => p.grupo).filter(Boolean))].map((g) => `<option value="${esc(g)}">`).join('')}</datalist></div>
</div>
<div class="pie"><p class="err" id="err"></p>${provMsg ? `<p class="ok-t"><b>Guardado ✓</b> ${esc(provMsg.nombre)} · <a href="nuevo.html?proveedor=${provMsg.id}&tipo=comprobante">Cargarle una factura</a> · <a href="proveedor.html?id=${provMsg.id}">Ver proveedor</a></p>` : ''}
<button class="btn primary" id="ok">Guardar proveedor</button></div></form>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#err').textContent = ''; provMsg = null;
    const nombre = $('#nombre').value.trim().replace(/\s+/g, ' ');
    if (!nombre) { $('#err').textContent = 'Poné el nombre del proveedor.'; return; }
    const parecido = (provs || []).find((p) => p.nombre.toLowerCase() === nombre.toLowerCase());
    if (parecido) { $('#err').textContent = `Ya existe un proveedor llamado "${parecido.nombre}".`; return; }
    $('#ok').disabled = true;
    const { data, error } = await sb.from('cc_proveedores').insert({ nombre, grupo: $('#grupo').value.trim() || null }).select('id,nombre,grupo').single();
    if (error) { $('#err').textContent = /duplicate|unique/i.test(error.message) ? 'Ya existe un proveedor con ese nombre.' : 'No se pudo guardar: ' + error.message; $('#ok').disabled = false; return; }
    provs.push(data); provs.sort((a, b) => a.nombre.localeCompare(b.nombre));
    provMsg = { id: data.id, nombre: data.nombre };
    vistaProveedor();
  };
}

pintar();
</script>
</body>
</html>
