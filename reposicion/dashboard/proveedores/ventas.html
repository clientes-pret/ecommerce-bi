<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorecard · Panel de control</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=11">
<style>
  /* Scorecard: en pantallas angostas cada período es una tarjeta (sin tabla de 11 columnas con scroll lateral). */
  .sc-cards{display:none;gap:10px;flex-direction:column;padding:4px 12px 12px}
  .sc-card{border:1px solid var(--line,#e5e2da);border-radius:12px;padding:12px 14px;background:#fff}
  .sc-card h3{margin:0 0 8px;font-size:15px}
  .sc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px}
  .sc-top .l{font-size:12px;color:var(--ink-soft,#6b6b6b)}
  .sc-top .v{font-size:22px;font-weight:700}
  .sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .sc-grid .l{font-size:12px;color:var(--ink-soft,#6b6b6b)}
  .sc-grid .v{font-size:15px;font-weight:600}
  @media (max-width:760px){.sc-tabla{display:none}.sc-cards{display:flex}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
// Scorecard por canal: una fila (o tarjeta, en el celular) por día, semana o mes. Se lee de scorecard_canal_dia / scorecard_ads_dia.
// El análisis comparado (cómo viene el período, rentabilidad del mes, ads) está en ventas-dashboard.html.
import { $, $$, guard, nav, peso0, hoy } from './app.js';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'scorecard');
const { ref, DAY, POR_PAGINA, ADS_DE, PEND, NA, sumar, celdasSc, cabSc, conPct, periodosSc, ddmm, ddmmaa, largo } = await import('./ventas-lib.js');

let marca = 'all';
const sc = { canal: 'tn', gran: 'dia', pag: 0 };
const hoyAR = hoy();

// Tarjeta de un período (celular). Muestra primero lo que se mira siempre: ventas y rentabilidad con ads.
function tarjeta(et, t, canal) {
  const ads = ADS_DE[canal].map(([p, n]) => [n, t.ads[p] == null ? PEND : peso0(t.ads[p])]);
  const celdas = [
    ['Facturación neta', t.neta == null ? PEND : peso0(t.neta)], ['Órdenes', t.ordenes == null ? PEND : t.ordenes.toLocaleString('es-AR')],
    ['Costo de productos', t.costo == null ? PEND : peso0(t.costo)], ['Costo de envío', canal === 'ml' ? NA : t.envio == null ? PEND : peso0(t.envio)],
    ['Rentab. s/ads', conPct(t.rentS, t.ventas)], ...ads,
    ['ROAS', t.roas == null ? (t.inversion > 0 ? PEND : '<span class="chip">Sin inversión</span>') : t.roas.toFixed(2).replace('.', ',') + 'x'],
  ];
  const rc = t.rentS == null ? PEND : t.inversion == null ? '<span class="chip">Sin inversión</span>' : conPct(t.rentC, t.ventas);
  return `<div class="sc-card"><h3>${et}</h3>
    <div class="sc-top"><div><div class="l">Ventas</div><div class="v num">${t.ventas == null ? PEND : peso0(t.ventas)}</div></div><div style="text-align:right"><div class="l">Rentab. c/ads</div><div class="v num">${rc}</div></div></div>
    <div class="sc-grid">${celdas.map(([l, v]) => `<div><div class="l">${l}</div><div class="v num">${v}</div></div>`).join('')}</div></div>`;
}

function pintar() {
  if (!ref) { $('#app').innerHTML = '<h1>Scorecard</h1><div class="card"><p class="muted">Todavía no hay ventas cargadas en el scorecard.</p></div>'; return; }
  const marcas = marca === 'all' ? ['pret', 'lavan'] : [marca];
  const nombreMarca = marca === 'all' ? 'Ambas marcas' : marca === 'pret' ? 'Pret a Home' : 'Casa Laván';
  const atraso = Math.round((Date.parse(hoyAR) - Date.parse(ref)) / DAY);
  const tabs = [['all', 'Consolidado'], ['pret', 'Pret a Home'], ['lavan', 'Casa Laván']].map(([k, t]) => `<button type="button" data-marca="${k}" aria-pressed="${marca === k}">${t}</button>`).join('');
  const segSc = (k, opciones) => `<div class="seg" role="group">${opciones.map(([v, t]) => `<button type="button" data-sc-${k}="${v}" aria-pressed="${sc[k] === v}">${t}</button>`).join('')}</div>`;

  // Último día cargado, por canal
  const canalesUlt = [['tn', 'Tienda Nube'], ['ml', 'Mercado Libre']].map(([c, n]) => [c, n, sumar([ref], marcas, c)]);
  const ultTabla = canalesUlt.map(([c, n, t]) => `<tr><th scope="row" style="white-space:nowrap">${n}</th>${celdasSc(t, c, true)}</tr>`).join('');
  const ultCards = canalesUlt.map(([c, n, t]) => tarjeta(n, t, c)).join('');

  const periodos = periodosSc(marcas, sc.canal, sc.gran), paginas = Math.max(1, Math.ceil(periodos.length / POR_PAGINA));
  sc.pag = Math.min(sc.pag, paginas - 1);
  const visibles = periodos.slice(sc.pag * POR_PAGINA, (sc.pag + 1) * POR_PAGINA).map((p) => [p.et, sumar(p.dias, marcas, sc.canal)]);
  const filasSc = visibles.map(([et, t]) => `<tr><th scope="row" class="num" style="white-space:nowrap;font-weight:500">${et}</th>${celdasSc(t, sc.canal)}</tr>`).join('');
  const cardsSc = visibles.map(([et, t]) => tarjeta(et, t, sc.canal)).join('');
  const unidad = { dia: 'días', semana: 'semanas', mes: 'meses', ml: 'períodos ML' }[sc.gran];
  const pager = `<div class="row between" style="padding:12px 16px 4px"><button class="btn sm" type="button" id="scMas" ${sc.pag <= 0 ? 'disabled' : ''}>← Recientes</button>
      <span class="small muted">Pág. ${sc.pag + 1} de ${paginas} · ${periodos.length} ${unidad}</span>
      <button class="btn sm" type="button" id="scMenos" ${sc.pag >= paginas - 1 ? 'disabled' : ''}>Antiguos →</button></div>`;

  $('#app').innerHTML = `<div class="cabecera"><div><h1>Scorecard</h1><p>${largo(ref)}</p></div>
    <span class="row small muted" style="gap:6px"><span class="dot" style="background:${atraso <= 1 ? 'var(--ok)' : '#B54708'}"></span>Datos hasta el ${ddmm(ref)}${atraso > 1 ? ` · ${atraso} días de atraso` : ''}</span></div>
  <div class="seg" role="group" aria-label="Marca" style="margin-top:16px">${tabs}</div>
  <section class="card tabla"><div class="cab"><div><h2>Último día · ${ddmmaa(ref)}</h2><span class="muted">${nombreMarca}, por canal</span></div></div>
    <div class="sc-tabla scroll"><table style="min-width:1000px"><thead>${cabSc('tn', 'Canal', true)}</thead><tbody>${ultTabla}</tbody></table></div>
    <div class="sc-cards">${ultCards}</div></section>
  <section class="card tabla"><div class="cab"><div><h2>Scorecard por canal</h2><span class="muted">${nombreMarca} · por día, semana (lunes a domingo), mes o período ML (del 11 al 10)</span></div>
      <div class="row wrapRow" style="gap:8px">${segSc('canal', [['tn', 'Tienda Nube'], ['ml', 'Mercado Libre']])}${segSc('gran', [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes'], ['ml', 'Período ML']])}</div></div>
    <div class="sc-tabla scroll"><table style="min-width:1100px"><thead>${cabSc(sc.canal, { dia: 'Fecha', semana: 'Semana', mes: 'Mes', ml: 'Período ML (11 al 10)' }[sc.gran])}</thead><tbody>${filasSc || '<tr><td colspan="11" class="muted">Sin datos todavía.</td></tr>'}</tbody></table></div>
    <div class="sc-cards">${cardsSc || '<p class="muted">Sin datos todavía.</p>'}</div>
    ${pager}</section>
  <p class="muted small" style="line-height:1.6">Rentabilidad s/ads = neta − costo de productos − envío (en Mercado Libre el envío ya viene dentro de la neta). Para ver cómo viene el período contra el promedio, está el <a href="ventas-dashboard.html">Dashboard</a>.</p>`;
  $$('[data-marca]').forEach((b) => (b.onclick = () => { marca = b.dataset.marca; sc.pag = 0; pintar(); }));
  $$('[data-sc-canal]').forEach((b) => (b.onclick = () => { sc.canal = b.dataset.scCanal; sc.pag = 0; pintar(); }));
  $$('[data-sc-gran]').forEach((b) => (b.onclick = () => { sc.gran = b.dataset.scGran; sc.pag = 0; pintar(); }));
  $('#scMas').onclick = () => { sc.pag -= 1; pintar(); };
  $('#scMenos').onclick = () => { sc.pag += 1; pintar(); };
}
pintar();
</script>
</body>
</html>
