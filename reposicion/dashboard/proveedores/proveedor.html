<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proveedor · Proveedores</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#0f1115">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, guard, nav, qs, peso, peso0, fecha, fechaHora, chipEstado, hoy } from './app.js';
import { analizar, activarTooltips, mesesAtras, lecturas, graficoBarras, graficoSaldo, barraAging, semaforo, diasEntre } from './analisis.js';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'prov');
const id = qs('id'), H = hoy(), PAG = 100;
const TIPO = { comprobante: 'Comprobante', nota_credito: 'Nota de crédito', nota_debito: 'Nota de débito', pago: 'Pago', ajuste: 'Ajuste', saldo_inicial: 'Saldo inicial', otro: 'Otro' };
let anio = 'ult', prov, movs = [], recs = [], items = [], a, tab = 'resumen', solo = 'todo', mostrar = PAG;

async function cargarMovs() {
  let todo = [], desde = 0;
  for (;;) {
    const { data } = await sb.from('cc_movimientos').select('*').eq('proveedor_id', id).order('fecha').order('id').range(desde, desde + 999);
    todo = todo.concat(data || []); if ((data || []).length < 1000) break; desde += 1000;
  }
  let c = 0; movs = todo.map((m) => ({ ...m, saldo: (c += Number(m.ingreso) - Number(m.pago)) }));
  a = analizar(movs, H);
}
const [{ data: p }] = await Promise.all([
  sb.from('cc_proveedores').select('*').eq('id', id).maybeSingle(), cargarMovs(),
  sb.from('cc_recepciones_resumen').select('id,fecha,nro_remito,estado,bultos,unidades_contadas,recibido_completo').eq('proveedor_id', id).order('fecha', { ascending: false }).limit(100).then(({ data }) => (recs = data || [])),
  sb.from('cc_recepcion_items').select('sku,descripcion,cant_contada,cc_recepciones!inner(proveedor_id,estado)').eq('cc_recepciones.proveedor_id', id).neq('cc_recepciones.estado', 'anulada').limit(2000).then(({ data }) => (items = data || [])),
]);
prov = p;
if (!prov) { $('#app').innerHTML = '<p>Proveedor no encontrado.</p>'; throw new Error('404'); }

function kpi(l, v, sub, cls = '', md = true) { return `<div class="cc-card"><div class="cc-label">${l}</div><div class="cc-valor ${md ? 'md' : ''} num ${cls}">${v}</div><div class="cc-sub">${sub || '&nbsp;'}</div></div>`; }
const hace = (d) => (d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`);

function periodo() {
  if (anio === 'ult') return a.mensual;
  const hasta = anio === H.slice(0, 4) ? H.slice(5, 7) : '12';
  return analizar(movs, H, Array.from({ length: Number(hasta) }, (_, i) => `${anio}-${String(i + 1).padStart(2, '0')}`)).mensual;
}
function selAnio() {
  const y0 = Number((movs[0]?.fecha || H).slice(0, 4)), y1 = Number(H.slice(0, 4)), op = [['ult', 'Últimos 18 meses']];
  for (let y = y1; y >= y0; y--) op.push([String(y), String(y)]);
  return `<select id="anio" style="width:auto;min-height:30px;padding:2px 8px;float:right">${op.map(([v, t]) => `<option value="${v}" ${anio === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}
function resumen() {
  const per = periodo();
  const up = a.ultimoPago, ui = a.ultimoIngreso, pr = a.cheques[0];
  const rc = recs.filter((r) => r.estado !== 'anulada'), conDif = rc.filter((r) => r.estado === 'con_diferencia').length;
  const top = Object.values(items.reduce((o, i) => { const k = i.sku || i.descripcion || '?'; (o[k] ||= { k, n: 0 }).n += i.cant_contada; return o; }, {})).sort((x, y) => y.n - x.n).slice(0, 8);
  const [sem, sc] = semaforo(a.saldo, up?.dias ?? null);
  return `<div class="centro-comando">
    ${kpi('Saldo (le debemos)', peso0(a.saldo), `<span class="chip ${sc}">${sem}</span>`, a.saldo < -1 ? 'ok-t' : '')}
    ${kpi('Último pago', up ? peso0(up.monto) : '—', up ? `${fecha(up.fecha)} · ${hace(up.dias)}${up.medio ? ' · ' + up.medio : ''}` : 'Sin pagos registrados', up && a.saldo > 1 && up.dias > 60 ? 'bad-t' : '')}
    ${kpi('Último ingreso (factura)', ui ? peso0(ui.monto) : '—', ui ? `${fecha(ui.fecha)} · ${hace(ui.dias)}` : 'Sin facturas')}
    ${kpi('Cheques sin cobrar', peso0(a.chequesTotal), a.cheques.length ? `${a.cheques.length} cheque${a.cheques.length > 1 ? 's' : ''}${pr?.cheque_fecha_cobro ? ' · próximo ' + fecha(pr.cheque_fecha_cobro) : ''}` : 'Ninguno')}
    ${kpi('Plazo medio de pago', a.plazoMedio != null ? a.plazoMedio + ' días' : '—', 'desde la factura, últimos 12 meses')}
    ${kpi('Facturado 12 meses', peso0(a.compras12), a.tendencia != null ? `${a.tendencia >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(a.tendencia))}% vs 12 meses anteriores` : 'sin año anterior para comparar')}
    ${kpi('Pagado 12 meses', peso0(a.pagos12), `${a.pagos12n} pagos`)}
    ${kpi('Factura promedio', a.ticket != null ? peso0(a.ticket) : '—', a.facturas12 ? `${a.facturas12} facturas · una cada ${a.cadenciaDias ?? '—'} días` : 'sin facturas en 12 meses')}
  </div>
  <div class="grid dos">
    <div class="card"><h2 style="margin-top:0">Lo que hay que saber</h2><ul class="lecturas">${lecturas(a, H).map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul></div>
    <div class="card"><h2 style="margin-top:0">Antigüedad de la deuda</h2>${barraAging(a)}
      <div class="cc-nota">Se asume que cada pago cancela las facturas más viejas primero.${a.desde ? ` Cuenta abierta desde ${fecha(a.desde)}.` : ''}</div></div>
  </div>
  <div class="card chart">${selAnio()}<h2 style="margin-top:0">Facturado vs. pagado por mes</h2><div class="leyenda"><span><i style="background:#4f8cff"></i>Facturado</span><span><i style="background:#6fcf97"></i>Pagado</span></div>${graficoBarras(per)}</div>
  <div class="card chart"><h2 style="margin-top:0">Evolución del saldo</h2>${graficoSaldo(per)}</div>
  <div class="grid dos">
    <div class="card"><h2 style="margin-top:0">Mercadería recibida en depósito</h2>${rc.length ? `<div class="row wrapRow" style="gap:24px;margin-bottom:8px"><div><div class="cc-label">Última</div><b>${fecha(rc[0].fecha)}</b></div><div><div class="cc-label">Recepciones</div><b>${rc.length}</b></div><div><div class="cc-label">Con diferencia</div><b class="${conDif ? 'bad-t' : ''}">${conDif}</b></div></div>
      <a href="#" data-tab="rec">Ver todas →</a>` : '<p class="muted">Todavía no hay recepciones cargadas desde el depósito.</p>'}</div>
    <div class="card"><h2 style="margin-top:0">Lo más recibido</h2>${top.length ? `<table><tbody>${top.map((t) => `<tr><td>${esc(t.k)}</td><td class="r num">${t.n} u.</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Se arma solo a medida que Mati carga recepciones.</p>'}</div>
  </div>`;
}

function cuenta() {
  let f = movs.slice().reverse();
  if (solo === 'pagos') f = f.filter((m) => m.tipo === 'pago'); if (solo === 'comprobantes') f = f.filter((m) => m.tipo !== 'pago');
  const fila = (m) => `<tr><td class="num">${fecha(m.fecha)}</td>
    <td>${esc(m.detalle)}${m.tipo !== 'comprobante' && m.tipo !== 'pago' ? `<span class="chip" style="margin-left:6px">${TIPO[m.tipo]}</span>` : ''}
    ${m.medio_pago === 'cheque' ? `<div class="small muted">Cheque ${esc(m.cheque_nro || '')} ${m.cheque_fecha_cobro ? '· cobro ' + fecha(m.cheque_fecha_cobro) : ''} ${m.cheque_cobrado === false ? `<button class="btn sm" data-cobrado="${m.id}" style="margin-left:6px">Marcar cobrado</button>` : m.cheque_cobrado ? '· cobrado' : ''}</div>` : ''}
    ${m.nota ? `<div class="small muted">${esc(m.nota)}</div>` : ''}</td>
    <td class="r num">${Number(m.ingreso) ? peso(m.ingreso) : ''}</td><td class="r num">${Number(m.pago) ? peso(m.pago) : ''}</td><td class="r num"><b>${solo === 'todo' ? peso(m.saldo) : ''}</b></td>
    <td>${m.recepcion_id ? `<a href="recepcion.html?id=${m.recepcion_id}" class="chip ${m.control_estado === 'ok' ? 'ok' : m.control_estado === 'con_diferencia' ? 'bad' : ''}">${m.control_estado === 'ok' ? 'Controlada ✓' : m.control_estado === 'con_diferencia' ? 'Diferencia' : 'Vinculada'}</a>` : ''}</td></tr>`;
  return `<div class="row" style="margin-bottom:8px"><select id="solo" style="width:auto"><option value="todo" ${solo === 'todo' ? 'selected' : ''}>Todo</option><option value="pagos" ${solo === 'pagos' ? 'selected' : ''}>Solo pagos</option><option value="comprobantes" ${solo === 'comprobantes' ? 'selected' : ''}>Solo comprobantes</option></select><span class="muted small">${f.length} movimientos</span></div>
  <div class="card tablewrap"><table><thead><tr><th>Fecha</th><th>Detalle</th><th class="r">Ingreso</th><th class="r">Pago</th><th class="r">Saldo</th><th>Control</th></tr></thead><tbody>${f.slice(0, mostrar).map(fila).join('')}</tbody></table>
  ${f.length > mostrar ? '<button class="btn" id="mas" style="margin:12px">Ver más antiguos</button>' : ''}</div>`;
}

function mercaderia() {
  return `<div class="card tablewrap">${recs.length ? `<table><thead><tr><th>Fecha</th><th>Remito</th><th class="r">Bultos</th><th class="r">Unidades</th><th>Mati dice</th><th>Estado</th></tr></thead><tbody>
    ${recs.map((r) => `<tr class="click" onclick="location.href='recepcion.html?id=${r.id}'"><td>${fechaHora(r.fecha)}</td><td>${esc(r.nro_remito || 's/n')}</td><td class="r">${r.bultos ?? ''}</td><td class="r num">${r.unidades_contadas}</td><td>${r.recibido_completo ? '<span class="chip ok">Completo</span>' : '<span class="chip bad">Faltante</span>'}</td><td>${chipEstado(r.estado)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="muted" style="padding:12px">Todavía no hay recepciones cargadas desde el depósito para este proveedor.</p>'}</div>`;
}

function pintar() {
  const [sem, sc] = semaforo(a.saldo, a.ultimoPago?.dias ?? null);
  $('#app').innerHTML = `<p class="small"><a href="proveedores.html">← Todos los proveedores</a></p>
  <div class="row between wrapRow"><div><h1>${esc(prov.nombre)} ${prov.activo ? '' : '<span class="chip">inactivo</span>'}</h1><div class="muted small">${prov.grupo ? 'Grupo: ' + esc(prov.grupo) + ' · ' : ''}${a.n} movimientos${a.desde ? ' desde ' + fecha(a.desde) : ''}</div></div>
    <div class="row wrapRow"><a class="btn primary sm" href="nuevo.html?proveedor=${id}&tipo=comprobante">＋ Factura</a><a class="btn primary sm" href="nuevo.html?proveedor=${id}&tipo=pago">＋ Pago</a>
    <button class="btn sm" id="activo">${prov.activo ? 'Marcar inactivo' : 'Reactivar'}</button></div></div>
  <div class="tabs">${[['resumen', 'Centro de comando'], ['cc', 'Cuenta corriente'], ['rec', 'Mercadería recibida']].map(([k, t]) => `<button class="btn sm ${tab === k ? 'primary' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>
  ${tab === 'resumen' ? resumen() : tab === 'cc' ? cuenta() : mercaderia()}`;
  $$('[data-tab]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); tab = b.dataset.tab; pintar(); scrollTo(0, 0); }));
  const an = $('#anio'); if (an) an.onchange = () => { anio = an.value; pintar(); };
  const sel = $('#solo'); if (sel) sel.onchange = () => { solo = sel.value; mostrar = PAG; pintar(); };
  const mas = $('#mas'); if (mas) mas.onclick = () => { mostrar += PAG; pintar(); };
  $('#activo').onclick = async () => { await sb.from('cc_proveedores').update({ activo: !prov.activo }).eq('id', id); prov.activo = !prov.activo; pintar(); };
  $$('[data-cobrado]').forEach((b) => (b.onclick = async () => { await sb.from('cc_movimientos').update({ cheque_cobrado: true }).eq('id', b.dataset.cobrado); await cargarMovs(); pintar(); }));
}
activarTooltips();
pintar();
</script>
</body>
</html>
