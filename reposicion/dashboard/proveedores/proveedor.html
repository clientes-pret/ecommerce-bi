<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proveedor · Proveedores</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=8">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { sb, $, $$, esc, guard, nav, qs, peso, peso0, fecha, fechaHora, chipEstado, hoy } from './app.js';
import { analizar, activarTooltips, mesesAtras, lecturas, graficoBarras, graficoSaldo, barraAging, semaforo, diasEntre } from './analisis.js?v=5';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'prov');
const id = qs('id'), H = hoy(), PAG = 100;
const TIPO = { comprobante: 'Comprobante', nota_credito: 'Nota de crédito', nota_debito: 'Nota de débito', pago: 'Pago', ajuste: 'Ajuste', saldo_inicial: 'Saldo inicial', otro: 'Otro' };
let pedidos = [], skuInfo = {}, nombresRepo = [], anio = 'ult', prov, movs = [], recs = [], items = [], a, tab = 'resumen', solo = 'todo', mostrar = PAG;

async function cargarMovs() {
  let todo = [], desde = 0;
  for (;;) {
    const { data } = await sb.from('cc_movimientos').select('*').eq('proveedor_id', id).order('fecha').order('id').range(desde, desde + 999);
    todo = todo.concat(data || []); if ((data || []).length < 1000) break; desde += 1000;
  }
  let c = 0; movs = todo.map((m) => ({ ...m, saldo: (c += Number(m.ingreso) - Number(m.pago)) }));
  a = analizar(movs, H);
}
const [{ data: p }] = await Promise.all([
  sb.from('cc_proveedores').select('*').eq('id', id).maybeSingle(), cargarMovs(),
  sb.from('cc_recepciones_resumen').select('id,fecha,nro_remito,estado,bultos,unidades_contadas,recibido_completo').eq('proveedor_id', id).order('fecha', { ascending: false }).limit(100).then(({ data }) => (recs = data || [])),
  sb.from('cc_recepcion_items').select('sku,descripcion,cant_contada,cc_recepciones!inner(proveedor_id,estado)').eq('cc_recepciones.proveedor_id', id).neq('cc_recepciones.estado', 'anulada').limit(2000).then(({ data }) => (items = data || [])),
]);
prov = p;
async function cargarPedidos() {
  const rn = prov?.repo_nombres || [];
  if (!rn.length) { const { data } = await sb.from('repo_pedidos').select('proveedor'); nombresRepo = [...new Set((data || []).map((x) => x.proveedor))].sort(); pedidos = []; return; }
  const { data } = await sb.from('repo_pedidos').select('id,creado_at,creado_por,estado,notas,unidad_medida,repo_pedido_items(sku,destino,cantidad_pedida,cantidad_recibida,recibido_completo)').in('proveedor', rn).order('creado_at', { ascending: false }).limit(100);
  pedidos = data || [];
  const skus = [...new Set(pedidos.flatMap((x) => x.repo_pedido_items.map((i) => i.sku)))];
  for (let i = 0; i < skus.length; i += 100) { const { data: pr } = await sb.from('cc_productos').select('sku,producto,color,medida').in('sku', skus.slice(i, i + 100)); (pr || []).forEach((x) => (skuInfo[x.sku] = x)); }
}
if (prov) await cargarPedidos();
if (!prov) { $('#app').innerHTML = '<p>Proveedor no encontrado.</p>'; throw new Error('404'); }

function kpi(l, v, sub, cls = '', md = true) { return `<div class="cc-card"><div class="cc-label">${l}</div><div class="cc-valor ${md ? 'md' : ''} num ${cls}">${v}</div><div class="cc-sub">${sub || '&nbsp;'}</div></div>`; }
const hace = (d) => (d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`);

function periodo() {
  if (anio === 'ult') return a.mensual;
  const hasta = anio === H.slice(0, 4) ? H.slice(5, 7) : '12';
  return analizar(movs, H, Array.from({ length: Number(hasta) }, (_, i) => `${anio}-${String(i + 1).padStart(2, '0')}`)).mensual;
}
function selAnio() {
  const y0 = Number((movs[0]?.fecha || H).slice(0, 4)), y1 = Number(H.slice(0, 4)), op = [['ult', 'Últimos 18 meses']];
  for (let y = y1; y >= y0; y--) op.push([String(y), String(y)]);
  return `<select id="anio" style="width:auto;min-height:30px;padding:2px 8px;float:right">${op.map(([v, t]) => `<option value="${v}" ${anio === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}
const ABIERTO = ['enviado', 'recibido_parcial'];
const ptotal = (x) => x.repo_pedido_items.reduce((s, i) => s + i.cantidad_pedida, 0), prec = (x) => x.repo_pedido_items.reduce((s, i) => s + Math.min(i.cantidad_recibida, i.cantidad_pedida), 0);
function pedidosKpi() {
  if (!(prov.repo_nombres || []).length) return kpi('Pedidos de reposición', '—', '<a href="#" data-tab="ped">Vincular con reposición →</a>');
  const ab = pedidos.filter((x) => ABIERTO.includes(x.estado)), pend = ab.reduce((s, x) => s + ptotal(x) - prec(x), 0), u = pedidos.find((x) => x.estado !== 'cancelado');
  return kpi('Pedidos abiertos', ab.length, ab.length ? `${pend} u. pendientes de recibir · <a href="#" data-tab="ped">ver</a>` : (u ? `Último pedido ${fecha(u.creado_at)} · ${hace(diasEntre(u.creado_at, H))}` : 'Sin pedidos'));
}
function resumen() {
  const per = periodo();
  const up = a.ultimoPago, ui = a.ultimoIngreso, pr = a.cheques[0];
  const rc = recs.filter((r) => r.estado !== 'anulada'), conDif = rc.filter((r) => r.estado === 'con_diferencia').length;
  const top = Object.values(items.reduce((o, i) => { const k = i.sku || i.descripcion || '?'; (o[k] ||= { k, n: 0 }).n += i.cant_contada; return o; }, {})).sort((x, y) => y.n - x.n).slice(0, 8);
  const [sem, sc] = semaforo(a.saldo, up?.dias ?? null);
  return `<div class="centro-comando">
    ${kpi('Saldo (le debemos)', peso0(a.saldo), `<span class="chip ${sc}">${sem}</span>`, a.saldo < -1 ? 'ok-t' : '')}
    ${kpi('Último pago', up ? peso0(up.monto) : '—', up ? `${fecha(up.fecha)} · ${hace(up.dias)}${up.medio ? ' · ' + up.medio : ''}` : 'Sin pagos registrados', up && a.saldo > 1 && up.dias > 60 ? 'bad-t' : '')}
    ${kpi('Último ingreso (factura)', ui ? peso0(ui.monto) : '—', ui ? `${fecha(ui.fecha)} · ${hace(ui.dias)}` : 'Sin facturas')}
    ${kpi('Cheques sin cobrar', peso0(a.chequesTotal), a.cheques.length ? `${a.cheques.length} cheque${a.cheques.length > 1 ? 's' : ''}${pr?.cheque_fecha_cobro ? ' · próximo ' + fecha(pr.cheque_fecha_cobro) : ''}` : 'Ninguno')}
    ${kpi('Plazo medio de pago', a.plazoMedio != null ? a.plazoMedio + ' días' : '—', 'desde la factura, últimos 12 meses')}
    ${kpi('Facturado 12 meses', peso0(a.compras12), a.tendencia != null ? `${a.tendencia >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(a.tendencia))}% vs 12 meses anteriores` : 'sin año anterior para comparar')}
    ${pedidosKpi()}
    ${kpi('Pagado 12 meses', peso0(a.pagos12), `${a.pagos12n} pagos`)}
    ${kpi('Factura promedio', a.ticket != null ? peso0(a.ticket) : '—', a.facturas12 ? `${a.facturas12} facturas · una cada ${a.cadenciaDias ?? '—'} días` : 'sin facturas en 12 meses')}
  </div>
  <div class="grid dos">
    <div class="card"><h2 style="margin-top:0">Lo que hay que saber</h2><ul class="lecturas">${lecturas(a, H).map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul></div>
    <div class="card"><h2 style="margin-top:0">Antigüedad de la deuda</h2>${barraAging(a)}
      <div class="cc-nota">Se asume que cada pago cancela las facturas más viejas primero.${a.desde ? ` Cuenta abierta desde ${fecha(a.desde)}.` : ''}</div></div>
  </div>
  <div class="card chart">${selAnio()}<h2 style="margin-top:0">Facturado vs. pagado por mes</h2><div class="leyenda"><span><i style="background:#2449B8"></i>Facturado</span><span><i style="background:#3D8B5E"></i>Pagado</span></div>${graficoBarras(per)}</div>
  <div class="card chart"><h2 style="margin-top:0">Evolución del saldo</h2>${graficoSaldo(per)}</div>
  <div class="grid dos">
    <div class="card"><h2 style="margin-top:0">Mercadería recibida en depósito</h2>${rc.length ? `<div class="row wrapRow" style="gap:24px;margin-bottom:8px"><div><div class="cc-label">Última</div><b>${fecha(rc[0].fecha)}</b></div><div><div class="cc-label">Recepciones</div><b>${rc.length}</b></div><div><div class="cc-label">Con diferencia</div><b class="${conDif ? 'bad-t' : ''}">${conDif}</b></div></div>
      <a href="#" data-tab="rec">Ver todas →</a>` : '<p class="muted">Todavía no hay recepciones cargadas desde el depósito.</p>'}</div>
    <div class="card"><h2 style="margin-top:0">Lo más recibido</h2>${top.length ? `<table><tbody>${top.map((t) => `<tr><td>${esc(t.k)}</td><td class="r num">${t.n} u.</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Se arma solo a medida que Mati carga recepciones.</p>'}</div>
  </div>`;
}

function cuenta() {
  let f = movs.slice().reverse();
  if (solo === 'pagos') f = f.filter((m) => m.tipo === 'pago'); if (solo === 'comprobantes') f = f.filter((m) => m.tipo !== 'pago');
  const fila = (m) => `<tr><td class="num muted">${fecha(m.fecha)}</td>
    <td>${esc(m.detalle)}${m.tipo !== 'comprobante' && m.tipo !== 'pago' ? `<span class="chip" style="margin-left:6px">${TIPO[m.tipo]}</span>` : ''}
    ${m.medio_pago === 'cheque' ? `<div class="small muted">Cheque ${esc(m.cheque_nro || '')} ${m.cheque_fecha_cobro ? '· cobro ' + fecha(m.cheque_fecha_cobro) : ''} ${m.cheque_cobrado === false ? `<button class="btn sm" data-cobrado="${m.id}" style="margin-left:6px">Marcar cobrado</button>` : m.cheque_cobrado ? '· cobrado' : ''}</div>` : ''}
    ${m.nota ? `<div class="small muted">${esc(m.nota)}</div>` : ''}</td>
    <td class="r num">${Number(m.ingreso) ? peso(m.ingreso) : ''}</td><td class="r num ok-t">${Number(m.pago) ? peso(m.pago) : ''}</td><td class="r num"><b>${solo === 'todo' ? peso(m.saldo) : ''}</b></td>
    <td>${m.recepcion_id ? `<a href="recepcion.html?id=${m.recepcion_id}" class="chip ${m.control_estado === 'ok' ? 'ok' : m.control_estado === 'con_diferencia' ? 'bad' : ''}">${m.control_estado === 'ok' ? 'Controlada ✓' : m.control_estado === 'con_diferencia' ? 'Diferencia' : 'Vinculada'}</a>` : ''}</td></tr>`;
  return `<section class="card tabla" style="margin-top:16px"><div class="cab"><div><h2>Cuenta corriente · ${esc(prov.nombre)}</h2><span class="muted">Saldo ${peso0(a.saldo)} · ${f.length} movimientos</span></div>
    <div class="seg gris" role="group" aria-label="Qué movimientos">${[['todo', 'Todo'], ['pagos', 'Solo pagos'], ['comprobantes', 'Solo comprobantes']].map(([k, t]) => `<button type="button" data-solo="${k}" aria-pressed="${solo === k}">${t}</button>`).join('')}</div></div>
  <div class="scroll"><table style="min-width:760px"><thead><tr><th scope="col">Fecha</th><th scope="col">Movimiento</th><th scope="col" class="r">Factura</th><th scope="col" class="r">Pago</th><th scope="col" class="r">Saldo</th><th scope="col">Control</th></tr></thead><tbody>${f.slice(0, mostrar).map(fila).join('')}</tbody></table></div>
  ${f.length > mostrar ? '<button class="btn" id="mas" style="margin:12px 24px">Ver más antiguos</button>' : ''}</section>`;
}

const EST = { enviado: ['Enviado', 'warn'], recibido_parcial: ['Recibido parcial', 'warn'], recibido_completo: ['Recibido completo', 'ok'], cancelado: ['Cancelado', ''] };
function tabPedidos() {
  const rn = prov.repo_nombres || [];
  const vinc = `<div class="card"><b>Vinculado con reposición como:</b> ${rn.length ? rn.map((n) => `<span class="chip">${esc(n)} <a href="#" data-quitar="${esc(n)}" title="Quitar">✕</a></span>`).join(' ') : '<span class="muted">todavía nada</span>'}
    <div class="row wrapRow" style="margin-top:10px"><select id="nrepo" style="max-width:320px"><option value="">Elegí el nombre que usás en reposición…</option>${nombresRepoOpc().map((n) => `<option>${esc(n)}</option>`).join('')}</select><button class="btn sm primary" id="vincular">Vincular</button></div>
    ${!nombresRepoOpc().length ? '<div class="cc-nota">Todavía no hay pedidos en reposición con otro nombre para vincular.</div>' : ''}</div>`;
  if (!rn.length) return vinc;
  return vinc + (pedidos.length ? pedidos.map((x) => { const [t, c] = EST[x.estado] || [x.estado, '']; const T = ptotal(x), R = prec(x), u = x.unidad_medida === 'bultos' ? 'bultos' : 'u.';
    return `<details class="card"><summary style="cursor:pointer"><b>Pedido #${x.id}</b> · ${fecha(x.creado_at)} <span class="muted small">por ${esc(x.creado_por)}</span> <span class="chip ${c}">${t}</span> <span class="num" style="float:right">${R} de ${T} ${u} recibidas</span></summary>
      ${x.notas ? `<p class="small muted">${esc(x.notas)}</p>` : ''}<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Destino</th><th class="r">Pedido</th><th class="r">Recibido</th><th class="r">Pendiente</th></tr></thead><tbody>
      ${x.repo_pedido_items.map((i) => `<tr><td><b>${esc(i.sku)}</b><div class="small muted">${esc([skuInfo[i.sku]?.producto, skuInfo[i.sku]?.color, skuInfo[i.sku]?.medida].filter(Boolean).join(' · '))}</div></td><td>${esc(i.destino.replace('_', ' '))}</td><td class="r num">${i.cantidad_pedida}</td><td class="r num">${i.cantidad_recibida}</td><td class="r num ${!i.recibido_completo && x.estado !== 'cancelado' ? 'warn-t' : ''}">${x.estado === 'cancelado' ? '' : Math.max(0, i.cantidad_pedida - i.cantidad_recibida)}</td></tr>`).join('')}</tbody></table></div>
      ${x.unidad_medida === 'bultos' ? '<div class="cc-nota">Pedido en bultos: la recepción automática no cuenta bultos, el recibido hay que confirmarlo a mano.</div>' : ''}</details>`; }).join('')
    : '<p class="muted">No hay pedidos de reposición con ese nombre todavía.</p>');
}
function nombresRepoOpc() {
  const w = (prov.nombre.toLowerCase().match(/[a-záéíóúñ]{4,}/g) || []), ya = prov.repo_nombres || [];
  return nombresRepo.filter((n) => !ya.includes(n)).sort((a, b) => w.filter((x) => b.toLowerCase().includes(x)).length - w.filter((x) => a.toLowerCase().includes(x)).length);
}
async function guardarVinculo(lista) { await sb.from('cc_proveedores').update({ repo_nombres: lista }).eq('id', id); prov.repo_nombres = lista; await cargarPedidos(); pintar(); }
function mercaderia() {
  return `<section class="card tabla" style="margin-top:16px"><div class="cab"><h2>Mercadería recibida</h2></div><div class="scroll">${recs.length ? `<table><thead><tr><th scope="col">Fecha</th><th scope="col">Remito</th><th scope="col" class="r">Bultos</th><th scope="col" class="r">Unidades</th><th scope="col">Mati dice</th><th scope="col">Estado</th></tr></thead><tbody>
    ${recs.map((r) => `<tr class="click" onclick="location.href='recepcion.html?id=${r.id}'"><td>${fechaHora(r.fecha)}</td><td>${esc(r.nro_remito || 's/n')}</td><td class="r">${r.bultos ?? ''}</td><td class="r num">${r.unidades_contadas}</td><td>${r.recibido_completo ? '<span class="chip ok">Completo</span>' : '<span class="chip bad">Faltante</span>'}</td><td>${chipEstado(r.estado)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="muted" style="padding:0 24px 12px">Todavía no hay recepciones cargadas desde el depósito para este proveedor.</p>'}</div></section>`;
}

function pintar() {
  const [sem, sc] = semaforo(a.saldo, a.ultimoPago?.dias ?? null);
  $('#app').innerHTML = `<p class="small"><a href="proveedores.html">← Todos los proveedores</a></p>
  <div class="cabecera"><div><div class="row" style="gap:10px"><h1>${esc(prov.nombre)}</h1>${prov.activo ? '' : '<span class="chip">inactivo</span>'}</div><p>${prov.grupo ? 'Grupo: ' + esc(prov.grupo) + ' · ' : ''}Saldo ${peso0(a.saldo)} · ${a.n} movimientos${a.desde ? ' desde ' + fecha(a.desde) : ''}</p></div>
    <div class="row wrapRow"><button class="btn" id="activo">${prov.activo ? 'Marcar inactivo' : 'Reactivar'}</button><a class="btn" href="nuevo.html?proveedor=${id}&tipo=comprobante">Cargar factura</a><a class="btn primary" href="nuevo.html?proveedor=${id}&tipo=pago">Registrar pago</a></div></div>
  <div class="seg" role="group" aria-label="Sección" style="margin:20px 0 4px">${[['resumen', 'Centro de comando'], ['cc', 'Cuenta corriente'], ['ped', 'Pedidos'], ['rec', 'Mercadería recibida']].map(([k, t]) => `<button type="button" aria-pressed="${tab === k}" data-tab="${k}">${t}</button>`).join('')}</div>
  ${tab === 'resumen' ? resumen() : tab === 'cc' ? cuenta() : tab === 'ped' ? tabPedidos() : mercaderia()}`;
  $$('[data-tab]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); tab = b.dataset.tab; pintar(); scrollTo(0, 0); }));
  const vb = $('#vincular'); if (vb) vb.onclick = () => { const v = $('#nrepo').value; if (v) guardarVinculo([...(prov.repo_nombres || []), v]); };
  $$('[data-quitar]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); guardarVinculo((prov.repo_nombres || []).filter((n) => n !== b.dataset.quitar)); }));
  const an = $('#anio'); if (an) an.onchange = () => { anio = an.value; pintar(); };
  $$('[data-solo]').forEach((b) => (b.onclick = () => { solo = b.dataset.solo; mostrar = PAG; pintar(); }));
  const mas = $('#mas'); if (mas) mas.onclick = () => { mostrar += PAG; pintar(); };
  $('#activo').onclick = async () => { await sb.from('cc_proveedores').update({ activo: !prov.activo }).eq('id', id); prov.activo = !prov.activo; pintar(); };
  $$('[data-cobrado]').forEach((b) => (b.onclick = async () => { await sb.from('cc_movimientos').update({ cheque_cobrado: true }).eq('id', b.dataset.cobrado); await cargarMovs(); pintar(); }));
}
activarTooltips();
pintar();
</script>
</body>
</html>
