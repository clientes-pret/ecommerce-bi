<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashflow · Panel de control</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=11">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
// Cashflow (percibido): plata que entra y sale por mes. Todavía sin saldos de bancos ni liberaciones reales:
// - Entradas ML/TN: facturación neta del scorecard corrida por el plazo de liberación (editable). Días sin neta:
//   ventas × % neto promedio del canal (TN Laván no tiene neta: usa el % de TN Pret).
// - Local: lo cobrado (ventas del local). Salidas: pagos a proveedores (cc_movimientos), envíos TN, publicidad,
//   costos de Costos (se asumen pagados en su mes), adelantos de sueldo y gastos pagados con la caja del local.
// - Meses futuros: costos que se repiten + adelantos ya cargados; el resto, promedio de los últimos meses completos.
import { sb, $, guard, nav, peso0, leerTodo, sumarMes } from './app.js';
import { corto as cortoM, MESN, activarTooltips } from './analisis.js?v=5';
const perfil = await guard(['admin', 'dueno']);
nav(perfil, 'cashflow');

const DAY = 864e5;
const nom = (ym) => `${MESN[Number(ym.slice(5)) - 1]} ${ym.slice(0, 4)}`;
const etq = (ym) => { const n = MESN[Number(ym.slice(5)) - 1]; return n.charAt(0).toUpperCase() + n.slice(1, 3) + ' ' + ym.slice(2, 4); };
const masDias = (s, n) => new Date(Date.parse(s + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10);
const diasMes = (ym) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
const leerNum = (k, def) => { try { const v = Number(localStorage.getItem(k)); return Number.isFinite(v) && localStorage.getItem(k) !== null ? v : def; } catch { return def; } };
let plazoML = leerNum('cf_plazo_ml', 7), plazoTN = leerNum('cf_plazo_tn', 7);

await sb.rpc('cc_costos_al_dia');
const desde = '2026-05-01';
const [filas, ads, movs, costos, reglas, adelantos] = await Promise.all([
  leerTodo('scorecard_canal_dia', 'fecha,marca,canal,ventas,facturacion_neta,costo_envio,local_gastado', ['fecha', 'marca', 'canal'], (q) => q.gte('fecha', desde)),
  leerTodo('scorecard_ads_dia', 'fecha,marca,plataforma,inversion', ['fecha', 'marca', 'plataforma'], (q) => q.gte('fecha', desde)),
  leerTodo('cc_movimientos', 'id,fecha,pago', ['fecha', 'id'], (q) => q.eq('tipo', 'pago').gte('fecha', desde)),
  leerTodo('cc_costos', 'id,tipo,monto,periodo,recurrente_id', ['periodo', 'id'], (q) => q.gte('periodo', desde)),
  leerTodo('cc_costos_recurrentes', 'id,tipo,monto,desde,hasta', ['id']),
  leerTodo('cc_adelantos_sueldo', 'id,fecha,monto,descuenta_mes', ['id']),
]);
const ultimo = filas.filter((f) => f.ventas != null).reduce((m, f) => (f.fecha > m ? f.fecha : m), '');
const ACTUAL = ultimo.slice(0, 7);
// Meses completos: los anteriores al actual en que Mercado Libre Pret tiene todos los días cargados.
const diasML = {}; for (const f of filas) if (f.marca === 'pret' && f.canal === 'ml' && f.ventas != null) diasML[f.fecha.slice(0, 7)] = (diasML[f.fecha.slice(0, 7)] || 0) + 1;
const completos = Object.keys(diasML).filter((m) => m < ACTUAL && diasML[m] >= diasMes(m)).sort();
const BASE = completos.slice(-3);
const MESES = [...completos.slice(-2), ACTUAL, sumarMes(ACTUAL, 1), sumarMes(ACTUAL, 2), sumarMes(ACTUAL, 3)];
const proyectado = (m) => m > ACTUAL;

function calcular() {
  const fila = () => Object.fromEntries(MESES.map((m) => [m, 0]));
  const sumar = (obj, ym, v) => { if (ym in obj) obj[ym] += v; };
  // % neto por canal (neta / ventas en los días que tienen neta) para estimar los días sin neta.
  const ratio = {};
  for (const k of ['pret_ml', 'pret_tn', 'lavan_ml', 'lavan_tn']) {
    let n = 0, v = 0; for (const f of filas) if (`${f.marca}_${f.canal}` === k && f.facturacion_neta != null && f.ventas != null) { n += Number(f.facturacion_neta); v += Number(f.ventas); }
    ratio[k] = v > 0 ? n / v : null;
  }
  ratio.lavan_tn ??= ratio.pret_tn; ratio.lavan_ml ??= ratio.pret_ml;
  const ent = { 'Mercado Libre · Pret': fila(), 'Mercado Libre · Laván': fila(), 'Tienda Nube · Pret': fila(), 'Tienda Nube · Laván': fila(), 'Local (cobrado)': fila() };
  const sal = { 'Pagos a proveedores': fila(), 'Envíos Tienda Nube': fila(), 'Publicidad': fila(), 'Costos fijos': fila(), 'Costos variables': fila(), 'Adelantos de sueldo': fila(), 'Adelantos descontados del sueldo': fila(), 'Gastos pagados con la caja del local': fila() };
  const NOMBRE = { pret_ml: 'Mercado Libre · Pret', lavan_ml: 'Mercado Libre · Laván', pret_tn: 'Tienda Nube · Pret', lavan_tn: 'Tienda Nube · Laván' };
  for (const f of filas) {
    const k = `${f.marca}_${f.canal}`;
    if (f.canal === 'local') {
      if (f.ventas != null) sumar(ent['Local (cobrado)'], f.fecha.slice(0, 7), Number(f.ventas));
      if (f.local_gastado != null) sumar(sal['Gastos pagados con la caja del local'], f.fecha.slice(0, 7), -Number(f.local_gastado));
      continue;
    }
    const neta = f.facturacion_neta != null ? Number(f.facturacion_neta) : f.ventas != null && ratio[k] != null ? Number(f.ventas) * ratio[k] : null;
    if (neta != null) sumar(ent[NOMBRE[k]], masDias(f.fecha, f.canal === 'ml' ? plazoML : plazoTN).slice(0, 7), neta);
    if (f.canal === 'tn' && f.costo_envio != null) sumar(sal['Envíos Tienda Nube'], f.fecha.slice(0, 7), -Number(f.costo_envio));
  }
  for (const a of ads) if (a.inversion != null) sumar(sal['Publicidad'], a.fecha.slice(0, 7), -Number(a.inversion));
  for (const m of movs) sumar(sal['Pagos a proveedores'], m.fecha.slice(0, 7), -Number(m.pago));
  for (const c of costos) if (!proyectado(c.periodo.slice(0, 7))) sumar(sal[c.tipo === 'fijo' ? 'Costos fijos' : 'Costos variables'], c.periodo.slice(0, 7), -Number(c.monto));
  for (const a of adelantos) { sumar(sal['Adelantos de sueldo'], a.fecha.slice(0, 7), -Number(a.monto)); sumar(sal['Adelantos descontados del sueldo'], a.descuenta_mes.slice(0, 7), Number(a.monto)); }

  // Meses futuros: costos que se repiten (y adelantos ya cargados, sumados arriba); el resto, promedio de los meses completos.
  const promNoRec = (t) => (BASE.length ? BASE.reduce((a, m) => a - costos.filter((c) => c.tipo === t && !c.recurrente_id && c.periodo.slice(0, 7) === m).reduce((x, c) => x + Number(c.monto), 0), 0) / BASE.length : 0);
  const baseProm = {};
  for (const [nombre, obj] of [...Object.entries(ent), ...Object.entries(sal)]) baseProm[nombre] = BASE.length ? BASE.reduce((a, m) => a + (obj[m] ?? 0), 0) / BASE.length : 0;
  for (const m of MESES.filter(proyectado)) {
    for (const [nombre, obj] of [...Object.entries(ent), ...Object.entries(sal)]) {
      if (nombre.startsWith('Adelantos')) continue;
      if (nombre === 'Costos fijos' || nombre === 'Costos variables') {
        const t = nombre === 'Costos fijos' ? 'fijo' : 'variable', d = m + '-01';
        const rec = reglas.filter((r) => r.tipo === t && r.desde <= d && (!r.hasta || r.hasta >= d)).reduce((a, r) => a + Number(r.monto), 0);
        obj[m] = -rec + promNoRec(t);
      } else obj[m] = baseProm[nombre];
    }
  }
  const total = (grupo) => Object.fromEntries(MESES.map((m) => [m, Object.values(grupo).reduce((a, o) => a + o[m], 0)]));
  const totEnt = total(ent), totSal = total(sal);
  const neto = Object.fromEntries(MESES.map((m) => [m, totEnt[m] + totSal[m]]));
  let acum = 0; const acumulado = Object.fromEntries(MESES.map((m) => [m, (acum += neto[m])]));
  return { ent, sal, totEnt, totSal, neto, acumulado, ratio };
}

function pintar() {
  const r = calcular();
  const fmt = (v) => (Math.abs(v) < 0.5 ? '—' : peso0(v));
  const celda = (m, v, extra = '') => `<td class="r num" style="${proyectado(m) ? 'background:#F3F5FC;' : ''}${extra}">${fmt(v)}</td>`;
  const grupo = (titulo) => `<tr><th scope="rowgroup" colspan="${MESES.length + 1}" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:18px">${titulo}</th></tr>`;
  const linea = (nombre, obj) => (MESES.some((m) => Math.abs(obj[m]) >= 0.5) ? `<tr><th scope="row" style="font-weight:400;padding-left:40px">${nombre}</th>${MESES.map((m) => celda(m, obj[m])).join('')}</tr>` : '');
  const tot = (nombre, obj, estilo = '') => `<tr class="total"><th scope="row">${nombre}</th>${MESES.map((m) => celda(m, obj[m], `font-weight:700;${estilo}`)).join('')}</tr>`;
  const netoFila = `<tr class="total"><th scope="row">Neto del mes</th>${MESES.map((m) => celda(m, r.neto[m], `font-weight:700;${r.neto[m] < 0 ? 'color:var(--bad);' : ''}`)).join('')}</tr>`;
  const acumFila = `<tr><th scope="row" style="font-weight:500;color:var(--muted)">Neto acumulado desde ${etq(MESES[0])}</th>${MESES.map((m) => celda(m, r.acumulado[m], 'color:var(--muted);')).join('')}</tr>`;
  const mx = Math.max(1, ...MESES.map((m) => Math.abs(r.neto[m])));
  const W = 720, H = 200, pl = 56, pb = 26, mid = (H - pb) / 2, bw = (W - pl) / MESES.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Neto por mes"><line class="ax" x1="${pl}" x2="${W}" y1="${mid}" y2="${mid}"/>`;
  svg += `<text x="${pl - 6}" y="14" text-anchor="end">${cortoM(mx)}</text><text x="${pl - 6}" y="${mid + 4}" text-anchor="end">$0</text><text x="${pl - 6}" y="${H - pb}" text-anchor="end">-${cortoM(mx)}</text>`;
  MESES.forEach((m, i) => {
    const v = r.neto[m], h = Math.abs(v) / mx * (mid - 8), x = pl + i * bw + bw * 0.2;
    svg += `<rect x="${x}" y="${v >= 0 ? mid - h : mid}" width="${bw * 0.6}" height="${Math.max(1, h)}" rx="2" fill="${v < 0 ? '#B42318' : '#2449B8'}" opacity="${proyectado(m) ? 0.4 : 1}"/>`;
    svg += `<text x="${x + bw * 0.3}" y="${H - 8}" text-anchor="middle">${etq(m)}${m === ACTUAL ? ' *' : ''}</text>`;
    svg += `<rect class="hit" x="${pl + i * bw}" y="0" width="${bw}" height="${H - pb}" data-t="${nom(m)}${proyectado(m) ? ' (proyectado)' : ''}|Entra: ${peso0(r.totEnt[m])}|Sale: ${peso0(-r.totSal[m])}|Neto: ${peso0(v)}"/>`;
  });
  svg += '</svg>';
  const fut = MESES.filter(proyectado), netoFut = fut.reduce((a, m) => a + r.neto[m], 0);
  const peor = fut.reduce((p, m) => (r.neto[m] < r.neto[p] ? m : p), fut[0]);
  const pctNeto = (k) => (r.ratio[k] == null ? '—' : (r.ratio[k] * 100).toFixed(0) + '%');

  $('#app').innerHTML = `<div class="cabecera"><div><h1>Cashflow</h1><p>Plata que entra y sale por mes · Pret a Home + Casa Laván · estimado desde las ventas, sin saldos de bancos todavía</p></div>
    <div class="row wrapRow"><label for="pml" style="margin:0">Liberación ML</label><input id="pml" type="number" min="0" max="60" value="${plazoML}" style="width:80px"><span class="muted small">días</span>
    <label for="ptn" style="margin:0 0 0 8px">Liberación TN</label><input id="ptn" type="number" min="0" max="60" value="${plazoTN}" style="width:80px"><span class="muted small">días</span></div></div>
  <div class="centro-comando">
    <div class="cc-card"><div class="cc-label">Entró en ${nom(ACTUAL)} (hasta el ${ultimo.slice(8, 10)}/${ultimo.slice(5, 7)})</div><div class="cc-valor num">${peso0(r.totEnt[ACTUAL])}</div><div class="cc-sub">ventas liberadas + cobrado en el local</div></div>
    <div class="cc-card"><div class="cc-label">Salió en ${nom(ACTUAL)}</div><div class="cc-valor num">${peso0(-r.totSal[ACTUAL])}</div><div class="cc-sub">${peso0(-r.sal['Pagos a proveedores'][ACTUAL])} a proveedores</div></div>
    <div class="cc-card ${r.neto[ACTUAL] < 0 ? 'alerta' : ''}"><div class="cc-label">Neto de ${nom(ACTUAL)} hasta hoy</div><div class="cc-valor num">${peso0(r.neto[ACTUAL])}</div><div class="cc-sub">mes en curso</div></div>
    <div class="cc-card ${netoFut < 0 ? 'alerta' : 'destacada'}"><div class="cc-label">Proyección próximos 3 meses</div><div class="cc-valor num">${peso0(netoFut)}</div><div class="cc-sub">mes más flojo: ${nom(peor)} (${peso0(r.neto[peor])})</div></div>
  </div>
  <section class="card chart"><div class="row between wrapRow"><h2 style="margin:0">Neto por mes</h2><span class="leyenda" style="margin:0"><span><i style="background:#2449B8"></i>Real</span><span><i style="background:#2449B8;opacity:.4"></i>Proyectado</span><span><i style="background:#B42318"></i>Negativo</span></span></div>${svg}
    <div class="cc-nota">* ${nom(ACTUAL)} está en curso: datos hasta el ${ultimo.slice(8, 10)}/${ultimo.slice(5, 7)}.</div></section>
  <section class="card tabla"><div class="cab"><div><h2>Entradas y salidas por categoría</h2><span class="muted">Columnas en celeste: proyectado</span></div></div>
    <div class="scroll"><table style="min-width:900px"><thead><tr><th scope="col">Categoría</th>${MESES.map((m) => `<th scope="col" class="r" style="${proyectado(m) ? 'background:#F3F5FC;' : ''}">${etq(m)}<div class="small" style="font-weight:400">${proyectado(m) ? 'proyectado' : m === ACTUAL ? 'en curso' : 'real'}</div></th>`).join('')}</tr></thead>
    <tbody>${grupo('Entradas')}${Object.entries(r.ent).map(([n, o]) => linea(n, o)).join('')}${tot('Total entradas', r.totEnt)}
    ${grupo('Salidas')}${Object.entries(r.sal).map(([n, o]) => linea(n, o)).join('')}${tot('Total salidas', r.totSal)}
    ${netoFila}${acumFila}</tbody></table></div></section>
  <p class="muted small" style="line-height:1.6">Estimado, no son movimientos de cuentas. Entradas de Mercado Libre y Tienda Nube: facturación neta del scorecard, corrida por el plazo de liberación de arriba (el que cargues queda guardado en este navegador). Días sin facturación neta cargada: ventas × % neto promedio del canal (ML Pret ${pctNeto('pret_ml')}, ML Laván ${pctNeto('lavan_ml')}, TN Pret ${pctNeto('pret_tn')}; TN Laván usa el de TN Pret). Los costos cargados en Costos se toman como pagados en su mes; los adelantos de sueldo salen el día que se dan y se descuentan del sueldo del mes elegido. Meses proyectados: costos que se repiten y adelantos ya cargados; el resto, promedio de ${BASE.map(nom).join(', ') || 'los meses completos'}. Falta conectar MercadoPago y Pago Nube para usar liberaciones y saldos reales.</p>`;
  const guardarPlazo = (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} };
  $('#pml').onchange = (e) => { plazoML = Math.max(0, Math.min(60, Math.round(+e.target.value || 0))); guardarPlazo('cf_plazo_ml', plazoML); pintar(); };
  $('#ptn').onchange = (e) => { plazoTN = Math.max(0, Math.min(60, Math.round(+e.target.value || 0))); guardarPlazo('cf_plazo_tn', plazoTN); pintar(); };
}
activarTooltips();
pintar();
</script>
</body>
</html>
