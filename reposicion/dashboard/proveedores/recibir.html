<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recepción · Proveedores</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="estilo.css?v=12">
  <style>
    /* Recepción del depósito: botones grandes, una mano, nada que tipear salvo cantidades grandes. */
    .it { border-left: 6px solid var(--line-strong); padding: 14px 16px; }
    .it.ok { border-left-color: var(--ok); } .it.warn { border-left-color: #E07B24; } .it.falta { border-left-color: var(--line-strong); }
    .it .var { font-size: 17px; font-weight: 600; margin-top: 2px; }
    .barra { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 14px 0 10px; background: linear-gradient(rgba(245,244,240,0), var(--bg) 22%); }
    .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; font-size: 17px; margin-bottom: 8px; min-height: 56px; cursor: pointer; }
    .fila.suma { border-color: var(--ok); background: var(--ok-bg); }
    .fila .k { font-weight: 700; min-width: 34px; text-align: center; border-radius: 999px; background: var(--ok); color: #fff; padding: 3px 10px; }
    .grupo-t { font-weight: 700; margin: 18px 0 8px; font-size: 15px; color: var(--ink-soft); }
    .aviso { background: var(--warn-bg); border: 1px solid #F3C9A6; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; color: var(--warn); }
    .lista-ec { width: 100%; border-collapse: collapse; } .lista-ec td { padding: 8px 4px; border-bottom: 1px solid var(--line-soft); vertical-align: top; } .lista-ec td.q { text-align: right; font-weight: 700; font-size: 18px; white-space: nowrap; }
  </style>
</head>
<body>
<div class="narrow" id="app"></div>
<script type="module">
import { sb, $, esc, guard, salir, fechaHora, achicar } from './app.js';

const perfil = await guard(['deposito', 'admin', 'dueno']);
const app = $('#app');

// ---------- Estado ----------
// El conteo se guarda en el celular en cada toque (si se cierra la pantalla o se va la señal, no se pierde).
const BORR = 'rec_borrador_v1';
const S = { paso: 'inicio', provs: [], busq: '', prov: null, recId: null, items: [], pend: [], dias: 60, paths: [], subiendo: false, enviando: false, err: '', res: null, recientes: [], cargando: false };
const leerBorrador = () => { try { return JSON.parse(localStorage.getItem(BORR) || 'null'); } catch { return null; } };
const guardarBorrador = () => { try { if (S.prov && S.recId) localStorage.setItem(BORR, JSON.stringify({ recId: S.recId, prov: S.prov, items: S.items, paths: S.paths, dias: S.dias })); } catch { /* sin almacenamiento: sigue andando */ } };
const borrarBorrador = () => { try { localStorage.removeItem(BORR); } catch { /* nada */ } };

async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }

const etiqueta = (p) => [p.color, p.medida].filter(Boolean).join(' · ');
const totalU = () => S.items.reduce((a, i) => a + (i.cantidad || 0), 0);
const conCant = () => S.items.filter((i) => i.cantidad > 0);
const pendMap = () => new Map(S.pend.map((p) => [p.sku, p]));
const pendDe = (sku) => { const p = pendMap().get(sku); return p ? p.pendiente : null; };

async function cargarRecientes() {
  try { S.recientes = (await rpc('rec_ultimos', { p_limite: 15 })) || []; } catch (e) { S.recientes = []; S.err = 'No pude traer las últimas cargas: ' + (e.message || 'error'); }
}
async function cargarPend() {
  S.pend = (await rpc('rec_pendientes', { p_proveedor: S.prov, p_dias: S.dias })) || [];
}

// ---------- Pantalla base ----------
function cabecera() {
  return `<div class="row between" style="margin-bottom:8px"><div><b>Hola ${esc(perfil.nombre)}</b><div class="muted small">Recepción de mercadería</div></div>
    <div class="row">${perfil.rol !== 'deposito' ? '<a class="btn sm" href="admin.html">Panel</a>' : ''}<button class="btn sm" id="salir">Salir</button></div></div>`;
}
function barra() {
  const n = { proveedor: 1, contar: 2, confirmar: 3 }[S.paso];
  return n ? `<div class="steps">${[1, 2, 3].map((k) => `<i class="${k <= n ? 'on' : ''}"></i>`).join('')}</div>` : '';
}
function render() {
  const vistas = { inicio: vInicio, proveedor: vProveedor, contar: vContar, confirmar: vConfirmar, listo: vListo, detalle: vListo };
  app.innerHTML = cabecera() + barra() + vistas[S.paso]();
  $('#salir').onclick = salir;
  ({ inicio: bInicio, proveedor: bProveedor, contar: bContar, confirmar: bConfirmar, listo: bListo, detalle: bListo })[S.paso]();
}

// ---------- Inicio ----------
function vInicio() {
  const b = leerBorrador();
  const sinTerminar = b && b.prov && (b.items || []).length
    ? `<div class="card" style="border-color:var(--brand)"><b>Recepción sin terminar</b><div class="muted small">${esc(b.prov)} · ${b.items.length} productos</div>
        <div class="row" style="margin-top:10px"><button class="btn primary grow" id="seguir">Seguir contando</button><button class="btn" id="descartar">Descartar</button></div></div>` : '';
  return `${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}${sinTerminar}<button class="btn primary big" id="nueva">＋ Nueva recepción</button><h2>Últimas cargas</h2>` +
    (S.recientes.length ? S.recientes.map((r) => `<button class="fila" data-id="${r.id}"><span><b>${esc(r.proveedor)}</b><br><span class="muted small">${fechaHora(r.creado_at)} · ${r.productos} productos · ${r.unidades} u.</span></span>
      ${r.estado === 'anulado' ? '<span class="chip">Anulada</span>' : r.avisos > 0 ? '<span class="chip warn">Revisar</span>' : '<span class="chip ok">OK</span>'}</button>`).join('') : '<p class="muted">Todavía no cargaste nada.</p>');
}
function bInicio() {
  $('#nueva').onclick = () => {
    const b = leerBorrador();
    if (b && (b.items || []).length && !confirm('Hay una recepción sin terminar. Si empezás una nueva, esa se descarta. ¿Seguir?')) return;
    empezar();
  };
  if ($('#seguir')) {
    $('#seguir').onclick = async () => {
      const b = leerBorrador();
      Object.assign(S, { recId: b.recId, prov: b.prov, items: b.items || [], paths: b.paths || [], dias: b.dias || 60, err: '' });
      try { await cargarPend(); } catch (e) { S.pend = []; }
      S.paso = 'contar'; render();
    };
    $('#descartar').onclick = () => { if (confirm('¿Descartar lo que contaste?')) { borrarBorrador(); render(); } };
  }
  app.querySelectorAll('[data-id]').forEach((b) => (b.onclick = () => abrirDetalle(b.dataset.id)));
}
async function empezar() {
  borrarBorrador();
  Object.assign(S, { recId: crypto.randomUUID(), prov: null, items: [], pend: [], dias: 60, paths: [], busq: '', err: '', res: null, paso: 'proveedor' });
  S.provs = []; render();
  try { S.provs = (await rpc('rec_proveedores', { p_dias: 60 })) || []; } catch (e) { S.err = 'No pude traer los proveedores: ' + (e.message || 'error'); }
  render();
}

// ---------- 1 · Proveedor ----------
function listaProv() {
  const q = S.busq.toLowerCase();
  const f = S.provs.filter((p) => p.proveedor.toLowerCase().includes(q));
  const con = f.filter((p) => p.unidades > 0), sin = f.filter((p) => !(p.unidades > 0));
  const btn = (p) => `<button class="pick" data-p="${esc(p.proveedor)}"><b>${esc(p.proveedor)}</b>${p.unidades > 0 ? `<br><span class="muted small">${p.ocs} pedido${p.ocs === 1 ? '' : 's'} abierto${p.ocs === 1 ? '' : 's'} · ${p.unidades} u. por recibir</span>` : ''}</button>`;
  return (con.length ? `<div class="grupo-t">Con pedidos abiertos</div>${con.map(btn).join('')}` : '') +
    (sin.length ? `<div class="grupo-t">Sin pedidos abiertos</div>${sin.map(btn).join('')}` : '') ||
    '<p class="muted">No hay proveedores con ese nombre.</p>';
}
function vProveedor() {
  return `<h1>¿De quién es?</h1>${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}<input id="busq" placeholder="Buscar proveedor…" value="${esc(S.busq)}" style="margin-bottom:12px"><div id="lista">${S.provs.length ? listaProv() : '<p class="muted"><span class="spin"></span> Cargando…</p>'}</div><button class="btn" id="cancelar" style="margin-top:8px">Cancelar</button>`;
}
function bProveedor() {
  $('#busq').oninput = (e) => { S.busq = e.target.value; $('#lista').innerHTML = listaProv(); };
  $('#lista').onclick = async (e) => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    S.prov = b.dataset.p; S.err = ''; b.disabled = true;
    try { await cargarPend(); } catch (er) { S.pend = []; S.err = 'No pude traer lo pendiente de este proveedor: ' + (er.message || 'error'); }
    S.paso = 'contar'; guardarBorrador(); render();
  };
  $('#cancelar').onclick = () => { S.paso = 'inicio'; render(); };
}

// ---------- 2 · Contar ----------
function chipItem(i) {
  const pd = pendDe(i.sku), n = i.cantidad || 0;
  if (pd == null) return '<span class="chip warn">No estaba pedido</span>';
  if (n === pd) return '<span class="chip ok">Completo</span>';
  if (n < pd) return `<span class="chip">Faltan ${pd - n}</span>`;
  return `<span class="chip warn">De más +${n - pd}</span>`;
}
function claseItem(i) {
  const pd = pendDe(i.sku), n = i.cantidad || 0;
  return pd == null || n > pd ? 'warn' : n === pd ? 'ok' : 'falta';
}
function cardItem(i) {
  const pd = pendDe(i.sku);
  return `<div class="card it ${claseItem(i)}" data-sku="${esc(i.sku)}"><div class="row between" style="align-items:flex-start"><div>
      <div class="small muted">${esc(i.producto)}</div><div class="var">${esc(etiqueta(i) || i.sku)}</div><div class="small muted">${esc(i.sku)}</div></div>
      <div class="chipbox">${chipItem(i)}</div></div>
    <div class="row wrapRow" style="margin-top:12px"><div class="stepper"><button data-act="menos" aria-label="Menos">−</button><input class="qty" inputmode="numeric" value="${i.cantidad}" aria-label="Cantidad"><button data-act="mas" aria-label="Más">＋</button></div>
      <button class="btn sm danger" data-act="quitar">Quitar</button>${pd != null ? `<span class="small muted">pendiente: ${pd}</span>` : ''}</div></div>`;
}
function vContar() {
  return `<h1>${esc(S.prov)}</h1>
    <p class="muted">Tocá <b>Agregar producto</b>, elegí lo que llegó y después contá con ＋ y −.</p>
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
    <div class="row" style="margin-bottom:12px"><label class="btn grow" style="cursor:pointer;margin:0">📷 ${S.paths.length ? `Foto del remito (${S.paths.length}) · agregar otra` : 'Foto del remito (opcional)'}<input type="file" id="foto" accept="image/*" capture="environment" multiple hidden></label>${S.subiendo ? '<span class="spin"></span>' : ''}</div>
    <div id="items">${S.items.map(cardItem).join('')}</div>
    <button class="btn big" id="agregar">＋ Agregar producto</button>
    <div class="barra"><button class="btn" id="atras">Atrás</button><button class="btn primary grow" id="listo"></button></div>`;
}
function pintarPie() {
  const b = $('#listo'); if (!b) return;
  const n = conCant().length;
  b.disabled = n === 0;
  b.textContent = n ? `Listo · ${n} producto${n === 1 ? '' : 's'} · ${totalU()} u.` : 'Agregá lo que llegó';
}
function pintarItems() { $('#items').innerHTML = S.items.map(cardItem).join(''); pintarPie(); }
function bContar() {
  pintarPie();
  const item = (el) => S.items.find((i) => i.sku === el.closest('[data-sku]').dataset.sku);
  $('#atras').onclick = () => {
    if (S.items.length && !confirm('Si volvés para cambiar de proveedor, se descarta lo que contaste. ¿Seguir?')) return;
    borrarBorrador();
    Object.assign(S, { recId: crypto.randomUUID(), prov: null, items: [], pend: [], dias: 60, paths: [], err: '', paso: 'proveedor' });
    empezarSinBorrar();
  };
  $('#agregar').onclick = abrirSheet;
  $('#listo').onclick = () => { S.paso = 'confirmar'; render(); };
  $('#foto').onchange = async (e) => { const files = [...e.target.files]; e.target.value = ''; await subirFotos(files); };
  const cont = $('#items');
  cont.addEventListener('input', (e) => {
    if (!e.target.classList.contains('qty')) return;
    const i = item(e.target), v = e.target.value.replace(/\D/g, '');
    i.cantidad = v === '' ? 0 : parseInt(v, 10);
    const card = e.target.closest('.it'); card.className = `card it ${claseItem(i)}`; card.querySelector('.chipbox').innerHTML = chipItem(i);
    guardarBorrador(); pintarPie();
  });
  cont.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const i = item(b), a = b.dataset.act;
    if (a === 'menos') i.cantidad = Math.max(0, (i.cantidad || 0) - 1);
    else if (a === 'mas') i.cantidad = (i.cantidad || 0) + 1;
    else if (a === 'quitar') S.items = S.items.filter((x) => x !== i);
    guardarBorrador(); pintarItems();
  });
}
// Volver a la lista de proveedores sin perder el conteo (el borrador queda en el celular).
async function empezarSinBorrar() {
  S.provs = []; S.busq = ''; render();
  try { S.provs = (await rpc('rec_proveedores', { p_dias: 60 })) || []; } catch (e) { S.err = 'No pude traer los proveedores: ' + (e.message || 'error'); }
  render();
}
async function subirFotos(files) {
  if (!files.length) return;
  S.subiendo = true; S.err = ''; render();
  try {
    const uid = (await sb.auth.getSession()).data.session.user.id;
    for (const f of files) {
      const blob = await achicar(f);
      const path = `${uid}/${S.recId}/${S.paths.length + 1}.jpg`;
      const { error } = await sb.storage.from('remitos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      if (error) throw error;
      S.paths.push(path);
    }
    guardarBorrador();
  } catch (e) { S.err = 'No pude subir la foto: ' + (e.message || 'error'); }
  S.subiendo = false; render();
}

// ---------- Hoja "Agregar producto" ----------
// Primero lo que está pedido a este proveedor (agrupado por producto); si no está ahí, se busca en todo el catálogo.
function abrirSheet() {
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = '<div class="row" style="margin-bottom:12px"><input id="q" placeholder="Buscar producto o color…" autocomplete="off"><button class="btn primary" id="hecho"></button></div><div id="res"></div>';
  document.body.appendChild(sheet);
  const q = $('#q', sheet), res = $('#res', sheet);
  let reg = [], cat = null, catQ = '';
  const tokens = () => q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const txt = (p) => `${p.sku} ${p.producto} ${p.color || ''} ${p.medida || ''}`.toLowerCase();
  const cantDe = (sku) => S.items.find((i) => i.sku === sku)?.cantidad || 0;
  // conProducto: en los resultados del catálogo no hay encabezado por producto, así que se muestra el nombre en cada fila.
  const fila = (p, pend, conProducto = false) => {
    reg.push(p); const k = cantDe(p.sku);
    return `<button class="fila ${k ? 'suma' : ''}" data-i="${reg.length - 1}"><span>${conProducto ? `<span class="muted small">${esc(p.producto)}</span><br>` : ''}${esc(etiqueta(p) || p.sku)}${pend != null ? `<br><span class="muted small">pendiente ${pend}</span>` : `<br><span class="muted small">${esc(p.sku)}</span>`}</span>${k ? `<span class="k">${k}</span>` : ''}</button>`;
  };
  const sinPedido = () => { const tk = tokens(); return tk.length > 0 && !S.pend.some((p) => tk.every((t) => txt(p).includes(t))); };
  async function buscarCat() {
    const val = q.value;
    if (!val.trim()) return;
    try { cat = (await rpc('rec_buscar', { p_q: val, p_proveedor: S.prov })) || []; } catch { cat = []; }
    catQ = val; pintar();
  }
  const pintar = () => {
    const top = sheet.scrollTop, tk = tokens(); reg = [];
    const f = S.pend.filter((p) => tk.every((t) => txt(p).includes(t)));
    let html = '', ult = null;
    for (const p of f) {
      if (p.producto !== ult) { html += `<div class="grupo-t">${esc(p.producto)}</div>`; ult = p.producto; }
      html += fila(p, p.pendiente);
    }
    if (!f.length) html += S.pend.length ? '<p class="muted">Nada pedido coincide con esa búsqueda.</p>' : '<p class="muted">Este proveedor no tiene pedidos abiertos. Buscá el producto en el catálogo.</p>';
    if (tk.length) {
      html += `<div class="grupo-t">¿No estaba pedido?</div>`;
      if (cat && catQ === q.value) html += cat.length ? cat.map((p) => fila(p, pendDe(p.sku), true)).join('') : '<p class="muted">No encontré nada en el catálogo.</p>';
      else html += '<button class="btn big" id="buscarCat">🔍 Buscar en todo el catálogo</button>';
    }
    if (S.dias < 3650) html += '<p style="margin-top:18px"><button class="btn sm" id="viejos">Ver pedidos de más de 60 días</button></p>';
    res.innerHTML = html; sheet.scrollTop = top;
    const n = conCant().length; $('#hecho', sheet).textContent = n ? `Listo (${n})` : 'Cerrar';
  };
  let tcat;
  // Si nada de lo pedido coincide, se busca solo en el catálogo (sin tocar otro botón).
  q.oninput = () => { pintar(); clearTimeout(tcat); if (sinPedido()) tcat = setTimeout(buscarCat, 350); };
  $('#hecho', sheet).onclick = () => { sheet.remove(); pintarItems(); };
  res.onclick = async (e) => {
    const f = e.target.closest('[data-i]');
    if (f) {
      const p = reg[+f.dataset.i], ex = S.items.find((i) => i.sku === p.sku);
      if (ex) ex.cantidad = (ex.cantidad || 0) + 1; else S.items.push({ sku: p.sku, producto: p.producto, color: p.color || null, medida: p.medida || null, cantidad: 1 });
      guardarBorrador(); pintar(); return;
    }
    if (e.target.closest('#buscarCat')) { e.target.closest('#buscarCat').disabled = true; await buscarCat(); return; }
    if (e.target.closest('#viejos')) {
      S.dias = 3650; try { await cargarPend(); } catch { /* queda lo que había */ }
      guardarBorrador(); pintar();
    }
  };
  pintar(); q.focus();
}

// ---------- 3 · Confirmar ----------
function avisosLocales() {
  return conCant().map((i) => ({ i, pd: pendDe(i.sku) })).filter(({ i, pd }) => pd == null || i.cantidad > pd);
}
function vConfirmar() {
  const av = avisosLocales();
  return `<h1>Confirmar</h1><p class="muted">${esc(S.prov)} · ${conCant().length} productos · ${totalU()} unidades</p>
    ${av.length ? `<div class="aviso"><b>Revisá esto antes de guardar</b>${av.map(({ i, pd }) => `<div class="small" style="margin-top:6px">${esc(etiqueta(i) || i.sku)} <span class="muted">(${esc(i.producto)})</span>: ${pd == null ? 'no estaba pedido' : `pedidos ${pd}, contaste ${i.cantidad}`}</div>`).join('')}</div>` : ''}
    <div class="card">${conCant().map((i) => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line-soft)"><span>${esc(etiqueta(i) || i.sku)}<span class="muted small"> · ${esc(i.producto)}</span></span><b>${i.cantidad}</b></div>`).join('')}</div>
    <p class="err">${esc(S.err)}</p>
    <div class="barra"><button class="btn" id="atras">Volver a contar</button><button class="btn primary grow" id="guardar" ${S.enviando ? 'disabled' : ''}>${S.enviando ? 'Guardando…' : 'Guardar recepción'}</button></div>`;
}
function bConfirmar() {
  $('#atras').onclick = () => { S.err = ''; S.paso = 'contar'; render(); };
  $('#guardar').onclick = guardar;
}
async function guardar() {
  S.enviando = true; S.err = ''; render();
  try {
    const items = conCant().map((i) => ({ sku: i.sku, cantidad: i.cantidad }));
    S.res = await rpc('rec_confirmar', { p_id: S.recId, p_proveedor: S.prov, p_items: items, p_remito_paths: S.paths, p_notas: null });
    borrarBorrador(); await cargarRecientes(); S.paso = 'listo';
  } catch (e) { S.err = 'No se pudo guardar: ' + (e.message || 'error') + '. Lo que contaste sigue acá, probá de nuevo.'; }
  S.enviando = false; render();
}

// ---------- Listo / detalle ----------
const TIPO = {
  de_mas: (x) => `Llegó de más: se esperaban ${x.pendiente_antes}, contaste ${x.cantidad}. Sobran ${x.sobrante}.`,
  no_pedido: () => 'No estaba pedido en ninguna orden.',
  en_bultos: () => 'Está pedido en bultos: esas unidades no se descontaron de la orden.',
};
function vListo() {
  const d = S.res; if (!d) return '<p class="muted">No encontré esa recepción.</p>';
  const items = d.items || [], av = items.filter((x) => TIPO[x.tipo]);
  const faltan = items.filter((x) => x.tipo === 'falta');
  return `<div style="text-align:center;padding-top:8px"><div style="font-size:3rem">${d.estado === 'anulado' ? '🚫' : '✅'}</div><h1>${d.estado === 'anulado' ? 'Recepción anulada' : S.paso === 'listo' ? 'Guardado' : 'Recepción'}</h1>
    <p class="muted">${esc(d.proveedor)} · ${fechaHora(d.creado_at)}</p></div>
    ${av.length ? `<div class="aviso"><b>Avisos</b>${av.map((x) => `<div class="small" style="margin-top:6px"><b>${esc(etiqueta(x) || x.sku)}</b> <span>(${esc(x.producto)})</span><br>${TIPO[x.tipo](x)}</div>`).join('')}</div>` : ''}
    ${faltan.length ? `<p class="small muted">Faltan por llegar: ${faltan.map((x) => `${esc(etiqueta(x) || x.sku)} (${x.pendiente_antes - x.cantidad})`).join(', ')}.</p>` : ''}
    <h2>Lo que llegó</h2><div class="card"><table class="lista-ec"><tbody>${items.map((x) => `<tr><td><b>${esc(x.sku)}</b><div class="small muted">${esc(x.producto)}${etiqueta(x) ? ' · ' + esc(etiqueta(x)) : ''}</div></td><td class="q">${x.cantidad}</td></tr>`).join('')}</tbody></table></div>
    <button class="btn big" id="copiar">📋 Copiar lista para Ecomm-App</button>
    ${d.estado === 'confirmado' ? '<button class="btn danger" id="anular" style="margin-top:12px;width:100%">Anular esta recepción</button>' : ''}
    <p class="err">${esc(S.err)}</p>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="inicio">Inicio</button><button class="btn primary grow" id="otra">Nueva recepción</button></div>`;
}
function bListo() {
  if (!S.res) { $('#inicio').onclick = volverInicio; return; }
  $('#inicio').onclick = volverInicio;
  $('#otra').onclick = empezar;
  $('#copiar').onclick = async (e) => {
    const t = (S.res.items || []).map((x) => `${x.sku}\t${x.cantidad}`).join('\n');
    try { await navigator.clipboard.writeText(t); }
    catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    e.target.textContent = '✓ Copiado';
  };
  if ($('#anular')) $('#anular').onclick = async () => {
    if (!confirm('¿Anular esta recepción? Se devuelve lo que se había descontado de las órdenes de compra.')) return;
    try { await rpc('rec_anular', { p_id: S.res.id }); await cargarRecientes(); S.err = ''; volverInicio(); }
    catch (e) { S.err = 'No se pudo anular: ' + (e.message || 'error'); render(); }
  };
}
async function volverInicio() { S.paso = 'inicio'; S.err = ''; await cargarRecientes(); render(); }
async function abrirDetalle(id) {
  try { S.res = await rpc('rec_detalle', { p_id: id }); S.paso = 'detalle'; S.err = ''; }
  catch (e) { S.err = 'No pude abrir esa recepción: ' + (e.message || 'error'); S.paso = 'inicio'; }
  render();
}

await cargarRecientes();
render();
</script>
</body>
</html>
