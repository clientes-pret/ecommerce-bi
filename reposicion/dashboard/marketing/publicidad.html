<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicidad · Marketing Pret a Home</title>
  <link rel="icon" href="../proveedores/icon-192.png">
  <meta name="theme-color" content="#F5F4F0">
  <link rel="stylesheet" href="../proveedores/estilo.css?v=12">
  <link rel="stylesheet" href="marketing.css?v=3">
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
// Publicidad: a dónde llevan los anuncios de Meta y de Google Ads y qué pasa con esas visitas. Todo sale de GA4 (la fuente de cada
// sesión y la página a la que entró): sesiones y compras por página de destino, y el gasto y los clics de Google Ads por campaña.
// El gasto de Meta por producto y por anuncio llega en otra etapa (necesita un permiso de lectura de la cuenta publicitaria).
import { sb, $, $$, esc, guard, navMarketing, leerTodo } from '../proveedores/app.js';
import { n0, pct, peso, hace, sinDatos, tipoPagina, urlSitio, FUENTES, fmtRoas } from './mkt-lib.js';

const perfil = await guard(['admin', 'dueno', 'marketing']);
navMarketing(perfil, 'publicidad');

const st = { dias: 7, tipo: '', todas: false };
let paginas = [], google = [], productos = new Map(), metaRes = null, metaPag = [];

async function cargar() {
  const [p, g] = await Promise.all([sb.rpc('mkt_ads_paginas', { p_dias: st.dias }), sb.rpc('mkt_ads_google', { p_dias: st.dias })]);
  if (p.error) throw p.error;
  if (g.error) throw g.error;
  paginas = p.data; google = g.data;
  // Gasto de Meta (null si todavía no está la migración o no se cargó nada: la pantalla sigue andando sin esa parte).
  const [mr, mp] = await Promise.all([sb.rpc('mkt_ads_meta_resumen', { p_dias: st.dias }), sb.rpc('mkt_ads_meta_paginas', { p_dias: st.dias })]);
  metaRes = !mr.error && mr.data?.[0] && Number(mr.data[0].gasto_total) > 0 ? mr.data[0] : null;
  metaPag = mp.error ? [] : mp.data;
}
try {
  await cargar();
  const prods = await leerTodo('mkt_producto', 'product_id,handle,nombre', ['product_id']);
  productos = new Map(prods.filter((x) => x.handle).map((x) => ['/productos/' + x.handle.toLowerCase(), x]));
} catch (e) { $('#app').innerHTML = `<div class="cabecera"><div><h1>Publicidad</h1></div></div>` + sinDatos(e); throw e; }

// Una fila por página con las dos fuentes en columnas.
function porPagina() {
  const m = new Map();
  for (const r of paginas) {
    const x = m.get(r.pagina) || { pagina: r.pagina, sm: 0, cm: 0, sg: 0, cg: 0 };
    if (r.fuente === 'meta') { x.sm += Number(r.sesiones); x.cm += Number(r.compras); } else { x.sg += Number(r.sesiones); x.cg += Number(r.compras); }
    m.set(r.pagina, x);
  }
  for (const r of metaPag) {                                   // el gasto de Meta por página de destino (puede haber páginas que GA4 no vio)
    const x = m.get(r.pagina) || { pagina: r.pagina, sm: 0, cm: 0, sg: 0, cg: 0 };
    x.gm = Number(r.gasto);
    m.set(r.pagina, x);
  }
  return [...m.values()].map((x) => ({ ...x, st: x.sm + x.sg, ct: x.cm + x.cg, tipo: tipoPagina(x.pagina) })).sort((a, b) => b.st - a.st || a.pagina.localeCompare(b.pagina));
}

const kpi = (l, v, sub = '', cls = '') => `<div class="cc-card ${cls}"><div class="cc-label">${l}</div><div class="cc-valor">${v}</div>${sub ? `<div class="cc-sub">${sub}</div>` : ''}</div>`;
const nombrePagina = (x) => { const p = productos.get(x.pagina); return p ? { txt: p.nombre, ficha: `producto.html?id=${p.product_id}` } : { txt: x.pagina === '/' ? 'Página de inicio' : x.pagina, ficha: '' }; };

function tablaPaginas(filas) {
  const lim = st.todas ? filas.length : 30;
  return `<div class="scroll"><table><thead><tr><th>Página de destino</th><th>Tipo</th><th class="r">Meta<div class="muted small" style="font-weight:400">sesiones / compras</div></th><th class="r">Google Ads<div class="muted small" style="font-weight:400">sesiones / compras</div></th><th class="r">Gasto en Meta<div class="muted small" style="font-weight:400">lo que no es de catálogo</div></th><th class="r">Total sesiones</th><th class="r">Conv.</th></tr></thead><tbody>${
    filas.slice(0, lim).map((x) => {
      const n = nombrePagina(x), conv = x.st ? (x.ct / x.st) * 100 : null;
      const sin = x.st >= 100 && x.ct === 0 ? ' <span class="chip warn" title="Recibe mucho tráfico de anuncios y nadie compró">Sin compras</span>' : '';
      return `<tr ${n.ficha ? `class="click" data-ficha="${n.ficha}"` : ''}><td><div style="min-width:220px">${n.ficha ? `<a class="prov" href="${n.ficha}">${esc(n.txt)}</a>` : `<b>${esc(n.txt)}</b>`}
        <a href="${esc(urlSitio(x.pagina))}" target="_blank" rel="noopener" title="Abrir esta página en la tienda" onclick="event.stopPropagation()">↗</a>${sin}
        <div class="muted small">${esc(x.pagina)}</div></div></td><td><span class="chip ${x.tipo[2]}">${x.tipo[1]}</span></td>
        <td class="r">${n0(x.sm)} / ${n0(x.cm)}</td><td class="r">${n0(x.sg)} / ${n0(x.cg)}</td><td class="r">${x.gm ? peso(x.gm) : '—'}</td><td class="r">${n0(x.st)}</td><td class="r">${conv == null ? '—' : pct(conv, 1)}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Todavía no hay datos de anuncios en este período.</td></tr>'}</tbody></table></div>
    ${filas.length > 30 ? `<div class="mk-pie"><span>${st.todas ? `Mostrando las ${n0(filas.length)} páginas` : `Mostrando las 30 con más tráfico de ${n0(filas.length)}`}</span><button class="btn sm" id="vermas">${st.todas ? 'Ver menos' : 'Ver todas'}</button></div>` : ''}`;
}

function pintar() {
  const todas = porPagina();
  const filas = todas.filter((x) => !st.tipo || x.tipo[0] === st.tipo);
  const suma = (k) => todas.reduce((a, x) => a + x[k], 0), gasto = google.reduce((a, x) => a + Number(x.gasto), 0), clics = google.reduce((a, x) => a + Number(x.clics), 0);
  const conCompras = (c, s) => (s ? pct((c / s) * 100, 1) : '—');
  const tipos = [['', 'Todas'], ['producto', 'Productos'], ['categoria', 'Categorías'], ['inicio', 'Inicio']];
  $('#app').innerHTML = `
  <div class="cabecera"><div><h1>Publicidad</h1><p>A dónde llevan los anuncios de Meta y de Google Ads y qué pasa con esas visitas · ${st.dias} días completos hasta ayer</p></div>
    <div class="seg" role="group" aria-label="Período"><button data-d="7" aria-pressed="${st.dias === 7}">7 días</button><button data-d="30" aria-pressed="${st.dias === 30}">30 días</button></div></div>
  <div class="mk-kpis">
    ${kpi('Meta · sesiones', n0(suma('sm')), `${n0(suma('cm'))} compras · conv. ${conCompras(suma('cm'), suma('sm'))}`)}
    ${kpi('Google Ads · sesiones', n0(suma('sg')), `${n0(suma('cg'))} compras · conv. ${conCompras(suma('cg'), suma('sg'))}`)}
    ${kpi('Google Ads · gasto', peso(gasto), `${n0(clics)} clics${clics ? ` · ${peso(gasto / clics)} por clic` : ''}`)}
    ${metaRes ? kpi('Meta · gasto', peso(metaRes.gasto_total), `ROAS ${fmtRoas(Number(metaRes.gasto_total) > 0 ? Number(metaRes.valor) / Number(metaRes.gasto_total) : null)} · Meta atribuye ${n0(metaRes.compras)} compras<br>catálogo ${peso(metaRes.gasto_catalogo)} · páginas ${peso(metaRes.gasto_paginas)}${Number(metaRes.gasto_sin_destino) > 0 ? ` · sin destino ${peso(metaRes.gasto_sin_destino)}` : ''}`)
      : '<div class="cc-card" style="border-style:dashed"><div class="cc-label">Meta · gasto</div><div class="cc-valor" style="font-size:18px;margin-top:10px">Sin datos todavía</div><div class="cc-sub">Se carga solo cada pocas horas desde la cuenta publicitaria de Meta.</div></div>'}
  </div>
  <div class="card tabla"><div class="cab"><div><h2>Páginas de destino</h2><span class="muted">La URL a la que entra la gente desde un anuncio. Las compras son las de esas sesiones (GA4).</span></div>
    <div class="seg" role="group" aria-label="Tipo de página">${tipos.map(([k, t]) => `<button data-t="${k}" aria-pressed="${st.tipo === k}">${t}</button>`).join('')}</div></div>${tablaPaginas(filas)}</div>
  <div class="card tabla"><div class="cab"><div><h2>Google Ads por campaña</h2><span class="muted">Gasto y clics tal como los trae GA4 (tiene Google Ads vinculado).</span></div></div>
    <div class="scroll"><table><thead><tr><th>Campaña</th><th class="r">Gasto</th><th class="r">Clics</th><th class="r">Costo por clic</th><th class="r">Sesiones</th></tr></thead><tbody>${
      google.map((g) => `<tr><td>${esc(g.campana)}</td><td class="r">${peso(g.gasto)}</td><td class="r">${n0(g.clics)}</td><td class="r">${Number(g.clics) ? peso(Number(g.gasto) / Number(g.clics)) : '—'}</td><td class="r">${n0(g.sesiones)}</td></tr>`).join('')
      || '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">Todavía no hay datos de Google Ads en este período.</td></tr>'}</tbody></table></div></div>
  <p class="muted small">Un anuncio es una sesión que entró por Instagram, Facebook o Audience Network con medio «paid», o por Google con medio «cpc». ${esc(FUENTES.meta)} y ${esc(FUENTES.google)} miden las compras con su propio criterio, así que los números de sus paneles no van a coincidir exacto con estos.</p>`;
  $$('[data-d]').forEach((b) => { b.onclick = async () => { st.dias = +b.dataset.d; st.todas = false; await cargar(); pintar(); }; });
  $$('[data-t]').forEach((b) => { b.onclick = () => { st.tipo = b.dataset.t; st.todas = false; pintar(); }; });
  if ($('#vermas')) $('#vermas').onclick = () => { st.todas = !st.todas; pintar(); };
  $$('tr[data-ficha]').forEach((t) => { t.onclick = () => { location.href = t.dataset.ficha; }; });
}
pintar();
</script>
</body>
</html>
