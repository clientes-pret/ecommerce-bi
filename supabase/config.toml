# La Edge Function no usa Supabase Auth (no hay login de usuarios de Supabase,
# solo la contraseña compartida que valida index.ts vía header X-App-Password).
# Sin verify_jwt = false, la plataforma rechazaría con 401 todo request que no
# traiga un JWT de Supabase válido, antes de que nuestro código corra.
[functions.reposicion-api]
verify_jwt = false

# Misma contraseña compartida (armado de pedidos, reposicion/dashboard/armado.html).
[functions.armado-api]
verify_jwt = false

# Webhooks de Tiendanube (y luego ML): los llama la plataforma, sin JWT de Supabase. La autenticación
# es el token secreto de la URL (?t=...) que valida index.ts contra VENTAS_WEBHOOK_TOKEN.
[functions.ventas-webhook]
verify_jwt = false
